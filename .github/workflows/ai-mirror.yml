# 把捞捞PPT助手要用的大文件搬到国内存储（腾讯云 COS，和安装包同一个桶）：老师在软件里点「一键下载安装」时从国内下，不再去 GitHub / Hugging Face。
#   comfyui   ComfyUI 官方 Windows 整合包（AI 形象的引擎，约 2G）
#   portrait  画 Q版形象要的模型（约 31G）
#   talk      AI 说话视频要的模型（约 35G，Wan 有两种量化）
#   nodes     ComfyUI 插件（固定版本的 zip，很小）
#   gsv       GPT-SoVITS 官方 Windows 整合包（声音克隆，约 8G）
#   hy3d      Hunyuan3D-2 WinPortable（AI 3D 形象）
#   llm       AI 助手（对话改 PPT）的本地大模型 Qwen3-VL-4B（约 3.3G）
#   grid      捞捞算力的训练环境：Python 3.11 安装包 + PyTorch（CUDA 12.8 版）和要用的 Python 包（Windows 版，约 3.5G）
#             + 给 Q版打分用的 CLIP ViT-L/14（openai/clip-vit-large-patch14，MIT，约 1.7G），放在 ai/grid/clip-vit-large-patch14/
#   gridllm   捞捞算力「答题数据工厂」的出题老师 Qwen3-8B（GGUF Q4_K_M，Apache-2.0，约 5G）
#   qabase    捞捞算力训练答题大脑的底子 Qwen3-VL-4B-Instruct（Hugging Face 格式，Apache-2.0，约 9G）
# 同时可以放一份到自己 GitHub 仓库的 Release（mirror-<组名>）：国外的电脑从 GitHub 下，国内的从腾讯云下；超过 1.9G 的切块
# 只在 Actions 页面手动点「Run workflow」时运行（文件大，搬一次要几个小时）；已经搬过、大小一样的会跳过。
# 搬完写官网的 download/ai-mirror.json（软件读这个文件知道国内地址），再让「网站国内加速」同步一次。
# 用的 Secrets 和捞捞编程的安装包一样：CN_S3_ENDPOINT、CN_S3_REGION、CN_S3_BUCKET、CN_S3_KEY_ID、CN_S3_SECRET、CN_DL_BASE。
# 从美国传到广州很慢：桶开了「全球加速」会快很多（腾讯云控制台 → 存储桶 → 域名与传输管理 → 全球加速）。
name: AI 组件搬到国内存储

on:
  workflow_dispatch:
    inputs:
      what:
        description: "搬哪些（逗号隔开）：grid,gridllm,qabase,llm,comfyui,portrait,talk,nodes,gsv,hy3d"
        default: "grid,gridllm,qabase,llm,comfyui,portrait,nodes,gsv"
        required: true
      github:
        description: "同时放一份到自己 GitHub 的 Release（国外的电脑从这里下）：只放捞捞算力要用的这几组（逗号隔开；空 = 不放）"
        default: "grid,gridllm,qabase,llm,comfyui,portrait,nodes,gsv"
        required: false
      accel:
        description: "上传国内存储时用「全球加速」（快很多，但腾讯云按流量另外收钱：几十 G 就是几十块）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-mirror
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.l.outputs.items }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 列出要搬的文件
        id: l
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WHAT: ${{ inputs.what }}
        run: |
          # grid（训练环境）不在这里列，下面单独一个任务用 pip 下载
          WHAT=$(echo "$WHAT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^grid$' | grep -v '^$' | paste -sd, - || true)
          if [ -z "$WHAT" ]; then echo "items=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          items=$(node pptassist/scripts/mirror-list.js "$WHAT")
          echo "items=$items" >> "$GITHUB_OUTPUT"
          echo "$items" | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8"));let t=0;for(const x of a){t+=x.size||0;console.log(x.group.padEnd(9),((x.size||0)/1e9).toFixed(2).padStart(7)+"G ",x.key)}console.log("一共",a.length,"个，约",(t/1e9).toFixed(1)+"G")'

  copy:
    needs: plan
    if: needs.plan.outputs.items != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}
    name: ${{ matrix.item.id }}
    env:
      CN_S3_ENDPOINT: ${{ secrets.CN_S3_ENDPOINT }}
      CN_S3_REGION: ${{ secrets.CN_S3_REGION }}
      CN_S3_BUCKET: ${{ secrets.CN_S3_BUCKET }}
      CN_S3_KEY_ID: ${{ secrets.CN_S3_KEY_ID }}
      CN_S3_SECRET: ${{ secrets.CN_S3_SECRET }}
      CN_DL_BASE: ${{ secrets.CN_DL_BASE }}
      CN_ACCEL: ${{ inputs.accel && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
      GH_GROUPS: ${{ inputs.github }}
      ITEM: ${{ toJSON(matrix.item) }}
    steps:
      - uses: actions/checkout@v4
      - name: 已经搬过（大小一样）就跳过
        id: have
        run: |
          set -uo pipefail
          KEY=$(echo "$ITEM" | jq -r .key); SIZE=$(echo "$ITEM" | jq -r '.size // 0')
          B=$(printf '%s' "$CN_S3_BUCKET" | tr -d '[:space:]'); EP=$(printf '%s' "$CN_S3_ENDPOINT" | tr -d '[:space:]')
          export AWS_ACCESS_KEY_ID=$(printf '%s' "$CN_S3_KEY_ID" | tr -d '[:space:]') AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CN_S3_SECRET" | tr -d '[:space:]') AWS_DEFAULT_REGION=$(printf '%s' "${CN_S3_REGION:-us-east-1}" | tr -d '[:space:]') AWS_EC2_METADATA_DISABLED=true
          aws configure set default.s3.addressing_style virtual
          HAVE=$(aws s3api head-object --bucket "$B" --key "$KEY" --endpoint-url "$EP" --query ContentLength --output text 2>/dev/null || echo 0)
          echo "存储里：$HAVE 字节；源文件：$SIZE 字节"
          G=$(echo "$ITEM" | jq -r .group); NAME=$(echo "$ITEM" | jq -r .name | tr -c 'A-Za-z0-9._+-' '_')
          WANTGH=0; case ",$GH_GROUPS," in *",$G,"*) WANTGH=1;; esac
          GHOK=1
          if [ "$WANTGH" = 1 ]; then
            A=$(gh release view "mirror-$G" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"' 2>/dev/null || true)
            if [ "$SIZE" -le $((1900 * 1048576)) ] 2>/dev/null; then printf '%s\n' "$A" | grep -qx "$NAME $SIZE" || GHOK=0; else printf '%s\n' "$A" | grep -q "^$NAME\.p001 " || GHOK=0; fi
          fi
          echo "wantgh=$WANTGH" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" != "0" ] && [ "$HAVE" = "$SIZE" ] && [ "$GHOK" = 1 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "国内存储和 GitHub 都有了，跳过"; else echo "skip=0" >> "$GITHUB_OUTPUT"; echo "cos=$([ "$SIZE" != "0" ] && [ "$HAVE" = "$SIZE" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"; fi
      - name: 腾出硬盘空间（大文件要二十几 G）
        if: steps.have.outputs.skip != '1' && matrix.item.size > 8000000000
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: 下载
        if: steps.have.outputs.skip != '1'
        run: |
          set -euo pipefail
          URL=$(echo "$ITEM" | jq -r .url)
          mkdir -p "$RUNNER_TEMP/m"; F="$RUNNER_TEMP/m/file"
          for i in 1 2 3 4 5; do
            if curl -fL --retry 5 --retry-all-errors --retry-delay 10 -C - -o "$F" "$URL"; then break; fi
            echo "下载断了，第 $i 次接着下"; sleep 20
          done
          ls -l "$F"
          SIZE=$(echo "$ITEM" | jq -r '.size // 0')
          if [ "$SIZE" != "0" ] && [ "$(stat -c %s "$F")" != "$SIZE" ]; then echo "::error::下载的大小不对"; exit 1; fi
      - name: 传到国内存储（和自己的 GitHub）
        if: steps.have.outputs.skip != '1'
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/m/file"; KEY=$(echo "$ITEM" | jq -r .key); G=$(echo "$ITEM" | jq -r .group); NAME=$(echo "$ITEM" | jq -r .name)
          SHA=$(sha256sum < "$F" | cut -d' ' -f1); SIZE=$(stat -c %s "$F")
          if [ "${{ steps.have.outputs.cos }}" = "1" ]; then URL="$(printf '%s' "$CN_DL_BASE" | tr -d '[:space:]' | sed 's#/*$##')/$KEY"; echo "国内存储已经有了"; else URL=$(bash .github/workflows/cn-put.sh "$F" "$KEY"); fi
          GHU='[]'
          if [ "${{ steps.have.outputs.wantgh }}" = "1" ]; then GHU=$(bash .github/workflows/gh-put.sh "$F" "$G" "$NAME"); fi
          mkdir -p r; echo "$ITEM" | jq --arg u "$URL" --arg s "$SHA" --argjson n "$SIZE" --argjson g "$GHU" '. + {cn: $u, sha256: $s, size: $n, gh: $g}' > r/item.json
          cat r/item.json
      - name: 跳过的也记一笔
        if: steps.have.outputs.skip == '1'
        run: |
          KEY=$(echo "$ITEM" | jq -r .key)
          G=$(echo "$ITEM" | jq -r .group); N=$(echo "$ITEM" | jq -r .name | tr -c 'A-Za-z0-9._+-' '_'); SIZE=$(echo "$ITEM" | jq -r '.size // 0')
          GHU='[]'
          if [ "${{ steps.have.outputs.wantgh }}" = "1" ]; then B="https://github.com/$GITHUB_REPOSITORY/releases/download/mirror-$G"
            if [ "$SIZE" -le $((1900 * 1048576)) ]; then GHU="[\"$B/$N\"]"; else K=$(( (SIZE + 1900 * 1048576 - 1) / (1900 * 1048576) )); GHU=$(seq -f "%03g" 1 $K | jq -R --arg b "$B/$N.p" '$b + .' | jq -sc .); fi; fi
          mkdir -p r; echo "$ITEM" | jq --arg u "$(printf '%s' "$CN_DL_BASE" | tr -d '[:space:]' | sed 's#/*$##')/$KEY" --argjson g "$GHU" '. + {cn: $u, sha256: "", gh: $g}' > r/item.json
      - uses: actions/upload-artifact@v4
        with:
          name: r-${{ matrix.item.id }}
          path: r/item.json
          retention-days: 3

  # 捞捞算力的训练环境（同事电脑上「一键装环境」用）：Python 安装包 + Windows 版的 wheel，用 pip 按依赖关系下载
  grid:
    if: contains(inputs.what, 'grid')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CN_S3_ENDPOINT: ${{ secrets.CN_S3_ENDPOINT }}
      CN_S3_REGION: ${{ secrets.CN_S3_REGION }}
      CN_S3_BUCKET: ${{ secrets.CN_S3_BUCKET }}
      CN_S3_KEY_ID: ${{ secrets.CN_S3_KEY_ID }}
      CN_S3_SECRET: ${{ secrets.CN_S3_SECRET }}
      CN_DL_BASE: ${{ secrets.CN_DL_BASE }}
      CN_ACCEL: ${{ inputs.accel && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
      GH_GROUPS: ${{ inputs.github }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下载 Python 安装包和 Windows 版的 Python 包
        run: |
          set -euo pipefail
          mkdir -p w
          curl -fL --retry 5 -o w/python-3.11.9-amd64.exe https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe
          P="--dest w --only-binary=:all: --platform win_amd64 --python-version 3.11 --implementation cp"
          # PyTorch 只从 CUDA 12.8 的源拿（它的依赖那个源里也有，版本是配好的）
          pip download $P torch torchvision --index-url https://download.pytorch.org/whl/cu128
          # 别的小包从 PyPI
          pip download $P numpy pillow safetensors tqdm colorama filelock typing-extensions sympy networkx jinja2 fsspec mpmath MarkupSafe
          ls -la w; du -sh w
          ls w | grep -q '^torch-.*+cu128' || { echo "::error::没下到 CUDA 版的 torch"; exit 1; }
          # 给 Q版打分用的 CLIP（每日一轮的配方从国内存储下，地址固定：ai/grid/clip-vit-large-patch14/文件名）
          mkdir -p clip
          for n in config.json preprocessor_config.json model.safetensors; do curl -fL --retry 5 -o "clip/$n" "https://huggingface.co/openai/clip-vit-large-patch14/resolve/main/$n"; done
          ls -la clip
      - name: 传到国内存储（大小一样的跳过）
        run: |
          set -uo pipefail
          B=$(printf '%s' "$CN_S3_BUCKET" | tr -d '[:space:]'); EP=$(printf '%s' "$CN_S3_ENDPOINT" | tr -d '[:space:]'); BASE=$(printf '%s' "$CN_DL_BASE" | tr -d '[:space:]' | sed 's#/*$##')
          export AWS_ACCESS_KEY_ID=$(printf '%s' "$CN_S3_KEY_ID" | tr -d '[:space:]') AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CN_S3_SECRET" | tr -d '[:space:]') AWS_DEFAULT_REGION=$(printf '%s' "${CN_S3_REGION:-us-east-1}" | tr -d '[:space:]') AWS_EC2_METADATA_DISABLED=true
          aws configure set default.s3.addressing_style virtual
          mkdir -p r; i=0; bad=0
          TV=$(ls w | sed -n 's/^torch-\([^-]*\)-.*/\1/p' | head -1)
          for f in w/*; do
            n=$(basename "$f"); KEY="ai/grid/$n"; SIZE=$(stat -c %s "$f"); SHA=$(sha256sum < "$f" | cut -d' ' -f1)
            HAVE=$(aws s3api head-object --bucket "$B" --key "$KEY" --endpoint-url "$EP" --query ContentLength --output text 2>/dev/null || echo 0)
            if [ "$HAVE" = "$SIZE" ]; then URL="$BASE/$KEY"; echo "已经有了：$n"
            else URL=$(bash .github/workflows/cn-put.sh "$f" "$KEY") || { bad=1; continue; }; fi
            case "$n" in *.exe) PK=gridpy;; *) PK=gridwheel;; esac
            GHU='[]'; case ",$GH_GROUPS," in *",grid,"*) GHU=$(bash .github/workflows/gh-put.sh "$f" grid "$n") || { bad=1; GHU='[]'; };; esac
            i=$((i+1))
            jq -n --arg k "$KEY" --arg n "$n" --arg u "$URL" --arg s "$SHA" --argjson z "$SIZE" --arg p "$PK" --arg v "$TV" --argjson g "$GHU" \
              '{group:"grid", key:$k, name:$n, cn:$u, url:("pip:" + $n), size:$z, sha256:$s, pkg:$p, ver:$v, gh:$g}' > "r/$i.json"
          done
          for f in clip/*; do
            n=$(basename "$f"); KEY="ai/grid/clip-vit-large-patch14/$n"; SIZE=$(stat -c %s "$f")
            HAVE=$(aws s3api head-object --bucket "$B" --key "$KEY" --endpoint-url "$EP" --query ContentLength --output text 2>/dev/null || echo 0)
            if [ "$HAVE" = "$SIZE" ]; then echo "已经有了：clip/$n"; else bash .github/workflows/cn-put.sh "$f" "$KEY" >/dev/null || bad=1; fi
            GHU='[]'; case ",$GH_GROUPS," in *",grid,"*) GHU=$(bash .github/workflows/gh-put.sh "$f" grid "clip-vit-large-patch14--$n") || { bad=1; GHU='[]'; };; esac
            i=$((i+1)); SHA=$(sha256sum < "$f" | cut -d' ' -f1)
            jq -n --arg k "$KEY" --arg n "$n" --arg u "$(printf '%s' "$CN_DL_BASE" | tr -d '[:space:]' | sed 's#/*$##')/$KEY" --arg s "$SHA" --argjson z "$SIZE" --argjson g "$GHU" \
              '{group:"grid", key:$k, name:$n, cn:$u, url:("hf:openai/clip-vit-large-patch14/" + $n), size:$z, sha256:$s, model:"clip", gh:$g}' > "r/$i.json"
          done
          echo "传了 $i 个文件"; [ "$bad" = 0 ] || { echo "::error::有文件没传上去，再跑一次（传好的会跳过）"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-grid
          path: r/
          retention-days: 3

  manifest:
    needs: [plan, copy, grid]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r-*
          path: results
      - name: 写 download/ai-mirror.json
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PUB="${RUNNER_TEMP}/pub"
          git fetch --no-tags origin "$BRANCH"
          git worktree add --detach "$PUB" FETCH_HEAD
          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            if [ "$ATTEMPT" -gt 1 ]; then git -C "$PUB" fetch --no-tags origin "$BRANCH"; git -C "$PUB" reset --hard FETCH_HEAD; fi
            node -e '
              const fs = require("fs"), path = require("path");
              const out = process.argv[1], dir = process.argv[2];
              let m = { files: {} }; try { m = JSON.parse(fs.readFileSync(out, "utf8")); } catch (e) {}
              const walk = (d) => fs.existsSync(d) ? fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]) : [];
              let n = 0;
              for (const f of walk(dir).filter((f) => f.endsWith(".json"))) {
                const it = JSON.parse(fs.readFileSync(f, "utf8")); const old = m.files[it.key] || {};
                const ghu = Array.isArray(it.gh) && it.gh.length ? it.gh : old.size === it.size && old.gh ? old.gh : undefined;
                m.files[it.key] = { group: it.group, name: it.name, url: it.cn, src: it.url, size: it.size, sha256: it.sha256 || (old.size === it.size ? old.sha256 || "" : ""), ...(ghu ? { gh: ghu } : {}),
                  ...(it.model ? { model: it.model } : {}), ...(it.node ? { node: it.node, commit: it.commit } : {}), ...(it.pkg ? { pkg: it.pkg, ver: it.ver } : {}) };
                n++;
              }
              m.at = new Date().toISOString();
              fs.mkdirSync(path.dirname(out), { recursive: true }); fs.writeFileSync(out, JSON.stringify(m, null, 1) + "\n");
              console.log("清单里一共", Object.keys(m.files).length, "个文件，这次", n, "个");
            ' "$PUB/download/ai-mirror.json" results
            git -C "$PUB" add -- download/ai-mirror.json
            if git -C "$PUB" diff --cached --quiet; then echo "清单没变"; exit 0; fi
            git -C "$PUB" commit -m "AI 组件国内地址"
            if git -C "$PUB" push origin "HEAD:${BRANCH}"; then exit 0; fi
          done
          echo "::error::写 download/ai-mirror.json 失败"; exit 1
      - name: 让国内网站也同步
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run site-cn.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" \
            && echo "已经让「网站国内加速」重新同步" \
            || echo "::warning::没能自动触发「网站国内加速」，请到 Actions 里手动 Run workflow"
