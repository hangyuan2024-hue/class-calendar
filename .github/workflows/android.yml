# 安卓正式版：打包 → 发布到 Releases → 更新官网下载（download/app-version.json）。
# 必须用仓库里的 android/release.jks 和 Secrets 里的 KEYSTORE_PASSWORD 签名，才能覆盖安装旧版（5.3.x）。
# 版本号：versionCode = 600 + 第几次运行（一定比旧版 31 大，老用户会收到更新），版本名 6.1.第几次运行。
name: 安卓 App

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }

      - name: 版本号
        id: ver
        run: |
          echo "code=$((600 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "name=6.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 检查正式签名
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -f android/release.jks || { echo "::error::仓库里缺少 android/release.jks（签名文件），不能生成能覆盖旧版的正式安装包。"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::缺少 KEYSTORE_PASSWORD。请在 Settings → Secrets and variables → Actions 里添加。"; exit 1; }

      - name: 测试并打包正式版
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SITE_URL: https://www.laolaokechengbiao.cn/
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testStableReleaseUnitTest assembleStableRelease --no-daemon --stacktrace

      - name: 保存安装包（Actions 里也能直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: 捞捞课程表-正式版-${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/apk/stable/release/app-stable-release.apk
          if-no-files-found: error

      - name: 发布到 Releases
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          VNAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          TAG="android-v${VNAME}"
          DIR="${RUNNER_TEMP}/android-release"
          mkdir -p "$DIR"
          cp android/app/build/outputs/apk/stable/release/app-stable-release.apk "$DIR/class-calendar.apk"
          cat > "$DIR/notes.md" <<NOTES
          捞捞课程表 安卓版 ${VNAME}

          6.1：桌面小组件（今天的课和事、下节课倒计时、作业清单、一键记事 / 拍课表）；
          App 关着也能按时提醒上课和作业截止，通知上直接点「完成」；班级新作业 / 通知自动提醒；
          一句话记事；从备忘录、微信分享文字导入待办，分享课表截图识别成课程表；新的作业页。
          正式签名，可以直接覆盖安装旧版，数据不会丢。
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIR/class-calendar.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # 不能抢占 latest：电脑版的下载地址用的是 releases/latest
            gh release create "$TAG" "$DIR/class-calendar.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest=false --title "捞捞课程表 安卓版 ${VNAME}" --notes-file "$DIR/notes.md"
          fi
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/class-calendar.apk" >> "$GITHUB_OUTPUT"

      - name: 更新官网下载
        env:
          VCODE: ${{ steps.ver.outputs.code }}
          VNAME: ${{ steps.ver.outputs.name }}
          URL: ${{ steps.rel.outputs.url }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}/android/app/build/outputs/apk/stable/release/app-stable-release.apk"
          PUB="${RUNNER_TEMP}/android-publish"
          git fetch --no-tags origin "$BRANCH"
          git worktree add --detach "$PUB" FETCH_HEAD
          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            if [ "$ATTEMPT" -gt 1 ]; then git fetch --no-tags origin "$BRANCH"; git -C "$PUB" reset --hard FETCH_HEAD; fi
            mkdir -p "$PUB/download"
            cp "$SRC" "$PUB/download/class-calendar.apk"
            echo "{\"versionCode\": ${VCODE}, \"versionName\": \"${VNAME}\", \"url\": \"${URL}\", \"fallbackUrl\": \"download/class-calendar.apk\", \"size\": $(stat -c %s "$SRC"), \"signed\": true, \"at\": \"$(date -u +%FT%TZ)\"}" > "$PUB/download/app-version.json"
            cat "$PUB/download/app-version.json"
            git -C "$PUB" add -- download/class-calendar.apk download/app-version.json
            if git -C "$PUB" diff --cached --quiet; then echo "已经是最新"; exit 0; fi
            git -C "$PUB" commit -m "安卓 App ${VNAME}"
            if git -C "$PUB" push origin "HEAD:${BRANCH}"; then exit 0; fi
          done
          echo "::error::安装包已经发布到 Releases，但更新官网下载目录失败"
          exit 1
