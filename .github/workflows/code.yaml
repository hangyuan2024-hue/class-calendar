# 自动打包「捞捞编程」Windows 安装包：改了 coder/ 里的文件、或者在 Actions 页面手动点「Run workflow」时运行。
# 安装包里自带：C / C++ 编译器（MinGW-w64，winlibs 版 GCC）、Python 3.12、llama.cpp（llama-server）、本地模型 Qwen2.5-Coder 1.5B。
# Java、Node.js、Go 不放进安装包，软件里点一下从国内镜像下载。
# 发布到仓库 Releases 的 laolao-code（固定的标签，每次覆盖安装包）：
#   https://github.com/<仓库>/releases/download/laolao-code/LaolaoCode-Setup.exe
# 注意：不能抢 latest —— 捞捞课程表电脑版的下载地址用的是 releases/latest。
name: 捞捞编程

on:
  push:
    branches: [main, master]
    paths:
      - "coder/**"
      - ".github/workflows/code.yaml"
      - "desktop/core/api.js"
      - "config.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laolao-code
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 准备目录
        run: New-Item -ItemType Directory -Force coder\resources\toolchains, coder\resources\llama, coder\resources\models, dl | Out-Null

      - name: C / C++ 编译器（winlibs MinGW-w64，GCC + UCRT，不带 LLVM）
        run: |
          $rels = gh api "repos/brechtsanders/winlibs_mingw/releases?per_page=15" | ConvertFrom-Json
          $pick = $null
          foreach ($r in $rels) {
            if ($r.prerelease) { continue }
            $a = $r.assets | Where-Object { $_.name -match '^winlibs-x86_64-posix-seh-gcc-[\d.]+-mingw-w64ucrt-[\d.]+-r\d+\.zip$' } | Select-Object -First 1
            if ($a) { $pick = $a; Write-Host "使用 $($r.tag_name)：$($a.name)"; break }
          }
          if (-not $pick) { throw "没找到 winlibs 的 GCC 压缩包" }
          gh release download $r.tag_name --repo brechtsanders/winlibs_mingw --pattern $pick.name --dir dl --clobber
          tar -xf "dl\$($pick.name)" -C coder\resources\toolchains
          if (-not (Test-Path coder\resources\toolchains\mingw64\bin\gcc.exe)) { throw "解压后没有 mingw64\bin\gcc.exe" }
          # 去掉用不到的大东西；去掉翻译文件，编译器的报错保持英文（软件按英文解析，再配中文提示）
          foreach ($d in @('share\doc', 'share\info', 'share\man', 'share\locale', 'share\gcc-*\python', 'opt\lib\python*\test')) {
            Get-ChildItem "coder\resources\toolchains\mingw64\$d" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "coder\resources\toolchains\mingw64\$d" -Recurse -Force -ErrorAction SilentlyContinue
          }
          & coder\resources\toolchains\mingw64\bin\gcc.exe --version | Select-Object -First 1
          "{0:N0} MB" -f ((Get-ChildItem coder\resources\toolchains\mingw64 -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Python 3.12（python-build-standalone，免安装版）
        run: |
          $rels = gh api "repos/astral-sh/python-build-standalone/releases?per_page=8" | ConvertFrom-Json
          $pick = $null
          foreach ($r in $rels) {
            $a = $r.assets | Where-Object { $_.name -match '^cpython-3\.12\.\d+\+\d+-x86_64-pc-windows-msvc-install_only_stripped\.tar\.gz$' } | Select-Object -First 1
            if (-not $a) { $a = $r.assets | Where-Object { $_.name -match '^cpython-3\.12\.\d+\+\d+-x86_64-pc-windows-msvc-install_only\.tar\.gz$' } | Select-Object -First 1 }
            if ($a) { $pick = $a; Write-Host "使用 $($r.tag_name)：$($a.name)"; break }
          }
          if (-not $pick) { throw "没找到 Python 的 Windows 免安装包" }
          gh release download $r.tag_name --repo astral-sh/python-build-standalone --pattern $pick.name --dir dl --clobber
          tar -xzf "dl\$($pick.name)" -C coder\resources\toolchains
          if (-not (Test-Path coder\resources\toolchains\python\python.exe)) { throw "解压后没有 python\python.exe" }
          & coder\resources\toolchains\python\python.exe --version

      - name: llama.cpp（在电脑上运行本地模型的程序，CPU 版）
        run: |
          $tags = gh release list --repo ggml-org/llama.cpp --limit 15 --json tagName --jq '.[].tagName'
          $pick = $null
          foreach ($t in $tags) {
            $names = @(gh release view $t --repo ggml-org/llama.cpp --json assets --jq '.assets[].name')
            $win = @($names | Where-Object { $_ -match 'win' -and $_ -match 'x64' -and $_ -match '\.zip$' -and $_ -notmatch 'cudart|cuda|hip|sycl|arm64|opencl|kompute' })
            foreach ($pref in @('cpu', 'avx2', 'avx', 'vulkan')) { $m = $win | Where-Object { $_ -match $pref } | Select-Object -First 1; if ($m) { $pick = $m; break } }
            if (-not $pick -and $win.Count -gt 0) { $pick = $win[0] }
            if ($pick) { Write-Host "使用 $t 里的 $pick"; gh release download $t --repo ggml-org/llama.cpp --pattern $pick --dir dl --clobber; break }
          }
          if (-not $pick) { throw "没找到 llama.cpp 的 Windows 版本" }
          Expand-Archive "dl\$pick" -DestinationPath llama-x -Force
          $exe = Get-ChildItem llama-x -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw "压缩包里没有 llama-server.exe" }
          Copy-Item (Join-Path $exe.DirectoryName '*') coder\resources\llama -Recurse -Force

      - name: 本地模型（缓存起来，不用每次都下 1 GB）
        id: model-cache
        uses: actions/cache@v4
        with:
          path: coder/resources/models
          key: model-${{ env.MODEL_FILE }}

      - name: 下载本地模型 Qwen2.5-Coder 1.5B（Q4_K_M）
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          $u = "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/$env:MODEL_FILE"
          curl.exe -L --fail --retry 5 --retry-delay 5 -o "coder\resources\models\$env:MODEL_FILE" $u
          $len = (Get-Item "coder\resources\models\$env:MODEL_FILE").Length
          if ($len -lt 500MB) { throw "模型文件太小（$len 字节），下载坏了" }
          "{0:N0} MB" -f ($len / 1MB)

      - name: 安装依赖、准备代码
        working-directory: coder
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare.js

      - name: 测试（规则 + 安装包自带的编译器 + 本地模型真的能回答）
        working-directory: coder
        env:
          LC_TEST_AI: "1"
          LC_BUNDLED: "1"
        run: |
          node test/exercises.test.js
          node test/core.test.js
          node test/bundled.test.js

      - name: 打包程序（electron-builder，先出文件夹）
        working-directory: coder
        run: |
          $v = "1.0.${{ github.run_number }}"
          npm version $v --no-git-tag-version --allow-same-version
          npx electron-builder --win --x64 --dir --publish never
          if (-not (Test-Path dist\win-unpacked\LaolaoCode.exe)) { throw "没有生成 LaolaoCode.exe" }
          Get-ChildItem dist\win-unpacked\resources | Select-Object Name

      - name: 做成安装包（Inno Setup）
        working-directory: coder
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { throw "装不上 Inno Setup" }
          # 简体中文界面：Inno Setup 自带就用自带的，没有就从官方仓库拿
          $zh = Get-ChildItem (Split-Path $iscc.FullName) -Recurse -Filter ChineseSimplified.isl -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zh) { curl.exe -L --fail -o installer\ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl; $zh = Get-Item installer\ChineseSimplified.isl }
          $v = "1.0.${{ github.run_number }}"
          & $iscc.FullName "/DAppVersion=$v" "/DSrcDir=$PWD\dist\win-unpacked" "/DZhIsl=$($zh.FullName)" installer\laolao-code.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 打包失败" }
          $f = Get-Item dist\LaolaoCode-Setup.exe
          "安装包 {0:N0} MB" -f ($f.Length / 1MB)
          if ($f.Length -gt 1990MB) { throw "安装包超过 GitHub 单个文件 2GB 的上限" }

      - name: 发布到 Releases（laolao-code，不抢 latest）
        run: |
          $v = "1.0.${{ github.run_number }}"
          $notes = "捞捞编程 Windows 版 $v`n`n自带 C、C++（GCC）、Python 3.12 和本地模型（通义千问 Qwen2.5-Coder 1.5B），装好就能写代码、问问题，不用联网；Java、JavaScript、Go 在软件里点一下自动安装。`n`n下载：https://github.com/${{ github.repository }}/releases/download/laolao-code/LaolaoCode-Setup.exe`n`n安装时如果 Windows 提示「已保护你的电脑」，点「更多信息 → 仍要运行」。"
          gh release view laolao-code --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload laolao-code coder\dist\LaolaoCode-Setup.exe --repo "${{ github.repository }}" --clobber
            gh release edit laolao-code --repo "${{ github.repository }}" --title "捞捞编程 Windows 版 $v" --notes $notes --latest=false
          } else {
            gh release create laolao-code coder\dist\LaolaoCode-Setup.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "捞捞编程 Windows 版 $v" --notes $notes --latest=false
          }
