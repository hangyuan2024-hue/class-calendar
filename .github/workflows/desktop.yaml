# 自动打包 Windows 电脑版：改了 desktop/ 里的文件、电脑版直接用的网站文件（见下面 paths），或者在 Actions 页面手动点「Run workflow」时运行。
# 电脑版里的课内学习、思维导图、云宠农场、元宇宙工具箱、内置工具、群消息整理规则都是打包时从网站拷最新版（desktop/scripts/sync-web.js），
# 所以网站改了这些，电脑版会自动重新打包。
# 打好的安装包发布到仓库的 Releases（太大了，不能放进网站目录），
# 下载地址固定是 https://github.com/<仓库>/releases/latest/download/LaolaoKechengbiao-Setup.exe
name: 电脑版

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yaml"
      - "config.js"
      - "parse.js"
      - "lao-train.js"
      - "island-core.js"
      - "memo.js"
      - "study.js"
      - "study.css"
      - "learn/mindmap/**"
      - "farm.js"
      - "metaverse-v3.js"
      - "metaverse-v3.css"
      - "sandbox.html"
      - "plugins/random-draw.html"
      - "plugins/error-notebook.html"
      - "plugins/tools.css"
      - "plugins/vendor/**"
      - "schools-2026.json"
      - "fonts.css"
      - "fonts/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 发布完让「网站国内加速」再跑一遍（机器人提交不会自动触发别的流程）

concurrency:
  group: desktop-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 下载 llama.cpp（在电脑上运行 AI 模型的程序）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force llama-dl | Out-Null
          # llama.cpp 每个版本的文件名会变，这里按名字挑：Windows、x64、CPU 版优先；最新版里没有就往前找
          $tags = gh release list --repo ggml-org/llama.cpp --limit 15 --json tagName --jq '.[].tagName'
          $pick = $null
          foreach ($t in $tags) {
            $names = @(gh release view $t --repo ggml-org/llama.cpp --json assets --jq '.assets[].name')
            $win = @($names | Where-Object { $_ -match 'win' -and $_ -match 'x64' -and $_ -match '\.zip$' -and $_ -notmatch 'cudart|cuda|hip|sycl|arm64|opencl|kompute' })
            foreach ($pref in @('cpu', 'avx2', 'avx', 'vulkan')) {
              $m = $win | Where-Object { $_ -match $pref } | Select-Object -First 1
              if ($m) { $pick = $m; break }
            }
            if (-not $pick -and $win.Count -gt 0) { $pick = $win[0] }
            if ($pick) {
              Write-Host "使用 $t 里的 $pick"
              gh release download $t --repo ggml-org/llama.cpp --pattern $pick --dir llama-dl --clobber
              break
            }
            Write-Host "$t 里没有合适的 Windows 包，文件有：$($names -join ', ')"
          }
          if (-not $pick -or (Get-ChildItem llama-dl -Filter *.zip).Count -eq 0) { throw "没找到 llama.cpp 的 Windows 版本" }
          Expand-Archive (Get-ChildItem llama-dl -Filter *.zip | Select-Object -First 1).FullName -DestinationPath llama-x -Force
          $exe = Get-ChildItem llama-x -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw "压缩包里没有 llama-server.exe" }
          New-Item -ItemType Directory -Force desktop\llama | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') desktop\llama -Recurse -Force
          Get-ChildItem desktop\llama | Select-Object Name, Length

      - name: 从网站拷最新的代码（服务器地址、字体、课内学习、思维导图、云宠农场、内置工具……）
        working-directory: desktop
        run: node scripts/sync-web.js ..

      - name: 测试
        working-directory: desktop
        run: node test/core.test.js

      # Electron 本体（100 多 MB）和打包工具的下载缓存：缓存住以后基本不用再从 GitHub 下载
      - name: Electron 下载缓存
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-desktop-${{ hashFiles('desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-desktop-

      - name: 打包安装程序
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm version "3.4.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          # 装 Electron 时要从 GitHub 下载 100 多 MB，偶尔遇到 GitHub 临时 504 / 超时，整个 npm install 就失败了：最多试 4 次
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            # GitHub 上的 Electron 下载一直 504 时，后面几次改从 npmmirror 的 Electron 镜像下载（Electron 官方文档里推荐的镜像）
            $env:ELECTRON_MIRROR = "https://npmmirror.com/mirrors/electron/"
            $env:ELECTRON_BUILDER_BINARIES_MIRROR = "https://npmmirror.com/mirrors/electron-builder-binaries/"
            Write-Warning "第 $i 次 npm install 失败（多半是从 GitHub 下载 Electron 时网络出错），$(15 * $i) 秒后改用镜像重试"
            Start-Sleep -Seconds (15 * $i)
          }
          if (-not $ok) { throw "npm install 连续 4 次失败，看上面的报错" }
          npx electron-builder --win nsis --x64 --publish never
          Get-ChildItem dist

      - name: 发布到 Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "3.4.${{ github.run_number }}"
          $notes = "捞捞课程表 Windows 电脑版 $v`n`n3.4：自动检查更新，点「立即更新」在软件里下载、装完自动重新打开；签到（位置 / 动态码 / 投屏小程序码），老师和班委都能发起、班委也能看「班级情况」；等级和经验；首页点课程看课表截图。`n`n3.3：海外也能用（国内连不上自动走海外线路）；登录设备管理（设置 → 登录设备，可以踢出不认识的设备）；侧栏精简（规划与专注合并、成长里切换每周报告 / 排行榜 / 云宠农场，元宇宙改名「等级与徽章」挪进工具）；导入手机备忘录；作业页显示已读人数和名单、图片附件直接看小图；老师和自己建了班的人有「班级情况」页和教师组；职场人员界面换成团队 / 任务的说法。`n`n3.2：配色和网站同一套（16 套 + 自己调，网站上换了电脑版跟着变）；侧栏名字和网站一致（首页、日历、学习、问答、成长、工具……）；首页时间轴重做（课一条、事错开成几行、过去的时间灰掉）；修好点开时间轴上的事后右边详情栏按钮点不动、一直闪。`n`n3.1 新加：局域网互传（「只存在这台设备」的事项不上传云端，同一个 Wi-Fi 里的手机、电脑、网页之间直接传）；界面风格可以在「设置 → 外观」里切换成和网站一样的「网页风格」；侧栏重新分组、可以收起；设置页加了目录。`n`n3.0 全新界面：标题栏下面的课铃线、今日页的课铃时间带、右侧详情栏，深色模式重新配色。`n`n和网站对齐：课内学习、思维导图、云宠农场、元宇宙工具箱、随机抽签器、错题记录本；调课 / 调休；事项云端附件；过期两周自动删除；编辑（仅自己）；自己记的作业；学校 / 单位；注册、找回密码；实时同步（几秒内）；按北京时间并用服务器校准时钟。`n`n电脑版独有：任意页面单独开窗口（放到第二块屏幕）、导出 Excel 表格、单条事项加到日历、把文件拖到事项上传附件，以及原来的托盘提醒、快速记事、桌面小窗、离线 AI、课表壁纸、导出 PDF、自动备份、早安简报、专注和白噪音。`n`n安装时如果 Windows 提示「已保护你的电脑」，点「更多信息 → 仍要运行」。"
          gh release create "desktop-v$v" "desktop/dist/LaolaoKechengbiao-Setup.exe" --title "捞捞课程表 电脑版 $v" --notes $notes --latest

      # 3.4：写官网的 download/desktop-version.json，电脑版（3.4 起）每 6 小时看一次，有新版本就提示「立即更新」
      - name: 更新官网的电脑版版本号（配了国内存储就先传一份过去）
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          CN_S3_ENDPOINT: ${{ secrets.CN_S3_ENDPOINT }}
          CN_S3_REGION: ${{ secrets.CN_S3_REGION }}
          CN_S3_BUCKET: ${{ secrets.CN_S3_BUCKET }}
          CN_S3_KEY_ID: ${{ secrets.CN_S3_KEY_ID }}
          CN_S3_SECRET: ${{ secrets.CN_S3_SECRET }}
          CN_DL_BASE: ${{ secrets.CN_DL_BASE }}
        run: |
          set -euo pipefail
          V="3.4.${{ github.run_number }}"
          SRC="${GITHUB_WORKSPACE}/desktop/dist/LaolaoKechengbiao-Setup.exe"
          SIZE=$(stat -c %s "$SRC" 2>/dev/null || wc -c < "$SRC")
          SHA=$(sha256sum < "$SRC" | cut -d' ' -f1)   # 从标准输入读：Windows 上路径里有反斜杠时 sha256sum 会在结果前加「\」
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v${V}/LaolaoKechengbiao-Setup.exe"
          CN=$(bash .github/workflows/cn-upload.sh "$SRC" "desktop/LaolaoKechengbiao-Setup-${V}.exe")
          echo "国内地址：${CN:-（没配国内存储）}"
          PUB="${RUNNER_TEMP}/desktop-publish"
          git fetch --no-tags origin "$BRANCH"
          git worktree add --detach "$PUB" FETCH_HEAD
          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            if [ "$ATTEMPT" -gt 1 ]; then git fetch --no-tags origin "$BRANCH"; git -C "$PUB" reset --hard FETCH_HEAD; fi
            mkdir -p "$PUB/download"
            echo "{\"version\": \"${V}\", \"url\": \"${URL}\", \"cn\": \"${CN}\", \"size\": ${SIZE}, \"sha256\": \"${SHA}\", \"notes\": \"新增信箱：站内信，写信给捞捞团队（举报、建议、开源合作、安全问题）\", \"at\": \"$(date -u +%FT%TZ)\"}" > "$PUB/download/desktop-version.json"
            cat "$PUB/download/desktop-version.json"
            git -C "$PUB" add -- download/desktop-version.json
            if git -C "$PUB" diff --cached --quiet; then echo "已经是最新"; exit 0; fi
            git -C "$PUB" commit -m "电脑版 ${V}"
            if git -C "$PUB" push origin "HEAD:${BRANCH}"; then exit 0; fi
          done
          echo "::error::安装包已经发布到 Releases，但更新官网版本号失败"
          exit 1

      # 上一步是机器人（GITHUB_TOKEN）提交的版本文件，GitHub 规定这种提交不会触发别的流程：
      # 国内网站（腾讯云 COS）就一直停在旧的 download/desktop-version.json，官网「国内下载」指向已经被清理掉的旧安装包 → NoSuchKey。这里手动叫它跑一遍。
      - name: 让国内网站也换成新版下载
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run site-cn.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" \
            && echo "已经让「网站国内加速」重新同步" \
            || echo "::warning::没能自动触发「网站国内加速」，请到 Actions 里手动 Run workflow"
