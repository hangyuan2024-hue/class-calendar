# 自动打包「捞捞算力」Windows 安装包（几台电脑一起训练捞捞的模型）：改了 grid/ 里的文件、或者在 Actions 页面手动点「Run workflow」时运行。
# 先跑测试（调度中心、断电测试：随机拔电源后接力训练的结果和一台电脑算的一模一样、客户端），过了再打包。
# 发布到仓库 Releases 的 laolao-grid（固定标签，每次覆盖），不抢 latest；配了国内存储（CN_S3_*）还会传一份到国内：
#   https://github.com/<仓库>/releases/download/laolao-grid/LaolaoGrid-Setup.exe
# 调度中心（服务器）不用打包：在云服务器上 git clone 后 bash grid/server/deploy.sh，见 grid/README.md。
name: 捞捞算力

on:
  push:
    branches: [main, master]
    paths:
      - "grid/**"
      - ".github/workflows/grid.yaml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 写完版本号让「网站国内加速」同步一次（客户端从官网查新版本）

concurrency:
  group: laolao-grid
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: grid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 版本号每次打包自动加一（0.1.<第几次运行>）：客户端靠它判断有没有新版
      - name: 版本号
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: 装依赖
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check numpy pillow
      - name: 准备界面（认脸组件、表情参数标准）
        run: npm run prepare-ui
      - name: 测试
        env:
          PYTHON: python
        run: npm test
      - name: 打包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never
      - name: 发布到 Releases（laolao-grid，不抢 latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "捞捞算力 Windows 版 $v`n`n几台电脑一起训练捞捞自己的模型：一台停了，下一台接着算。装好后粘贴管理员发的邀请链接加入，按「任务向导」一步一步来（体检 → 装环境 → 跑通测试 → 录表情 → 挂机设置）。`n`n下载：https://github.com/${{ github.repository }}/releases/download/laolao-grid/LaolaoGrid-Setup.exe`n`n安装时如果 Windows 提示「已保护你的电脑」，点「更多信息 → 仍要运行」。"
          gh release view laolao-grid --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload laolao-grid dist\LaolaoGrid-Setup.exe --repo "${{ github.repository }}" --clobber
            gh release edit laolao-grid --repo "${{ github.repository }}" --title "捞捞算力 Windows 版 $v" --notes $notes --latest=false
          } else {
            gh release create laolao-grid dist\LaolaoGrid-Setup.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "捞捞算力 Windows 版 $v" --notes $notes --latest=false
          }
      # 传一份到国内存储；写官网的 download/grid-version.json（版本、地址、大小、sha256），客户端每 2 小时查一次，空闲时自动更新
      - name: 传到国内存储，写版本号
        shell: bash
        working-directory: .
        env:
          BRANCH: ${{ github.ref_name }}
          CN_S3_ENDPOINT: ${{ secrets.CN_S3_ENDPOINT }}
          CN_S3_REGION: ${{ secrets.CN_S3_REGION }}
          CN_S3_BUCKET: ${{ secrets.CN_S3_BUCKET }}
          CN_S3_KEY_ID: ${{ secrets.CN_S3_KEY_ID }}
          CN_S3_SECRET: ${{ secrets.CN_S3_SECRET }}
          CN_DL_BASE: ${{ secrets.CN_DL_BASE }}
        run: |
          set -euo pipefail
          V="0.1.${{ github.run_number }}"
          SRC="${GITHUB_WORKSPACE}/grid/dist/LaolaoGrid-Setup.exe"
          SIZE=$(stat -c %s "$SRC" 2>/dev/null || wc -c < "$SRC")
          SHA=$(sha256sum < "$SRC" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/laolao-grid/LaolaoGrid-Setup.exe"
          CN=$(bash .github/workflows/cn-upload.sh "$SRC" "grid/LaolaoGrid-Setup-${V}.exe")
          echo "国内下载地址：${CN:-（没配国内存储）}"
          if [ -n "$CN" ]; then echo "### 国内下载地址：$CN" >> "$GITHUB_STEP_SUMMARY"; fi
          PUB="${RUNNER_TEMP}/grid-publish"
          git fetch --no-tags origin "$BRANCH"
          git worktree add --detach "$PUB" FETCH_HEAD
          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            if [ "$ATTEMPT" -gt 1 ]; then git fetch --no-tags origin "$BRANCH"; git -C "$PUB" reset --hard FETCH_HEAD; fi
            mkdir -p "$PUB/download"
            echo "{\"version\": \"${V}\", \"url\": \"${URL}\", \"cn\": \"${CN}\", \"size\": ${SIZE}, \"sha256\": \"${SHA}\", \"notes\": \"捞捞算力 ${V}\", \"at\": \"$(date -u +%FT%TZ)\"}" > "$PUB/download/grid-version.json"
            cat "$PUB/download/grid-version.json"
            git -C "$PUB" add -- download/grid-version.json
            if git -C "$PUB" diff --cached --quiet; then echo "已经是最新"; exit 0; fi
            git -C "$PUB" commit -m "捞捞算力 ${V}"
            if git -C "$PUB" push origin "HEAD:${BRANCH}"; then exit 0; fi
          done
          echo "::error::安装包发布了，但写 download/grid-version.json 失败"; exit 1
      - name: 让国内网站也同步
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run site-cn.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" \
            && echo "已经让「网站国内加速」重新同步" \
            || echo "::warning::没能自动触发「网站国内加速」，请到 Actions 里手动 Run workflow"
