# 自动打包「捞捞PPT助手」Windows 安装包：改了 pptassist/ 里的文件、或者在 Actions 页面手动点「Run workflow」时运行。
# 先跑测试（PPT 读写、声音、假的 GPT-SoVITS、3D 形象工坊的绑骨骼和做脸），过了再打包。
# 发布到仓库 Releases 的 laolao-ppt（固定的标签，每次覆盖安装包），不抢 latest：
#   https://github.com/<仓库>/releases/download/laolao-ppt/LaolaoPPT-Setup.exe
# 配了国内存储（CN_S3_*）还会传一份到国内，地址写在官网 download/ppt-version.json，国内下载走它。
# GPT-SoVITS 不放进安装包（好几个 G），老师自己下整合包，在软件里选文件夹。
name: 捞捞PPT助手

on:
  push:
    branches: [main, master]
    paths:
      - "pptassist/**"
      - ".github/workflows/ppt.yaml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 发布完让「网站国内加速」再跑一遍（机器人提交不会自动触发别的流程）

concurrency:
  group: laolao-ppt
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: pptassist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 装依赖
        run: npm install --no-audit --no-fund
      - name: 准备界面用的 three.js
        run: npm run prepare-ui
      - name: 测试
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 测试 3D 形象工坊（找关节、蒙皮、做脸；不用显卡）
        run: |
          python -m pip install --disable-pip-version-check numpy scipy opencv-python-headless pillow soundfile
          python -m unittest discover -s ai3d/tests -v
      - name: 打包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never
      - name: 发布到 Releases（laolao-ppt，不抢 latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "捞捞PPT助手 Windows 版 $v`n`n上传自己的照片和一段录音，生成老师自己的公仔分身（五官照着照片画；有 NVIDIA 显卡还能用 AI 从照片 + 参考图生成 3D 公仔），加进 PPT：进到那一页自动讲解，点问题按钮由形象回答。声音克隆用 GPT-SoVITS（自己下载整合包，需要 NVIDIA 显卡），也可以每段自己录。`n`n下载：https://github.com/${{ github.repository }}/releases/download/laolao-ppt/LaolaoPPT-Setup.exe`n`n安装时如果 Windows 提示「已保护你的电脑」，点「更多信息 → 仍要运行」。"
          gh release view laolao-ppt --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload laolao-ppt dist\LaolaoPPT-Setup.exe --repo "${{ github.repository }}" --clobber
            gh release edit laolao-ppt --repo "${{ github.repository }}" --title "捞捞PPT助手 Windows 版 $v" --notes $notes --latest=false
          } else {
            gh release create laolao-ppt dist\LaolaoPPT-Setup.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "捞捞PPT助手 Windows 版 $v" --notes $notes --latest=false
          }

      # 国内下载：和捞捞编程一样，安装包再传一份到国内存储（腾讯云 COS，用同一组 CN_S3_* 密钥），
      # 把地址写进官网的 download/ppt-version.json；官网的下载按钮（get.js 的 data-get="ppt"）国内优先用它
      - name: 传到国内存储，更新官网的 PPT 助手版本号
        shell: bash
        working-directory: .
        env:
          BRANCH: ${{ github.ref_name }}
          CN_S3_ENDPOINT: ${{ secrets.CN_S3_ENDPOINT }}
          CN_S3_REGION: ${{ secrets.CN_S3_REGION }}
          CN_S3_BUCKET: ${{ secrets.CN_S3_BUCKET }}
          CN_S3_KEY_ID: ${{ secrets.CN_S3_KEY_ID }}
          CN_S3_SECRET: ${{ secrets.CN_S3_SECRET }}
          CN_DL_BASE: ${{ secrets.CN_DL_BASE }}
        run: |
          set -euo pipefail
          V="1.0.${{ github.run_number }}"
          SRC="${GITHUB_WORKSPACE}/pptassist/dist/LaolaoPPT-Setup.exe"
          SIZE=$(stat -c %s "$SRC" 2>/dev/null || wc -c < "$SRC")
          SHA=$(sha256sum < "$SRC" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/laolao-ppt/LaolaoPPT-Setup.exe"
          CN=$(bash .github/workflows/cn-upload.sh "$SRC" "ppt/LaolaoPPT-Setup-${V}.exe")
          echo "国内地址：${CN:-（没配国内存储，或者这次没传上去）}"
          PUB="${RUNNER_TEMP}/ppt-publish"
          git fetch --no-tags origin "$BRANCH"
          git worktree add --detach "$PUB" FETCH_HEAD
          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            if [ "$ATTEMPT" -gt 1 ]; then git fetch --no-tags origin "$BRANCH"; git -C "$PUB" reset --hard FETCH_HEAD; fi
            mkdir -p "$PUB/download"
            echo "{\"version\": \"${V}\", \"url\": \"${URL}\", \"cn\": \"${CN}\", \"size\": ${SIZE}, \"sha256\": \"${SHA}\", \"notes\": \"捞捞PPT助手 ${V}\", \"at\": \"$(date -u +%FT%TZ)\"}" > "$PUB/download/ppt-version.json"
            cat "$PUB/download/ppt-version.json"
            git -C "$PUB" add -- download/ppt-version.json
            if git -C "$PUB" diff --cached --quiet; then echo "已经是最新"; exit 0; fi
            git -C "$PUB" commit -m "捞捞PPT助手 ${V}"
            if git -C "$PUB" push origin "HEAD:${BRANCH}"; then exit 0; fi
          done
          echo "::error::安装包已经发布到 Releases，但更新官网的 download/ppt-version.json 失败"
          exit 1

      # 上一步是机器人提交的，GitHub 规定不会触发别的流程：手动叫「网站国内加速」同步一次，国内官网才有新的 ppt-version.json
      - name: 让国内网站也换成新版下载
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run site-cn.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" \
            && echo "已经让「网站国内加速」重新同步" \
            || echo "::warning::没能自动触发「网站国内加速」，请到 Actions 里手动 Run workflow"
