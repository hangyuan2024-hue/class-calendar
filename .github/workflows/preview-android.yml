name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/preview-android.yml"]
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      # GitHub 的 ubuntu 机器已自带安卓 SDK，不再用会出错的 setup-android
      - name: Build and test preview
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testPreviewDebugUnitTest assemblePreviewDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: 捞捞课程表-体验版APK
          path: android/app/build/outputs/apk/preview/debug/*.apk
          if-no-files-found: error
