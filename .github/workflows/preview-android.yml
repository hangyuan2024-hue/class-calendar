name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/preview-android.yml"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build and test preview
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android testPreviewDebugUnitTest assemblePreviewDebug lintPreviewDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ClassCalendar-5.3.38-preview
          path: android/app/build/outputs/apk/preview/debug/*.apk
          if-no-files-found: error
          retention-days: 30