plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// 6.0 = 全新重做的原生 App；6.1 = 桌面小组件、离线提醒、分享导入。CI 可覆盖版本号。
def vc = (System.getenv("APP_VERSION_CODE") ?: "61").toInteger()
def ksFile = file("../release.jks")
def ksPass = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace "com.laolao.classcalendar"
    compileSdk 34
    defaultConfig {
        applicationId "com.laolao.classcalendar"
        minSdk 24
        targetSdk 34
        versionCode(vc)
        versionName("6.1." + vc)
        buildConfigField("String", "SITE_URL", "\"" + (System.getenv("SITE_URL") ?: "https://www.laolaokechengbiao.cn/") + "\"")
        vectorDrawables { useSupportLibrary true }
    }
    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias "classcalendar"
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = (ksFile.exists() && ksPass) ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true; compose true }
    composeOptions { kotlinCompilerExtensionVersion "1.5.15" }
    kotlinOptions { jvmTarget = "17" }
    flavorDimensions "edition"
    productFlavors {
        stable { dimension "edition" }
        preview { dimension "edition"; applicationIdSuffix ".preview"; versionNameSuffix "-preview" }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

tasks.matching { it.name == "preStableReleaseBuild" }.configureEach {
    doFirst {
        if (!ksFile.exists() || !ksPass) {
            throw new GradleException("正式更新需要 android/release.jks 和 KEYSTORE_PASSWORD；体验版请构建 assemblePreviewDebug。")
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
    implementation "androidx.navigation:navigation-compose:2.8.2"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
