plugins { id "com.android.application" }

// 版本号由 GitHub Actions 传进来（每次构建自动 +1）；本地构建用 4
def vc = (System.getenv("APP_VERSION_CODE") ?: "4").toInteger()
def ksFile = file("../release.jks")
def ksPass = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace "com.laolao.classcalendar"
    compileSdk 34
    defaultConfig {
        applicationId "com.laolao.classcalendar"
        minSdk 24
        targetSdk 34
        versionCode(vc)
        versionName("2.0." + vc)
        buildConfigField("String", "SITE_URL", "\"" + (System.getenv("SITE_URL") ?: "https://hangyuan2024-hue.github.io/class-calendar/") + "\"")
    }
    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias "classcalendar"
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig = (ksFile.exists() && ksPass) ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true }
    flavorDimensions "edition"
    productFlavors {
        stable { dimension "edition" }
        preview { dimension "edition"; applicationIdSuffix ".preview"; versionNameSuffix "-preview" }
    }
    // 不上架应用商店，打包时不因为商店规则（比如 targetSdk 年限）报错中断
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == "preStableReleaseBuild" }.configureEach {
    doFirst {
        if (!ksFile.exists() || !ksPass) {
            throw new GradleException("正式更新需要原来的 android/release.jks 和 KEYSTORE_PASSWORD；体验请构建 assemblePreviewDebug。")
        }
    }
}
