plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// 版本号由 GitHub Actions 传进来；本地构建用 28。
def vc = (System.getenv("APP_VERSION_CODE") ?: "32").toInteger()
def ksFile = file("../release.jks")
def ksPass = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace "com.laolao.classcalendar"
    compileSdk 34
    defaultConfig {
        applicationId "com.laolao.classcalendar"
        minSdk 24
        targetSdk 34
        versionCode(vc)
        versionName("5.3." + vc)
        // 保留正式站点地址用于分享校园链接；页面由 Android 原生视图呈现。
        buildConfigField("String", "SITE_URL", "\"" + (System.getenv("SITE_URL") ?: "https://www.laolaokechengbiao.cn/") + "\"")
    }
    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias "classcalendar"
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = (ksFile.exists() && ksPass) ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true; compose true }
    composeOptions { kotlinCompilerExtensionVersion "1.5.15" }
    kotlinOptions { jvmTarget = "17" }
    flavorDimensions "edition"
    productFlavors {
        stable { dimension "edition" }
        preview { dimension "edition"; applicationIdSuffix ".preview"; versionNameSuffix "-preview" }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.matching { it.name == "preStableReleaseBuild" }.configureEach {
    doFirst {
        if (!ksFile.exists() || !ksPass) {
            throw new GradleException("正式更新需要 android/release.jks 和 KEYSTORE_PASSWORD；体验版请构建 assemblePreviewDebug。")
        }
    }
}


dependencies {
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    debugImplementation "androidx.compose.ui:ui-tooling"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.09.03")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
