<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'self'; media-src 'self' data: blob:">
<title>捞捞课程表</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="views.css">
<link rel="stylesheet" href="views2.css">
</head>
<body>
<div id="app" class="booting">
  <header class="titlebar">
    <div class="tb-brand"><img src="logo.png" alt=""><span>捞捞课程表</span></div>
    <button class="tb-search" id="tbSearch" title="搜索、跳转、执行命令"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>搜索事项、跳转页面…</span><kbd>Ctrl K</kbd></button>
    <div class="tb-right">
      <span class="sync" id="syncDot" title="同步状态"></span></div>
  </header>

  <!-- 登录 -->
  <section id="login" class="login hidden">
    <div class="lg-art">
      <div class="lg-brand"><img src="logo.png" alt=""><b>捞捞课程表</b><span>电脑版</span></div>
      <h1>课、作业、通知<br>一眼看清</h1>
      <ul>
        <li><i>📅</i><div><b>课程表周视图</b><span>整周的课铺满屏幕，现在上到哪节一目了然</span></div></li>
        <li><i>✅</i><div><b>作业、事项一张表</b><span>筛选、搜索、批量勾完成，键盘就能操作</span></div></li>
        <li><i>🔔</i><div><b>右下角准时提醒</b><span>上课前、截止前弹通知，关掉窗口也不会漏</span></div></li>
        <li><i>🤖</i><div><b>离线 AI 小助手</b><span>问「明天几点上课」「这周要交什么」</span></div></li>
      </ul>
    </div>
    <form class="lg-form" id="loginForm" autocomplete="on">
      <h2>登录</h2>
      <p class="muted">用网站或手机上的同一个账号，数据自动同步</p>
      <label>账号<input id="lgAcct" name="username" autocomplete="username" placeholder="你的账号" required></label>
      <label>密码<input id="lgPw" name="password" type="password" autocomplete="current-password" placeholder="密码" required></label>
      <div class="lg-err" id="lgErr"></div>
      <button class="btn primary big" id="lgBtn" type="submit">登录</button>
      <p class="lg-reg">还没有账号？<a href="#" data-ext="https://www.laolaokechengbiao.cn/">去网站注册</a></p>
    </form>
  </section>

  <!-- 主界面 -->
  <aside class="side hidden" id="side">
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="nav-item" data-view="me" id="navMe"></button>
      <button class="nav-item" data-view="settings" id="navSettings"></button>
      <button class="me-card" id="meCard" title="切换班级"><span class="av" id="meAv"></span><span class="me-t"><b id="meName"></b><small id="meClass"></small></span></button>
    </div>
  </aside>
  <main class="main hidden" id="main"></main>
</div>

<!-- 捞捞（网站吉祥物，和网站同一张图） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="mascotArt">
      <ellipse cx="60" cy="112" rx="30" ry="5" style="fill:var(--m-shadow, rgba(10,50,90,.15))"/>
      <g class="wave"><path d="M96 74 q16 -4 18 -22" fill="none" style="stroke:var(--m-line, #0e2240)" stroke-width="5" stroke-linecap="round"/><circle cx="114" cy="50" r="6" style="fill:var(--m-body, #fff);stroke:var(--m-line, #0e2240)" stroke-width="4"/></g>
      <path d="M24 78 q-12 6 -12 18" fill="none" style="stroke:var(--m-line, #0e2240)" stroke-width="5" stroke-linecap="round"/>
      <rect x="22" y="28" width="76" height="78" rx="24" style="fill:var(--m-body, #ffffff);stroke:var(--m-line, #0e2240)" stroke-width="5"/>
      <path d="M22 54 V52 a24 24 0 0 1 24 -24 h28 a24 24 0 0 1 24 24 v2 z" style="fill:var(--m-top, #ff8a3d);stroke:var(--m-line, #0e2240)" stroke-width="5" stroke-linejoin="round"/>
      <rect x="40" y="16" width="9" height="22" rx="4.5" style="fill:var(--m-line, #0e2240)"/><rect x="71" y="16" width="9" height="22" rx="4.5" style="fill:var(--m-line, #0e2240)"/>
      <g style="display:var(--m-eyes, inline)">
        <ellipse cx="46" cy="74" rx="6" ry="7.5" fill="#0e2240"/><ellipse cx="74" cy="74" rx="6" ry="7.5" fill="#0e2240"/>
        <circle cx="48" cy="71" r="2.2" fill="#fff"/><circle cx="76" cy="71" r="2.2" fill="#fff"/>
        <ellipse cx="36" cy="86" rx="6" ry="3.5" fill="#ff9db5" opacity=".8"/><ellipse cx="84" cy="86" rx="6" ry="3.5" fill="#ff9db5" opacity=".8"/>
      </g>
      <g style="display:var(--m-visor, none)">
        <path d="M28 64 h64 a4 4 0 0 1 4 4 v10 a6 6 0 0 1 -6 6 h-18 l-6 -6 h-8 l-6 6 h-18 a6 6 0 0 1 -6 -6 v-10 a4 4 0 0 1 4 -4z" fill="#0a0420" stroke="#00f0ff" stroke-width="3"/>
        <path d="M34 72 h18 M68 72 h18" stroke="#ff2bd6" stroke-width="4" stroke-linecap="round"/>
        <path d="M22 92 h10 M88 92 h10 M30 100 h6" stroke="#00f0ff" stroke-width="2" opacity=".7"/>
      </g>
      <path d="M54 88 q6 6 12 0" fill="none" style="stroke:var(--m-mouth, #0e2240)" stroke-width="4" stroke-linecap="round"/>
      <path d="M104 18 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" style="fill:var(--m-star, #ffd23f)"/>
    </g>
</defs></svg>
<!-- 捞捞助手：吉祥物 + 小屏幕 + 对话泡泡（island.js） -->
<div id="island" class="hidden" data-state="bar" data-side="r">
  <div id="laoBub" class="lao-bub" role="status" aria-live="polite"></div>
  <div id="isPanel" role="dialog" aria-label="捞捞助手">
    <div class="is-head"><span class="is-bot"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#mascotArt"/></svg></span><div class="is-who"><b>捞捞</b><small id="isSub"></small></div>
      <button type="button" class="is-hb" id="isGear" title="设置">⚙</button><button type="button" class="is-hb" id="isClose" title="收起（Esc）">✕</button></div>
    <div class="is-body">
      <div id="isSet" class="hidden"><div id="isSetBody"></div></div>
      <div class="is-sec"><b>先做哪件？</b><small id="isTodoN"></small></div>
      <div id="isTodo"></div>
      <div id="isChat"></div>
    </div>
    <form id="isForm" autocomplete="off"><input id="isQ" maxlength="200" placeholder="问捞捞：明天有什么课？（Ctrl+J 打开 / 收起）"><button id="isSend">发送</button></form>
  </div>
  <div class="lao-dock">
    <button type="button" id="laoScr" class="lao-scr" title="点开捞捞助手；按住可以拖动"></button>
    <button type="button" id="laoBot" class="lao-bot" title="捞捞助手：点我聊聊（Ctrl+J），按住可以拖动"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#mascotArt"/></svg><em id="laoN" class="lao-n hidden"></em></button>
  </div>
</div>
<div id="overlay"></div>
<div id="toasts"></div>

<script src="../core/model.js"></script>
<script src="../core/dateparse.js"></script>
<script src="../core/parse.js"></script>
<script src="util.js"></script>
<script src="v-today.js"></script>
<script src="v-week.js"></script>
<script src="v-tasks.js"></script>
<script src="v-month.js"></script>
<script src="v-wall.js"></script>
<script src="v-focus.js"></script>
<script src="v-ai.js"></script>
<script src="v-settings.js"></script>
<script src="v-homework.js"></script>
<script src="v-plan.js"></script>
<script src="v-growth.js"></script>
<script src="v-rank.js"></script>
<script src="v-meta.js"></script>
<script src="v-people.js"></script>
<script src="v-classes.js"></script>
<script src="v-ingest.js"></script>
<script src="v-tools.js"></script>
<script src="v-me.js"></script>
<script src="v-countdown.js"></script>
<script src="v-report.js"></script>
<script src="classitem.js"></script>
<script src="coursed.js"></script>
<script src="../core/island-core.js"></script>
<script src="island.js"></script>
<script src="app.js"></script>
</body>
</html>
