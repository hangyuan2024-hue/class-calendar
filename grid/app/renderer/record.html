<!doctype html>
<!-- 录表情的小页面：MediaPipe 的 wasm 胶水代码要 eval，只在这个页面里放开（只加载本地脚本，不联网）；主窗口还是严格的安全策略 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; worker-src 'self' blob:">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="record.css">
</head>
<body class="rec">
<div class="rec-wrap">
  <div class="cam glass">
    <video id="vid" autoplay muted playsinline></video>
    <canvas id="mesh"></canvas>
    <div class="cam-tag" id="camTag">打开摄像头…</div>
    <div class="rec-dot" id="recDot" hidden>● 正在录</div>
    <div class="level"><i id="lvl"></i></div>
  </div>
  <div class="side-r">
    <div class="glass panel prompt">
      <div class="prompt-top"><span id="jobName">录表情</span><span id="sIdx" class="tag">—</span></div>
      <div class="line" id="line">准备好了吗？</div>
      <div class="hint" id="hint">先坐正，脸在画面中间，光线从前面照过来。点「校准」后，保持自然表情看镜头 2 秒。</div>
      <div class="warns" id="warns"></div>
      <div class="rbtns">
        <button class="btn primary big" id="main">校准（自然表情看镜头）</button>
        <button class="btn ghost" id="redo" hidden>重录这一句</button>
        <button class="btn ghost" id="back">先不录了</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="glass panel"><h3>表情参数（实时）<small class="muted">只上传这些数字和录音，不保存视频</small></h3><div class="params" id="params"></div></div>
  </div>
</div>
<script src="vendor/mediapipe/face_mesh/face_mesh.js"></script>
<script src="expr.js"></script>
<script src="record.js"></script>
</body>
</html>
