plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// 7.0：全新的原生安卓 App（不再沿用 6.x 的代码）。版本号由 GitHub Actions 传进来
def vc = (System.getenv("APP_VERSION_CODE") ?: "700").toInteger()
def vn = System.getenv("APP_VERSION_NAME") ?: "7.0.dev"
// 正式签名：仓库里 android/release.jks（和以前的版本同一个签名，才能覆盖安装）
def ksFile = file("../../android/release.jks").exists() ? file("../../android/release.jks") : file("../release.jks")
def ksPass = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace "com.laolao.classcalendar"
    compileSdk 34
    defaultConfig {
        applicationId "com.laolao.classcalendar"
        minSdk 26
        targetSdk 34
        versionCode vc
        versionName vn
        // 极光推送（AppKey 是公开信息；Master Secret 只放在数据库里）
        manifestPlaceholders = [JPUSH_PKGNAME: "com.laolao.classcalendar", JPUSH_APPKEY: "a4e90cf4ea66b0174921b742", JPUSH_CHANNEL: "official"]
    }
    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias "classcalendar"
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = (ksFile.exists() && ksPass) ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    // 极光推送（会自动带上 JCore）
    implementation "cn.jiguang.sdk:jpush:6.2.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
