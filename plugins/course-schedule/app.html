<html lang="zh-CN">
  <head>

    <title>大学生课程表</title>
    <style>
/* ===== 基础 ===== */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --text: #2b3445;
  --text-light: #7c8798;
  --border: #e4e8f0;
  --primary: #4a7dff;
  --primary-dark: #3a66e0;
  --danger: #e05b5b;
  --danger-dark: #c94a4a;
  --radius: 10px;
  --shadow: 0 2px 10px rgba(43, 52, 69, 0.08);

  /* 柔和课程色板：背景 / 主文字 / 强调条 */
  --p0-bg: #e6eefc; --p0-fg: #2e5fa8; --p0-bar: #5b8def;
  --p1-bg: #fdecef; --p1-fg: #b04a5a; --p1-bar: #e68a97;
  --p2-bg: #e6f7ee; --p2-fg: #2e7d55; --p2-bar: #5fc491;
  --p3-bg: #fff3e2; --p3-fg: #b06a2a; --p3-bar: #eda35c;
  --p4-bg: #f2ecfc; --p4-fg: #6b4aa8; --p4-bar: #9d7be0;
  --p5-bg: #e4f4f9; --p5-fg: #2b6f86; --p5-bar: #5fb7d4;
  --p6-bg: #fdeef7; --p6-fg: #ab4a82; --p6-bar: #e587bd;
  --p7-bg: #f3f1e7; --p7-fg: #7d6a38; --p7-bar: #c2ab62;
  --p8-bg: #eef3e1; --p8-fg: #5d7730; --p8-bar: #9cb85c;
  --p9-bg: #fdefe9; --p9-fg: #a95c3d; --p9-bar: #e0936f;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* ===== 顶部 ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.header-left {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.semester-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px dashed transparent;
  transition: background 0.2s, border-color 0.2s;
  line-height: 1.3;
}

.semester-title:hover {
  background: var(--bg);
  border-color: var(--border);
}

.semester-hint {
  font-size: 12px;
  color: var(--text-light);
}

.semester-input {
  font-size: 20px;
  font-weight: 700;
  font-family: inherit;
  color: var(--text);
  padding: 4px 10px;
  border: 1px solid var(--primary);
  border-radius: 8px;
  outline: none;
  background: #fff;
  width: auto;
  min-width: 220px;
}

@media (max-width: 640px) {
  .semester-input {
    font-size: 17px;
    min-width: 180px;
  }
}

/* 今天脉冲动画 */
@keyframes todayPulse {
  0% { box-shadow: 0 0 0 0 rgba(74, 125, 255, 0.45); }
  100% { box-shadow: 0 0 0 14px rgba(74, 125, 255, 0); }
}

.grid-head.day-head.today-pulse {
  animation: todayPulse 0.6s ease-out;
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap; /* 窄屏时按钮换行，避免被挤成竖排 */
}

.header-actions .btn {
  white-space: nowrap;
}

/* 时间模式切换 */
.time-mode-switch {
  display: flex;
  background: #eef0f5;
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}

.mode-btn {
  border: none;
  background: transparent;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  border-radius: 6px;
  color: var(--text-light);
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  white-space: nowrap;
}

.mode-btn:hover {
  color: var(--text);
}

.mode-btn.active {
  background: #fff;
  color: var(--primary);
  box-shadow: 0 1px 4px rgba(30, 38, 54, 0.1);
}

/* 当前周导航 */
.week-nav {
  display: flex;
  align-items: center;
  background: #eef0f5;
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}

.week-btn {
  border: none;
  background: transparent;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-light);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s;
}

.week-btn:hover {
  background: #fff;
  color: var(--primary);
}

.week-label {
  min-width: 52px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.btn {
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.2s, transform 0.1s;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-dark);
}

.btn-today {
  background: var(--surface);
  color: var(--primary);
  border: 1px solid var(--primary);
}

.btn-today:hover {
  background: #eef3ff;
}

.modal-sm {
  max-width: 380px;
}

.btn-cancel {
  background: #eef0f5;
  color: var(--text);
}

.btn-cancel:hover {
  background: #e2e5ec;
}

.btn-danger {
  background: var(--danger);
  color: #fff;
}

.btn-danger:hover {
  background: var(--danger-dark);
}

.btn-edit {
  background: var(--primary);
  color: #fff;
}

.btn-edit:hover {
  background: var(--primary-dark);
}

/* ===== 主体 ===== */
.app-main {
  padding: 18px 20px 30px;
  max-width: 1400px;
  margin: 0 auto;
}

.table-scroll {
  overflow-x: auto;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  -webkit-overflow-scrolling: touch;
}

.schedule-grid {
  display: grid;
  grid-template-columns: 66px repeat(7, minmax(104px, 1fr));
  grid-template-rows: 46px repeat(10, minmax(58px, 1fr));
  min-width: 800px;
  position: relative;
}

/* 表头 */
.grid-head {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  background: #f9fafd;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 5;
}

.grid-head.day-head {
  background: #f4f7ff;
  color: var(--primary-dark);
}

.grid-head.day-head.today {
  background: #dfe9ff;
  color: var(--primary-dark);
}

.grid-head .today-badge {
  display: none;
  margin-left: 6px;
  font-size: 11px;
  font-weight: 600;
  background: var(--primary);
  color: #fff;
  padding: 1px 6px;
  border-radius: 20px;
}

.grid-head.day-head.today .today-badge {
  display: inline-block;
}

/* 节次标签 */
.grid-period {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-light);
  background: #fafbfe;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 4px;
}

.grid-period .period-time {
  font-size: 11px;
  font-weight: 400;
  color: #a7b0bf;
}

/* 背景网格格 */
.grid-cell {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

.grid-cell.today-col {
  background: #f2f6ff;
}

/* 课程卡片 */
.course-card {
  border-radius: 8px;
  padding: 7px 8px 7px 12px;
  font-size: 13px;
  line-height: 1.35;
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.course-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

.course-card:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(43, 52, 69, 0.12);
}

.course-card .course-name {
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.course-card .course-meta {
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 调课 / 调休 */
.grid-head .adj-badge { font-size: 9px; padding: 1px 5px; margin-left: 4px; border-radius: 5px; background: #fff1d6; color: #b46a00; font-weight: 700; vertical-align: 1px; }
.grid-head .adj-badge.off { background: #e8f6ee; color: #1d8a55; }
.course-card .off-tag.adj { color: inherit; opacity: .85; }
.course-card.adj-add { outline: 2px dashed currentColor; outline-offset: -3px; }
.course-card.adj-swap { box-shadow: inset 0 0 0 2px rgba(180, 106, 0, .35); }

/* 本周不上的课：淡淡显示 */
.course-card.off-week { opacity: .5; filter: grayscale(.7); border: 1px dashed currentColor; }
.course-card.off-week:hover { opacity: .8; }
.course-card .off-tag { font-size: 10px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.course-card.shared { padding-left: 9px; padding-right: 4px; }
.course-card.shared .course-meta { font-size: 10px; }

/* 色板分配 */
.color-0 { background: var(--p0-bg); color: var(--p0-fg); }
.color-0::before { background: var(--p0-bar); }
.color-1 { background: var(--p1-bg); color: var(--p1-fg); }
.color-1::before { background: var(--p1-bar); }
.color-2 { background: var(--p2-bg); color: var(--p2-fg); }
.color-2::before { background: var(--p2-bar); }
.color-3 { background: var(--p3-bg); color: var(--p3-fg); }
.color-3::before { background: var(--p3-bar); }
.color-4 { background: var(--p4-bg); color: var(--p4-fg); }
.color-4::before { background: var(--p4-bar); }
.color-5 { background: var(--p5-bg); color: var(--p5-fg); }
.color-5::before { background: var(--p5-bar); }
.color-6 { background: var(--p6-bg); color: var(--p6-fg); }
.color-6::before { background: var(--p6-bar); }
.color-7 { background: var(--p7-bg); color: var(--p7-fg); }
.color-7::before { background: var(--p7-bar); }
.color-8 { background: var(--p8-bg); color: var(--p8-fg); }
.color-8::before { background: var(--p8-bar); }
.color-9 { background: var(--p9-bg); color: var(--p9-fg); }
.color-9::before { background: var(--p9-bar); }

/* ===== 页脚 ===== */
.app-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 4px 0;
  font-size: 13px;
  color: var(--text-light);
}

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(30, 38, 54, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  backdrop-filter: blur(2px);
}

.mode-btn.hidden { display: none; }
.modal-overlay.hidden {
  display: none;
}

.modal {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(30, 38, 54, 0.18);
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 22px 24px;
}

.modal h2 {
  font-size: 18px;
  margin-bottom: 16px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--text);
}

.field-full {
  grid-column: 1 / -1;
}

.field span em {
  color: var(--danger);
  font-style: normal;
}

.field input,
.field select,
.field textarea {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  width: 100%;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(74, 125, 255, 0.12);
}

.field textarea {
  resize: vertical;
}

.form-error {
  margin-top: 12px;
  font-size: 13px;
  color: var(--danger);
}

.form-error.hidden {
  display: none;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

/* 详情弹窗 */
.detail-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 14px;
}

.detail-row {
  display: flex;
  gap: 10px;
}

.detail-row .detail-label {
  color: var(--text-light);
  min-width: 62px;
  flex-shrink: 0;
}

.detail-row .detail-value {
  color: var(--text);
  word-break: break-word;
}

.detail-name {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
}

.detail-name .color-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .app-header {
    padding: 12px 14px;
  }

  .semester-title {
    font-size: 17px;
  }

  .semester-hint {
    display: none;
  }

  .app-main {
    padding: 12px 10px 24px;
  }

  .btn {
    padding: 8px 12px;
    font-size: 13px;
  }

  .mode-btn {
    padding: 6px 10px;
    font-size: 12px;
  }

  .week-btn {
    width: 24px;
    height: 24px;
  }

  .week-label {
    min-width: 44px;
    font-size: 12px;
  }

  .schedule-grid {
    grid-template-columns: 60px repeat(7, minmax(92px, 1fr));
    grid-template-rows: 42px repeat(10, minmax(52px, 1fr));
    min-width: 704px;
  }

  .grid-head {
    font-size: 13px;
  }

  .grid-period .period-time {
    display: block;
    font-size: 9px;
    line-height: 1.15;
    white-space: nowrap;
  }

  .course-card {
    padding: 5px 6px 5px 10px;
    font-size: 12px;
  }

  .course-card .course-name {
    font-size: 12px;
  }

  .course-card .course-meta {
    font-size: 11px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field-full {
    grid-column: auto;
  }

  .modal {
    padding: 18px;
  }
}

</style>

  <body>
    <header class="app-header">
      <div class="header-left">
        <div class="header-kicker">学习工具 <span>WEEKLY PLANNER</span></div>
        <h1 id="semester-title" class="semester-title" title="点击修改学期">2026-2027学年第一学期</h1>
        <span class="semester-hint">点击学期可修改</span>
      </div>
      <div class="header-actions">
        <div class="time-mode-switch" id="time-mode-switch" role="group" aria-label="时间模式">
          <button type="button" class="mode-btn" data-mode="winter">冬春季</button>
          <button type="button" class="mode-btn" data-mode="summer">夏秋季</button>
          <button type="button" class="mode-btn hidden" data-mode="custom" id="mode-custom" title="从课表截图里认出的上课时间">截图时间</button>
        </div>
        <div class="week-nav" role="group" aria-label="当前周">
          <button type="button" class="week-btn" id="week-prev" title="上一周">−</button>
          <span class="week-label" id="week-label">第1周</span>
          <button type="button" class="week-btn" id="week-next" title="下一周">＋</button>
        </div>
        <button id="today-btn" class="btn btn-today" title="定位到今天">今天</button>
        <button id="add-course-btn" class="btn btn-primary">＋ 添加课程</button>
      </div>
    </header>

    <main class="app-main">
      <div class="board-top"><div><h2>本周课表</h2><p>点击课程查看详情，向左滑动查看整周安排。</p></div><span class="board-label"><i aria-hidden="true"></i> 你的学习节奏</span></div>
      <div class="table-scroll" id="table-scroll">
        <div class="schedule-grid" id="schedule-grid"></div>
      </div>
      <footer class="app-footer">
        <span id="course-count">共 0 门课程</span>
        <span>数据保存在本地浏览器，刷新不会丢失</span>
      </footer>
    </main>

    <!-- 课程编辑弹窗 -->
    <div class="modal-overlay hidden" id="course-modal">
      <div class="modal" role="dialog" aria-modal="true">
        <h2 id="modal-title">添加课程</h2>
        <form id="course-form" novalidate>
          <div class="form-grid">
            <label class="field">
              <span>课程名称 <em>*</em></span>
              <input type="text" id="course-name" maxlength="30" placeholder="如：高等数学" required />
            </label>
            <label class="field">
              <span>教师 <em>*</em></span>
              <input type="text" id="course-teacher" maxlength="20" placeholder="如：张老师" required />
            </label>
            <label class="field">
              <span>上课地点 <em>*</em></span>
              <input type="text" id="course-location" maxlength="30" placeholder="如：教学楼A-301" required />
            </label>
            <label class="field">
              <span>星期 <em>*</em></span>
              <select id="course-day" required></select>
            </label>
            <label class="field">
              <span>开始节次 <em>*</em></span>
              <select id="course-start" required></select>
            </label>
            <label class="field">
              <span>结束节次 <em>*</em></span>
              <select id="course-end" required></select>
            </label>
            <label class="field">
              <span>课程性质</span>
              <select id="course-type">
                <option value="必修">必修</option>
                <option value="选修">选修</option>
                <option value="其他">其他</option>
              </select>
            </label>
            <label class="field">
              <span>备注</span>
              <input type="text" id="course-note" maxlength="100" placeholder="选填，如：需要带计算器" />
            </label>
            <label class="field field-full">
              <span>上课周次 <em>*</em></span>
              <input type="text" id="course-weeks" maxlength="40" placeholder="如：1-16、1-8单、2-16双、1,3,5,7" required />
            </label>
          </div>
          <p class="form-error hidden" id="form-error"></p>
          <div class="modal-actions">
            <button type="button" class="btn btn-cancel" id="modal-cancel">取消</button>
            <button type="submit" class="btn btn-primary">保存课程</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 课程详情弹窗 -->
    <div class="modal-overlay hidden" id="detail-modal">
      <div class="modal" role="dialog" aria-modal="true">
        <h2>课程详情</h2>
        <div class="detail-body" id="detail-body"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="detail-delete">删除</button>
          <button type="button" class="btn btn-edit" id="detail-edit">编辑</button>
          <button type="button" class="btn btn-cancel" id="detail-close">关闭</button>
        </div>
      </div>
    </div>

    <script>
/* ===== 数据键 ===== */
var COURSES_KEY = "personal_course_schedule_courses_v1";
var SEMESTER_KEY = "personal_course_schedule_semester_v1";
var TIME_MODE_KEY = "personal_course_schedule_time_mode_v1";
var WEEK_KEY = "personal_course_schedule_current_week_v1";
/* 用户是否主动切换过周次的标记：只有为 "1" 时才使用 WEEK_KEY 中的当前查看周 */
var WEEK_USER_SET_KEY = "personal_course_schedule_week_user_set_v1";
/* 捞捞课程表接入：周次最多 20 周；「截图时间」和第 1 周的日期由主页面的「拍照导入」写进来 */
var MAX_WEEK = 20;
var CUSTOM_TIMES_KEY = "personal_course_schedule_custom_times_v1";
var WEEK1_KEY = "plg_course-schedule_week1";

/* ===== 时间模式 ===== */
var TIME_MODES = {
  winter: {
    label: "冬春季",
    periods: [
      "08:00-08:50", "09:00-09:50", "10:10-11:00", "11:10-12:00",
      "14:00-14:50", "15:00-15:50", "16:10-17:00", "17:10-18:00",
      "19:10-20:00", "20:10-21:00"
    ]
  },
  summer: {
    label: "夏秋季",
    periods: [
      "08:00-08:50", "09:00-09:50", "10:10-11:00", "11:10-12:00",
      "14:30-15:20", "15:30-16:20", "16:40-17:30", "17:40-18:30",
      "19:40-20:30", "20:40-21:30"
    ]
  }
};

function loadCustomTimes() {
  try {
    var arr = JSON.parse(localStorage.getItem(CUSTOM_TIMES_KEY) || "null");
    if (Array.isArray(arr) && arr.length >= 4 && arr.length <= 16 &&
        arr.every(function (t) { return /^\d{2}:\d{2}-\d{2}:\d{2}$/.test(t); })) return arr;
  } catch (e) {}
  return null;
}
(function () {
  var ct = loadCustomTimes();
  if (ct) TIME_MODES.custom = { label: "截图时间", periods: ct };
})();

var DAY_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
var PALETTE_COUNT = 10;

/* ===== 状态 ===== */
var state = {
  courses: loadCourses(),
  timeMode: loadTimeMode() || defaultTimeMode(),
  currentWeek: loadWeek(),
  editingId: null
};

/* ===== 元素引用 ===== */
var gridEl, semesterTitleEl, todayBtn, addBtn;
var modalOverlay, modalTitle, courseForm;
var courseName, courseTeacher, courseLocation, courseDay, courseStart, courseEnd, courseType, courseWeeks, courseNote;
var errorEl, modalCancel;
var detailModal, detailBody, detailDelete, detailEdit, detailClose;
var weekPrev, weekNext, weekLabel, countEl;

/* ===== localStorage ===== */
function loadCourses() {
  try {
    var raw = localStorage.getItem(COURSES_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function saveCourses() {
  try {
    localStorage.setItem(COURSES_KEY, JSON.stringify(state.courses));
  } catch (e) {}
}

function loadSemester() {
  try {
    return localStorage.getItem(SEMESTER_KEY);
  } catch (e) {
    return null;
  }
}

function saveSemester(text) {
  try {
    localStorage.setItem(SEMESTER_KEY, text);
  } catch (e) {}
}

function loadTimeMode() {
  try {
    var v = localStorage.getItem(TIME_MODE_KEY);
    return v === "winter" || v === "summer" || (v === "custom" && TIME_MODES.custom) ? v : null;
  } catch (e) {
    return null;
  }
}

function saveTimeMode() {
  try {
    localStorage.setItem(TIME_MODE_KEY, state.timeMode);
  } catch (e) {}
}

/* 当前查看周的默认值：
 * 首次打开（用户从未主动切换过周次）→ 自动显示真实教学周 actualWeek；
 * 用户通过周导航主动切换过周次后 → 使用 localStorage 中保存的当前查看周。
 * 这样旧数据里错误的 currentWeek=1 不会把页面卡在第1周。
 */
function loadWeek() {
  try {
    if (localStorage.getItem(WEEK_USER_SET_KEY) === "1") {
      var v = parseInt(localStorage.getItem(WEEK_KEY), 10);
      if (isFinite(v) && v >= 1 && v <= MAX_WEEK) return v;
    }
  } catch (e) {}
  var actual = weekOfToday();
  return actual >= 1 && actual <= MAX_WEEK ? actual : 1;
}

function saveWeek() {
  try {
    localStorage.setItem(WEEK_KEY, String(state.currentWeek));
  } catch (e) {}
}

/* ===== 时间工具 ===== */
function defaultTimeMode() {
  var m = new Date().getMonth() + 1;
  return m >= 5 && m <= 10 ? "summer" : "winter";
}

function currentTimes() {
  return TIME_MODES[state.timeMode].periods;
}

function toMinutes(t) {
  var p = t.split(":");
  return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
}

function timeRangeText(s, e) {
  var times = currentTimes();
  return (times[s - 1] || "") + " → " + (times[e - 1] || "");
}

/* ===== 教学周（固定基准） =====
 * 固定条件：2026年9月14日（星期一）= 第1周周一。
 * JavaScript 月份从 0 开始：8 代表 9 月。
 * 教学周只由"今天与学期起始日期的天数差"计算，绝不使用自然周、当前月份第几周、
 * 不以 new Date() 所在周作为第1周，也绝不读取 localStorage 中的当前查看周。
 */
function semesterStartDate() {
  /* 在「同步到日历」里改过第 1 周的日期就用改过的 */
  try {
    var v = JSON.parse(localStorage.getItem(WEEK1_KEY) || "null");
    var m = typeof v === "string" && v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  } catch (e) {}
  return new Date(2026, 8, 14);
}

/* ===== 调课 / 调休（主页面「🔁 调课 / 调休」里记的，存在 personal_course_schedule_adjust_v1） =====
 * swap：这天按 from 那天的课上；off：这天放假；cancel：这天某门课不上；add：这天加一节课
 */
var ADJ_KEY = "personal_course_schedule_adjust_v1";
function loadAdj() {
  try { var a = JSON.parse(localStorage.getItem(ADJ_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function ymd(dt) { return dt.getFullYear() + "-" + ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2); }
function parseYmd(k) { var m = String(k || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function dateOfWeekDay(week, d) { var x = semesterStartDate(); x.setDate(x.getDate() + (week - 1) * 7 + d); return ymd(x); }
function mdLabel(k) { var x = parseYmd(k); return x ? (x.getMonth() + 1) + "月" + x.getDate() + "日" + DAY_NAMES[(x.getDay() + 6) % 7] : k; }
/* 课表里原本这一天的课（不管调课） */
function baseOnDate(k) {
  var x = parseYmd(k); if (!x) return [];
  var wk = Math.floor(Math.round((x - semesterStartDate()) / 86400000) / 7) + 1, day = (x.getDay() + 6) % 7, out = [];
  if (wk < 1 || wk > MAX_WEEK) return out;
  for (var i = 0; i < state.courses.length; i++) { var c = state.courses[i]; if (+c.day === day && weeksInclude(c.weeks, wk)) out.push(c); }
  return out;
}
/* 第 week 周、第 d 天（0=周一）实际上的课，和一句说明 */
function dayCourses(week, d, adj) {
  var k = dateOfWeekDay(week, d), on = adj.filter(function (a) { return a.date === k; }), list, note = "", i;
  var off = on.filter(function (a) { return a.type === "off"; })[0], sw = on.filter(function (a) { return a.type === "swap"; })[0];
  if (off) { list = []; note = off.note || "放假"; }
  else if (sw) { list = baseOnDate(sw.from).map(function (c) { var o = {}; for (var p in c) o[p] = c[p]; o.day = d; o._from = sw.from; return o; }); note = "上" + mdLabel(sw.from) + "的课"; }
  else list = baseOnDate(k);
  for (i = 0; i < on.length; i++) if (on[i].type === "cancel") { var a = on[i]; list = list.filter(function (c) { return !(c.name === a.name && (!a.start || +a.start === +c.start)); }); }
  for (i = 0; i < on.length; i++) if (on[i].type === "add") { var b = on[i]; list.push({ id: "adj_" + b.id, name: b.name, day: d, start: +b.start, end: +b.end || +b.start, location: b.location || "", teacher: b.teacher || "", weeks: "", _add: true }); }
  if (!off && !sw) { var nc = on.filter(function (a) { return a.type === "cancel"; }).length, na = on.filter(function (a) { return a.type === "add"; }).length; note = (nc ? "停" + nc + "节" : "") + (nc && na ? "，" : "") + (na ? "加" + na + "节" : ""); }
  return { list: list, note: note, off: !!off, swap: !!sw };
}

/* 真实日期所在教学周（1 起）：
 * actualWeek = Math.floor(dayDifference / 7) + 1
 * 例如：2026-09-14→第1周，09-21→第2周，09-28→第3周，09-29→第3周
 */
function weekOfToday() {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var dayDifference = Math.round((today - semesterStartDate()) / 86400000);
  return Math.floor(dayDifference / 7) + 1;
}

/* 今天对应的课程表列索引（0=周一 ... 6=周日）。
 * Date.getDay()：0=周日 1=周一 ... 6=周六
 * 转换公式：courseDayIndex = (date.getDay() + 6) % 7
 */
function todayIndex() {
  return (new Date().getDay() + 6) % 7;
}

/* 是否正在查看"本周"：只有 viewingWeek === actualWeek 时，"今天"标记才显示。
 * 这里只用真实日期重新计算的 actualWeek，绝不读取旧的 currentWeek。
 */
function isTodayVisible() {
  return state.currentWeek === weekOfToday();
}

/* ===== 周次解析 =====
 * 支持格式：
 *   - 1-16 / 1-8 / 9-16（范围）
 *   - 1,3,5,7 / 2,4,6,8（逗号分隔）
 *   - 1-8单 / 2-16双（奇偶周）
 * 返回以周次为键的对象（如 {1:true, 3:true}）
 */
function parseWeeksToSet(str) {
  var set = {};
  var s = typeof str === "string" ? str.trim() : "";
  if (!s) {
    for (var z = 1; z <= MAX_WEEK; z++) set[z] = true;
    return set;
  }
  var parityMatch = s.match(/^(\d+)\s*[-–—~至]\s*(\d+)\s*[（(]?\s*(单|双)\s*[）)]?$/);
  if (parityMatch) {
    var pa = parseInt(parityMatch[1], 10);
    var pb = parseInt(parityMatch[2], 10);
    var parity = parityMatch[3];
    for (var pi = pa; pi <= pb; pi++) {
      if (parity === "单" && pi % 2 === 1) set[pi] = true;
      if (parity === "双" && pi % 2 === 0) set[pi] = true;
    }
    return set;
  }
  var parts = s.split(/[,，、;；\s]+/);
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i].trim();
    if (!part) continue;
    var range = part.match(/^(\d+)\s*[-–—~至]\s*(\d+)$/);
    if (range) {
      var x = parseInt(range[1], 10);
      var y = parseInt(range[2], 10);
      if (x > y) { var t = x; x = y; y = t; }
      for (var k = x; k <= y; k++) set[k] = true;
    } else if (/^\d+$/.test(part)) {
      set[parseInt(part, 10)] = true;
    }
  }
  return set;
}

function weeksInclude(weeks, week) {
  return !!parseWeeksToSet(weeks)[week];
}

function formatWeeks(w) {
  var s = typeof w === "string" && w.trim() ? w.trim() : "1-16";
  return s + "周";
}

/* ===== 颜色 ===== */
function colorIndex(name) {
  var h = 0;
  var s = String(name || "");
  for (var i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) >>> 0;
  }
  return h % PALETTE_COUNT;
}

function barColor(name) {
  var idx = colorIndex(name);
  var v = "";
  try {
    v = getComputedStyle(document.documentElement).getPropertyValue("--p" + idx + "-bar").trim();
  } catch (e) {}
  return v || "#4a7dff";
}

/* ===== 冲突检测 ===== */
function conflictWith(course, excludeId) {
  var cw = parseWeeksToSet(course.weeks);
  for (var i = 0; i < state.courses.length; i++) {
    var other = state.courses[i];
    if (excludeId != null && other.id === excludeId) continue;
    if (other.day !== course.day) continue;
    if (other.start > course.end || course.start > other.end) continue;
    var ow = parseWeeksToSet(other.weeks);
    for (var w in cw) {
      if (ow[w]) return { course: other, week: parseInt(w, 10) };
    }
  }
  return null;
}

/* ===== 渲染 ===== */
/* 一共画几节：上课时间表有几节，或者课程里最晚到第几节（晚上第 11、12 节的课也要画得下） */
function periodCount() {
  var n = currentTimes().length;
  for (var i = 0; i < state.courses.length; i++) n = Math.max(n, +state.courses[i].end || 0);
  return Math.min(16, Math.max(n, 10));
}

function applyGridRows() {
  var base = typeof window !== "undefined" && window.innerWidth <= 640 ? 52 : 58;
  var times = currentTimes();
  var rows = [];
  for (var i = 0; i < periodCount(); i++) {
    var dur = 50;
    if (times[i]) { var parts = times[i].split("-"); dur = toMinutes(parts[1]) - toMinutes(parts[0]); }
    rows.push(Math.max(44, Math.round((dur / 50) * base)) + "px");
  }
  gridEl.style.gridTemplateRows = "46px " + rows.join(" ");
}

/* 这一天里时间重叠的课排成几条「车道」：同一节有两门课（单双周、补课）时并排显示，不叠在一起 */
function lanes(list) {
  list.sort(function (a, b) { return a.start - b.start || b.end - a.end; });
  var out = [], cluster = [], cEnd = 0;
  function flush() {
    var laneEnd = [];
    for (var i = 0; i < cluster.length; i++) {
      var c = cluster[i], k = 0;
      while (k < laneEnd.length && laneEnd[k] >= c.start) k++;
      laneEnd[k] = c.end; out.push({ c: c, lane: k, group: cluster });
    }
    for (var j = out.length - cluster.length; j < out.length; j++) out[j].n = laneEnd.length;
    cluster = [];
  }
  for (var i = 0; i < list.length; i++) {
    if (cluster.length && list[i].start > cEnd) flush();
    if (!cluster.length) cEnd = list[i].end;
    cluster.push(list[i]); cEnd = Math.max(cEnd, list[i].end);
  }
  if (cluster.length) flush();
  return out;
}

/* 不在本周的课：离本周最近的下一次是第几周 */
function nextWeekOf(weeks, week) {
  var set = parseWeeksToSet(weeks), best = 0, first = 0;
  for (var w = 1; w <= MAX_WEEK; w++) if (set[w]) { if (!first) first = w; if (w > week && !best) best = w; }
  return best || first;
}

function render() {
  applyGridRows();

  var times = currentTimes();
  var tIdx = todayIndex();
  var showToday = isTodayVisible();
  var html = [];

  /* 这一周每天实际上的课（算上调课 / 调休） */
  var ADJ = loadAdj(), days = [];
  for (var dd0 = 0; dd0 < 7; dd0++) days.push(dayCourses(state.currentWeek, dd0, ADJ));

  /* 表头 */
  html.push('<div class="grid-head" style="grid-row:1;grid-column:1"></div>');
  for (var d = 0; d < 7; d++) {
    var isToday = showToday && d === tIdx, dn = days[d].note;
    html.push(
      '<div class="grid-head day-head' + (isToday ? " today" : "") + (dn ? " adj" : "") + '" data-day="' + d + '" style="grid-row:1;grid-column:' + (d + 2) + '"' + (dn ? ' title="' + escapeHtml(dn) + '"' : "") + '>' +
      DAY_NAMES[d] +
      (isToday ? '<span class="today-badge">今天</span>' : "") +
      (dn ? '<span class="adj-badge' + (days[d].off ? " off" : "") + '">' + escapeHtml(days[d].off ? "放假" : days[d].swap ? "调课" : "有变动") + "</span>" : "") +
      "</div>"
    );
  }

  /* 节次与背景格 */
  var nper = periodCount();
  for (var p = 0; p < nper; p++) {
    html.push(
      '<div class="grid-period" style="grid-row:' + (p + 2) + ';grid-column:1"><span>第' + (p + 1) + "节</span>" +
      '<span class="period-time">' + (times[p] || "") + "</span></div>"
    );
    for (var d2 = 0; d2 < 7; d2++) {
      html.push('<div class="grid-cell' + (showToday && d2 === tIdx ? " today-col" : "") + '" style="grid-row:' + (p + 2) + ';grid-column:' + (d2 + 2) + '"></div>');
    }
  }
  gridEl.innerHTML = html.join("");

  /* 课程卡片：本周有的课正常显示；本周没有、这个时间也空着的课淡淡地显示（标「非本周」），不然像是没导进来 */
  var visible = [], ghosts = [];
  for (var di = 0; di < 7; di++) visible = visible.concat(days[di].list);
  for (var gi = 0; gi < state.courses.length; gi++) {
    var g = state.courses[gi];
    if (weeksInclude(g.weeks, state.currentWeek)) continue;
    if (days[+g.day] && (days[+g.day].off || days[+g.day].swap)) continue;   // 放假 / 调课的那天不显示别的周的课
    var hit = false;
    for (var vj = 0; vj < visible.length; vj++) {
      var v = visible[vj];
      if (+v.day === +g.day && v.start <= g.end && g.start <= v.end) { hit = true; break; }
    }
    if (!hit) ghosts.push(g);
  }
  /* 同一个空格子里有好几门非本周的课：只显示离本周最近的那一门，写上「还有 N 门」 */
  var ghostShow = [];
  for (var gd = 0; gd < 7; gd++) {
    var gl = lanes(ghosts.filter(function (x) { return +x.day === gd; }));
    var seen = [];
    for (var gk = 0; gk < gl.length; gk++) {
      var grp = gl[gk].group;
      if (seen.indexOf(grp) >= 0) continue;
      seen.push(grp);
      var pick = grp.slice().sort(function (a, b) { return nextWeekOf(a.weeks, state.currentWeek) - nextWeekOf(b.weeks, state.currentWeek); })[0];
      ghostShow.push({ c: pick, lane: 0, n: 1, more: grp.length - 1, ghost: true });
    }
  }
  var placed = [];
  for (var dd = 0; dd < 7; dd++) placed = placed.concat(lanes(visible.filter(function (x) { return +x.day === dd; })));
  placed = placed.concat(ghostShow);
  for (var vi = 0; vi < placed.length; vi++) {
    var it = placed[vi], c = it.c;
    var col = c.day + 2; /* 第1列是节次，周一从第2列开始 */
    var rowStart = c.start + 1;
    var rowEnd = c.end + 1;
    var card = document.createElement("div");
    card.className = "course-card color-" + colorIndex(c.name) + (it.ghost ? " off-week" : "") + (it.n > 1 ? " shared" : "") + (c._add ? " adj-add" : c._from ? " adj-swap" : "");
    card.style.gridColumn = col + " / " + (col + 1);
    card.style.gridRow = rowStart + " / " + (rowEnd + 1);
    if (it.n > 1) {
      /* 并排：每门课占这一格的 1/n */
      card.style.width = "calc(" + (100 / it.n) + "% - 4px)";
      card.style.marginLeft = "calc(" + (100 * it.lane / it.n) + "% + 2px)";
      card.style.marginRight = "0";
    }
    card.dataset.id = c.id;
    card.innerHTML =
      (it.ghost ? '<div class="off-tag">非本周' + (it.more ? " · 还有" + it.more + "门" : "") + "</div>" : "") +
      (c._add ? '<div class="off-tag adj">加课</div>' : c._from ? '<div class="off-tag adj">调课 · 原' + escapeHtml(mdLabel(c._from)) + "</div>" : "") +
      '<div class="course-name">' + escapeHtml(c.name) + "</div>" +
      '<div class="course-meta">📍 ' + escapeHtml(c.location || "未填写地点") + "</div>" +
      '<div class="course-meta">👤 ' + escapeHtml(c.teacher || "未填写教师") + "</div>" +
      (c._add ? "" : '<div class="course-meta">📅 ' + escapeHtml(formatWeeks(c.weeks)) + "</div>");
    (function (id, added) {
      card.addEventListener("click", function () {
        if (added) { alert("这是在「调课 / 调休」里加的一节课，要改在主页面课程表上方的「🔁 调课 / 调休」里改。"); return; }
        openDetail(id);
      });
    })(c.id, !!c._add);
    gridEl.appendChild(card);
  }

  /* 页脚统计 */
  countEl.textContent = "共 " + state.courses.length + " 门课程";
  if (visible.length !== state.courses.length) {
    countEl.textContent += " · 第" + state.currentWeek + "周显示 " + visible.length + " 门";
  }
  updateWeekLabel();
}

/* ===== 表单填充 ===== */
function fillDaySelect() {
  var opts = [];
  for (var i = 0; i < 7; i++) {
    opts.push('<option value="' + i + '">' + DAY_NAMES[i] + "</option>");
  }
  courseDay.innerHTML = opts.join("");
}

function fillPeriodSelects(prevStart, prevEnd) {
  var times = currentTimes();
  var opts = [];
  for (var i = 1; i <= times.length; i++) {
    opts.push('<option value="' + i + '">第' + i + "节（" + times[i - 1] + "）</option>");
  }
  courseStart.innerHTML = opts.join("");
  courseEnd.innerHTML = opts.join("");
  if (prevStart != null) courseStart.value = String(prevStart);
  updateEndSelect(prevEnd);
}

function updateEndSelect(prevEnd) {
  var start = parseInt(courseStart.value, 10) || 1;
  var times = currentTimes();
  var opts = [];
  for (var i = start; i <= times.length; i++) {
    opts.push('<option value="' + i + '">第' + i + "节（" + times[i - 1] + "）</option>");
  }
  courseEnd.innerHTML = opts.join("");
  var want = prevEnd != null ? prevEnd : parseInt(courseEnd.value, 10) || start;
  courseEnd.value = String(Math.max(start, want));
}

/* ===== 弹窗 ===== */
function showModal(el) {
  el.classList.remove("hidden");
}

function hideModal(el) {
  el.classList.add("hidden");
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.remove("hidden");
}

function hideError() {
  errorEl.classList.add("hidden");
}

function openCourseModal(course) {
  state.editingId = course ? course.id : null;
  modalTitle.textContent = course ? "编辑课程" : "添加课程";
  courseName.value = course ? course.name : "";
  courseTeacher.value = course ? course.teacher : "";
  courseLocation.value = course ? course.location : "";
  courseDay.value = course ? String(course.day) : String(todayIndex());
  var ps = course ? course.start : 1;
  var pe = course ? course.end : 1;
  fillPeriodSelects(ps, pe);
  courseType.value = course ? course.courseType || "必修" : "必修";
  courseWeeks.value = course ? course.weeks || "" : "";
  courseNote.value = course ? course.note || "" : "";
  hideError();
  showModal(modalOverlay);
  setTimeout(function () {
    courseName.focus();
  }, 30);
}

function openDetail(id) {
  var c = null;
  for (var i = 0; i < state.courses.length; i++) {
    if (state.courses[i].id === id) {
      c = state.courses[i];
      break;
    }
  }
  if (!c) return;
  var rows =
    '<div class="detail-name"><span class="color-dot" style="background:' + barColor(c.name) + '"></span>' +
    escapeHtml(c.name) + "</div>" +
    detailRow("课程性质", c.courseType || "必修") +
    detailRow("教师", c.teacher || "未填写") +
    detailRow("上课地点", c.location || "未填写") +
    detailRow("时间", DAY_NAMES[c.day] + " 第" + c.start + "-" + c.end + "节（" + timeRangeText(c.start, c.end) + "）") +
    detailRow("上课周次", formatWeeks(c.weeks)) +
    (c.note ? detailRow("备注", c.note) : "");
  detailBody.innerHTML = rows;
  detailDelete.dataset.id = c.id;
  detailEdit.dataset.id = c.id;
  showModal(detailModal);
}

function detailRow(label, value) {
  return '<div class="detail-row"><span class="detail-label">' + label + "</span>" +
    '<span class="detail-value">' + value + "</span></div>";
}

/* ===== 提交 ===== */
function handleSubmit(e) {
  e.preventDefault();
  var name = courseName.value.trim();
  var teacher = courseTeacher.value.trim();
  var location = courseLocation.value.trim();
  var weeks = courseWeeks.value.trim();
  var day = parseInt(courseDay.value, 10);
  var start = parseInt(courseStart.value, 10);
  var end = parseInt(courseEnd.value, 10);
  var type = courseType.value || "必修";
  var note = courseNote.value.trim();

  if (!name) return showError("请填写课程名称");
  if (isNaN(day) || day < 0 || day > 6) return showError("请选择星期");
  if (isNaN(start) || isNaN(end)) return showError("请选择开始和结束节次");
  if (start > end) return showError("开始节次不能大于结束节次");
  if (!weeks) return showError("请填写上课周次");
  var weekSet = parseWeeksToSet(weeks);
  if (Object.keys(weekSet).length === 0) {
    return showError("上课周次格式无法识别，请参考示例：1-16、1-8单、2-16双、1,3,5,7");
  }
  var maxWeek = 0;
  for (var wk in weekSet) {
    if (+wk > maxWeek) maxWeek = +wk;
  }
  if (maxWeek > MAX_WEEK) {
    return showError("上课周次超出范围：本课程表仅支持第1~" + MAX_WEEK + "周");
  }

  var course = {
    id: state.editingId || "c" + Date.now() + "_" + Math.floor(Math.random() * 1000),
    name: name,
    teacher: teacher,
    location: location,
    day: day,
    start: start,
    end: end,
    weeks: weeks,
    courseType: type,
    note: note
  };

  var conflict = conflictWith(course, state.editingId);
  if (conflict) {
    var cc = conflict.course;
    return showError(
      "⚠️ 课程冲突：第" + conflict.week + "周 " + DAY_NAMES[cc.day] + " 第" + cc.start + "-" + cc.end +
      "节已安排「" + cc.name + "」（" + formatWeeks(cc.weeks) + "）。请调整时间或周次后再保存。"
    );
  }

  if (state.editingId) {
    for (var i = 0; i < state.courses.length; i++) {
      if (state.courses[i].id === state.editingId) {
        state.courses[i] = course;
        break;
      }
    }
  } else {
    state.courses.push(course);
  }
  saveCourses();
  state.editingId = null;
  hideModal(modalOverlay);
  render();
}

/* ===== 周导航 ===== */
function updateWeekLabel() {
  weekLabel.textContent = "第" + state.currentWeek + "周";
}

function changeWeek(delta) {
  var w = state.currentWeek + delta;
  if (w < 1) w = 1;
  if (w > MAX_WEEK) w = MAX_WEEK;
  if (w === state.currentWeek) return;
  state.currentWeek = w;
  saveWeek();
  /* 标记：用户已主动切换过周次，此后刷新保留用户选择的当前查看周 */
  try {
    localStorage.setItem(WEEK_USER_SET_KEY, "1");
  } catch (e) {}
  render();
}

/* ===== 工具 ===== */
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ===== 初始化 ===== */
function updateModeButtons() {
  var btns = document.querySelectorAll(".mode-btn");
  for (var i = 0; i < btns.length; i++) {
    var on = btns[i].dataset.mode === state.timeMode;
    if (on) btns[i].classList.add("active");
    else btns[i].classList.remove("active");
  }
}

function init() {
  gridEl = document.getElementById("schedule-grid");
  semesterTitleEl = document.getElementById("semester-title");
  todayBtn = document.getElementById("today-btn");
  addBtn = document.getElementById("add-course-btn");
  modalOverlay = document.getElementById("course-modal");
  modalTitle = document.getElementById("modal-title");
  courseForm = document.getElementById("course-form");
  courseName = document.getElementById("course-name");
  courseTeacher = document.getElementById("course-teacher");
  courseLocation = document.getElementById("course-location");
  courseDay = document.getElementById("course-day");
  courseStart = document.getElementById("course-start");
  courseEnd = document.getElementById("course-end");
  courseType = document.getElementById("course-type");
  courseWeeks = document.getElementById("course-weeks");
  courseNote = document.getElementById("course-note");
  errorEl = document.getElementById("form-error");
  modalCancel = document.getElementById("modal-cancel");
  detailModal = document.getElementById("detail-modal");
  detailBody = document.getElementById("detail-body");
  detailDelete = document.getElementById("detail-delete");
  detailEdit = document.getElementById("detail-edit");
  detailClose = document.getElementById("detail-close");
  weekPrev = document.getElementById("week-prev");
  weekNext = document.getElementById("week-next");
  weekLabel = document.getElementById("week-label");
  countEl = document.getElementById("course-count");

  /* 学期 */
  var savedSemester = loadSemester();
  if (savedSemester) semesterTitleEl.textContent = savedSemester;
  semesterTitleEl.addEventListener("click", function () {
    var input = document.createElement("input");
    input.className = "semester-input";
    input.type = "text";
    input.value = semesterTitleEl.textContent;
    semesterTitleEl.replaceWith(input);
    input.focus();
    input.select();
    function commit() {
      var text = input.value.trim() || semesterTitleEl.textContent;
      semesterTitleEl.textContent = text;
      saveSemester(text);
      input.replaceWith(semesterTitleEl);
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") commit();
      if (ev.key === "Escape") input.replaceWith(semesterTitleEl);
    });
  });

  /* 表单初始化 */
  fillDaySelect();
  fillPeriodSelects(1, 1);

  /* 事件绑定 */
  addBtn.addEventListener("click", function () {
    openCourseModal(null);
  });
  modalCancel.addEventListener("click", function () {
    hideModal(modalOverlay);
  });
  courseForm.addEventListener("submit", handleSubmit);
  courseStart.addEventListener("change", function () {
    updateEndSelect(null);
  });
  todayBtn.addEventListener("click", function () {
    /* 点击"今天"：切回真实教学周，并定位到今日列 */
    var targetWeek = weekOfToday();
    if (targetWeek < 1) targetWeek = 1;
    if (targetWeek > MAX_WEEK) targetWeek = MAX_WEEK;
    if (state.currentWeek !== targetWeek) {
      state.currentWeek = targetWeek;
      saveWeek();
      try {
        localStorage.setItem(WEEK_USER_SET_KEY, "1");
      } catch (e) {}
      render();
    }
    var heads = gridEl.querySelectorAll(".grid-head.day-head");
    var el = heads[todayIndex()];
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    el.classList.add("today-pulse");
    setTimeout(function () {
      el.classList.remove("today-pulse");
    }, 700);
  });
  weekPrev.addEventListener("click", function () {
    changeWeek(-1);
  });
  weekNext.addEventListener("click", function () {
    changeWeek(1);
  });
  document.getElementById("time-mode-switch").addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".mode-btn") : null;
    if (!btn) return;
    var mode = btn.dataset.mode;
    if (!mode || mode === state.timeMode) return;
    var prevStart = parseInt(courseStart.value, 10);
    var prevEnd = parseInt(courseEnd.value, 10);
    state.timeMode = mode;
    saveTimeMode();
    fillPeriodSelects(prevStart, prevEnd);
    updateModeButtons();
    render();
  });
  detailDelete.addEventListener("click", function () {
    var id = detailDelete.dataset.id;
    var target = null;
    for (var i = 0; i < state.courses.length; i++) {
      if (state.courses[i].id === id) {
        target = state.courses[i];
        break;
      }
    }
    if (!target) return;
    if (!confirm("确定要删除课程「" + target.name + "」吗？")) return;
    state.courses = state.courses.filter(function (c) {
      return c.id !== id;
    });
    saveCourses();
    hideModal(detailModal);
    render();
  });
  detailEdit.addEventListener("click", function () {
    var id = detailEdit.dataset.id;
    var target = null;
    for (var i = 0; i < state.courses.length; i++) {
      if (state.courses[i].id === id) {
        target = state.courses[i];
        break;
      }
    }
    if (!target) return;
    hideModal(detailModal);
    openCourseModal(target);
  });
  detailClose.addEventListener("click", function () {
    hideModal(detailModal);
  });
  modalOverlay.addEventListener("click", function (e) {
    if (e.target === modalOverlay) hideModal(modalOverlay);
  });
  detailModal.addEventListener("click", function (e) {
    if (e.target === detailModal) hideModal(detailModal);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      hideModal(modalOverlay);
      hideModal(detailModal);
    }
  });
  if (typeof window !== "undefined") {
    window.addEventListener("resize", function () {
      applyGridRows();
    });
  }

  updateModeButtons();
  updateWeekLabel();
  render();

  /* 主页面导入了课表、或在别处改了设置：重新读一遍 */
  window.addEventListener("storage", function (e) {
    var k = e && e.key;
    if (k !== COURSES_KEY && k !== TIME_MODE_KEY && k !== CUSTOM_TIMES_KEY && k !== WEEK1_KEY && k !== ADJ_KEY) return;
    var ct = loadCustomTimes();
    if (ct) TIME_MODES.custom = { label: "截图时间", periods: ct }; else delete TIME_MODES.custom;
    state.courses = loadCourses();
    state.timeMode = loadTimeMode() || defaultTimeMode();
    if (localStorage.getItem(WEEK_USER_SET_KEY) !== "1") state.currentWeek = loadWeek();
    showCustomMode();
    fillPeriodSelects(1, 1);
    updateModeButtons();
    updateWeekLabel();
    render();
  });
  showCustomMode();
}

function showCustomMode() {
  var b = document.getElementById("mode-custom");
  if (b) b.classList.toggle("hidden", !TIME_MODES.custom);
}

init();

</script>
