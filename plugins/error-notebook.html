<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>错题记录本</title>
<style>/* CAMPUS_TOOL_STYLES */
.bookshelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 20px;padding:6px 8px 25px}.book{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:var(--text,#25334b)}.book-cover{position:relative;display:flex;flex-direction:column;min-height:216px;padding:23px 21px 18px 30px;background:var(--book,#c7d8fa);color:#26384a;border-radius:5px 17px 17px 5px;box-shadow:4px 6px 0 var(--card,#fff),5px 7px 0 var(--line,#e3e8ef),0 13px 25px -15px #16283e65;isolation:isolate;transition:transform .18s}.book-cover:before{content:"";position:absolute;left:9px;top:0;bottom:0;width:4px;border-left:1px solid #ffffff70;border-right:1px solid #243c5217;background:#26384a0e}.book-cover:after{content:"";position:absolute;top:20px;right:18px;width:13px;height:31px;background:#ffffff77;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}.book:hover .book-cover{transform:translateY(-5px)}.book-subject{font-size:11px;letter-spacing:.14em;color:#364e67}.book-title{font-size:23px;font-weight:750;line-height:1.5;margin-top:25px;overflow-wrap:anywhere;max-width:95%}.book-lines{width:28px;height:4px;border-top:1px solid #26384a44;border-bottom:1px solid #26384a44;margin:14px 0}.book-count{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px}.book-footer{padding:17px 1px 7px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--sub,#67748b)}.book-footer b{color:var(--text,#25334b);font-weight:650}.book-progress{width:38px;height:4px;border-radius:8px;background:var(--line,#e3e8ef);overflow:hidden}.book-progress i{display:block;height:100%;background:var(--accent,#3455b8)}.shelf-note{padding:15px 20px;margin:5px 0 22px;border-radius:13px;background:var(--muted-bg,#f6f8fc);color:var(--sub,#67748b);font-size:12px}.book-detail-header{display:flex;gap:16px;align-items:center}.mini-cover{width:65px;height:84px;border-radius:4px 11px 11px 4px;background:var(--book,#c7d8fa);border-left:5px solid #243c5217;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#26384a;font-size:24px}.question-card{padding:21px;margin-bottom:14px;border:1px solid var(--line,#e3e8ef);border-radius:19px;background:var(--card,#fff)}.question-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.question-head time{font-size:11px;color:var(--sub,#67748b)}.question-title{font-size:16px;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.question-card .actions{margin-top:17px;padding-top:13px;border-top:1px solid var(--line,#e3e8ef)}.question-card.mastered .badge{color:var(--green,#267661);border-color:var(--green,#267661)}.image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}.image-thumb{display:block;min-width:0;position:relative;border:1px solid var(--line,#e3e8ef);border-radius:12px;overflow:hidden;padding:0;background:var(--muted-bg,#f6f8fc);color:var(--text,#25334b)}.image-thumb img{display:block;width:100%;height:145px;object-fit:contain;background:#fff}.image-thumb span{display:block;padding:6px 8px;text-align:left;font-size:11px;color:var(--sub,#67748b);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.photo-draft .image-thumb img{height:125px}.photo-remove{display:block;width:100%;padding:8px;background:var(--card,#fff);border:0;border-top:1px solid var(--line,#e3e8ef);color:var(--red,#b33d52);font-size:12px}.colour-choices{display:flex;gap:10px;flex-wrap:wrap}.colour-pick{position:relative;cursor:pointer}.colour-pick input{position:absolute;opacity:0}.colour-pick span{display:block;width:44px;height:44px;border-radius:12px;border:3px solid transparent;background:var(--book)}.colour-pick input:checked+span{border-color:var(--accent,#3455b8);box-shadow:0 0 0 3px var(--card,#fff) inset}.colour-pick input:focus-visible+span{outline:3px solid var(--accent,#3455b8);outline-offset:3px}.image-full{display:block;max-width:100%;height:auto;margin:20px auto;background:white;border-radius:14px}.restore-action{position:relative}.restore-action input{position:absolute;width:1px;height:1px;opacity:0}.shelf-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}@media(max-width:700px){.bookshelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 15px;padding-inline:3px}.book-cover{min-height:196px;padding:20px 14px 15px 25px}.book-title{font-size:20px;margin-top:24px}.book-footer{font-size:11px;gap:5px}.question-card{padding:17px}.image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.image-thumb img{height:130px}}
</style></head><body><main class="tool-page">
<section id="shelfPage">
 <header class="page-intro"><div><div class="eyebrow">把每一次弄懂，收进书里</div><h1>我的错题书架</h1><p>每个学科一本，文字与题目照片一起保存。找到错因，再把它变成会做的题。</p></div><div class="actions"><button type="button" class="btn" id="backupAll">备份书架</button><button type="button" class="btn primary" id="createBook">＋ 新建本子</button></div></header>
 <div class="stat-row"><div class="stat"><strong id="bookCount">0</strong><span>学科本子</span></div><div class="stat"><strong id="questionCount">0</strong><span>收录错题</span></div><div class="stat"><strong id="reviewCount">0</strong><span>等待复习</span></div></div>
 <p id="shelfStatus" class="status" role="status"></p><div class="shelf-section-head"><h2>按学科收好</h2><label id="restoreAction" class="btn small restore-action" tabindex="0" role="button">恢复错题备份<input id="restoreFile" type="file" accept=".json,application/json" aria-label="恢复错题备份"></label></div><div id="bookshelf" class="bookshelf"></div><p class="shelf-note">旧版错题会出现在“未分类”里。打开题目，点“编辑”，就能放进对应的学科本。图片与记录保存在本机，可用“备份书架”一起导出。</p>
</section>
<section id="bookPage" hidden>
 <div class="back-row"><button type="button" class="btn" id="backShelf">‹ 返回书架</button><span class="badge" id="bookSubject"></span></div><header class="page-intro"><div class="book-detail-header"><div class="mini-cover" id="miniCover">✎</div><div><h1 id="bookTitle"></h1><p id="bookDescription"></p></div></div><div class="actions"><button type="button" class="btn" id="bookSettings">整理本子</button><button type="button" class="btn" id="backupBook">导出本子</button><button type="button" class="btn primary" id="addQuestion">＋ 收录错题</button></div></header>
 <input id="questionSearch" class="search" type="search" placeholder="搜索题干、答案或错因" aria-label="搜索本子里的错题"><div class="filters" id="reviewFilters"><button class="btn small" data-filter="all" aria-pressed="true">全部</button><button class="btn small" data-filter="pending" aria-pressed="false">待复习</button><button class="btn small" data-filter="mastered" aria-pressed="false">已掌握</button></div><p id="bookStatus" class="status" role="status"></p><div id="questionList"></div><div id="questionPager" class="pager"></div>
</section>
<section id="editorPage" hidden>
 <div class="back-row"><button type="button" class="btn" id="cancelQuestion">‹ 返回本子</button><span class="badge">文字 / 图片都可以</span></div><header class="page-intro"><div><h1 id="editorTitle">收录一道错题</h1><p>题干可以打字，也可以直接添加图片。保存后仍可补充答案和解析。</p></div></header>
 <form id="questionForm" class="panel"><div class="form-grid"><label class="field wide"><span>放入哪一本</span><select id="questionBook" aria-label="错题所属本子"></select></label><label class="field wide"><span>题干</span><textarea id="question" maxlength="10000" placeholder="输入题目；如果添加了图片，可以留空"></textarea></label><div class="wide"><label class="drop-zone"><b>＋ 添加题目图片</b><small>JPG / PNG / WebP / GIF，最多 6 张；每张不超过 12 MB，保存时自动压缩</small><input id="questionImages" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple aria-label="添加错题图片"></label><div id="photoDraft" class="image-grid photo-draft"></div><p id="photoStatus" class="status" role="status"></p></div><label class="field"><span>正确答案 <small>选填</small></span><textarea id="answer" maxlength="10000" placeholder="正确答案与解题结论"></textarea></label><label class="field"><span>错误原因 <small>选填</small></span><textarea id="reason" maxlength="10000" placeholder="概念不清、计算粗心，还是审题失误？"></textarea></label><label class="field wide"><span>解析与复习笔记 <small>选填</small></span><textarea id="analysis" maxlength="10000" placeholder="把关键步骤和自己的理解写在这里"></textarea></label><label class="check wide"><input type="checkbox" id="questionMastered">这道题已经掌握了</label></div><p id="editorStatus" class="status" role="status" aria-live="polite"></p><div class="form-foot"><span class="muted">记录和图片一起保存</span><button type="button" class="btn" id="cancelQuestionBottom">取消</button><button type="submit" class="btn primary" id="saveQuestion">保存错题</button></div></form>
</section>
<section id="bookEditorPage" hidden>
 <div class="back-row"><button type="button" class="btn" id="cancelBook">‹ 返回</button></div><header class="page-intro"><div><h1 id="bookEditorTitle">新建一本错题本</h1><p>学科可以自定义。高等数学、专业英语，或你正在学的任何一门课。</p></div></header><form class="panel" id="bookForm"><label class="field"><span>学科</span><input id="newSubject" maxlength="24" list="subjectSuggestions" required placeholder="例如：数学、高等数学"><datalist id="subjectSuggestions"><option value="语文"><option value="数学"><option value="英语"><option value="物理"><option value="化学"><option value="生物"><option value="高等数学"><option value="专业课"></datalist></label><label class="field"><span>本子名称</span><input id="newBookName" maxlength="32" placeholder="留空会使用“学科＋错题本”"></label><div class="field"><span>封面颜色</span><div id="bookColours" class="colour-choices"></div></div><p id="bookEditorStatus" class="status" role="status"></p><div class="form-foot"><button type="button" class="btn danger" id="removeBook" hidden>移走这个本子</button><button class="btn primary" type="submit" id="saveBook">保存本子</button></div></form>
</section>
<section id="imagePage" hidden><div class="back-row"><button class="btn" type="button" id="closeImage">‹ 返回题目</button><span class="muted" id="imageCaption"></span></div><img class="image-full" id="fullImage" alt="错题图片原图"></section>
</main><script>
(function(){'use strict';
const KEY='personal_error-notebook_list',BOOKS='personal_error-notebook_books_v2',PHOTO='personal_error-notebook_image:',UNFILED='unfiled',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colours=[['sky','晴空蓝','#c9d9f8'],['forest','森野绿','#c9dfd4'],['rose','樱花粉','#edcfdc'],['apricot','暖杏橙','#edd7be'],['lavender','鸢尾紫','#dcd3ed'],['ocean','海盐青','#c4dde1']];
const seed=['语文','数学','英语','物理','化学','生物'].map((subject,i)=>({id:'subject-'+i,name:subject+'错题本',subject,color:colours[i][0]}));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+crypto.getRandomValues(new Uint32Array(2)).join('-');
function raw(key,fallback){const v=localStorage.getItem(key);if(v==null)return fallback;try{return JSON.parse(v);}catch(e){throw new Error('本机错题数据无法读取，请先检查备份。');}}
function books(){const saved=raw(BOOKS,null);if(saved!=null&&!Array.isArray(saved))throw new Error('错题书架数据格式异常。');const out=(saved||seed).filter(x=>x&&x.id&&x.name&&x.id!==UNFILED).map(x=>({...x}));const list=raw(KEY,[]);if(!Array.isArray(list))throw new Error('错题列表数据格式异常。');for(const note of list){if(note?.subject&&!note.bookId&&!out.some(b=>b.subject===note.subject)){const subject=String(note.subject);out.push({id:'legacy-'+encodeURIComponent(subject),name:subject+'错题本',subject,color:'sky'});}}out.push({id:UNFILED,name:'未分类',subject:'待整理',color:'apricot'});return out;}
function notes(){const list=raw(KEY,[]),all=books();return list.filter(x=>x&&typeof x==='object').map((x,i)=>{const b=all.find(b=>b.id===x.bookId)||(!x.bookId&&all.find(b=>b.subject===x.subject))||all.find(b=>b.id===UNFILED);return {...x,id:x.id??'legacy-'+i,bookId:b.id,subject:b.id===UNFILED?'':b.subject,images:Array.isArray(x.images)?x.images.filter(p=>p&&typeof p.id==='string'):[]};});}
function color(book){return (colours.find(x=>x[0]===book.color)||colours[0])[2];}
const validImage=s=>typeof s==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
function imageData(p){const data=p.data||localStorage.getItem(PHOTO+p.id);return validImage(data)?data:'';}
let bookId=null,filter='all',page=0,editing=null,editingBook=null,photos=[],busy=false,photoBusy=false,imageReturn='bookPage';
function status(id,text,error=false){$(id).textContent=text;$(id).classList.toggle('error',error);}
function show(id){for(const s of document.querySelectorAll('main>section'))s.hidden=s.id!==id;window.CampusPlugin?.reveal();}
async function write(entries){if(window.CampusPlugin)return CampusPlugin.write(entries);const old=entries.map(([k])=>[k,localStorage.getItem(k)]);try{for(const [k,v]of entries)v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){for(const [k,v]of old)v==null?localStorage.removeItem(k):localStorage.setItem(k,v);throw e;}}
function bookEntries(all){return [BOOKS,JSON.stringify(all.filter(b=>b.id!==UNFILED))];}
async function saveNotes(items,extra=[]){await write([[KEY,JSON.stringify(items)],bookEntries(books()),...extra]);}
async function run(fn,target){if(busy)return;busy=true;try{await fn();}catch(e){status(target,e.message,true);}finally{busy=false;}}
function renderShelf(){const all=books(),items=notes(),visible=all.filter(b=>b.id!==UNFILED||items.some(x=>x.bookId===UNFILED));$('bookCount').textContent=visible.length;$('questionCount').textContent=items.length;$('reviewCount').textContent=items.filter(x=>!x.mastered).length;$('bookshelf').innerHTML=visible.map(b=>{const contained=items.filter(x=>x.bookId===b.id),mastered=contained.filter(x=>x.mastered).length;return `<button class="book" type="button" data-book="${esc(b.id)}" aria-label="打开${esc(b.name)}，${contained.length} 道错题"><span class="book-cover" style="--book:${color(b)}"><span class="book-subject">${esc(b.subject)}</span><span class="book-title">${esc(b.name)}</span><span class="book-lines" aria-hidden="true"></span><span class="book-count"><span>${contained.length} 道错题</span><span aria-hidden="true">↗</span></span></span><span class="book-footer"><b>${contained.length-mastered} 道待复习</b><span class="book-progress" aria-label="已掌握 ${mastered} 道"><i style="width:${contained.length?mastered/contained.length*100:0}%"></i></span></span></button>`;}).join('');}
function renderBook(){const b=books().find(x=>x.id===bookId);if(!b){show('shelfPage');renderShelf();return;}$('bookTitle').textContent=b.name;$('bookSubject').textContent=b.subject;$('miniCover').style.setProperty('--book',color(b));$('bookSettings').hidden=bookId===UNFILED;const all=notes().filter(x=>x.bookId===bookId);$('bookDescription').textContent=`收录 ${all.length} 道 · 已掌握 ${all.filter(x=>x.mastered).length} 道`;const query=$('questionSearch').value.trim().toLowerCase(),list=all.filter(x=>(filter==='all'||filter==='mastered'&&x.mastered||filter==='pending'&&!x.mastered)&&[x.question,x.answer,x.reason,x.analysis].join(' ').toLowerCase().includes(query)).reverse();const pages=Math.max(1,Math.ceil(list.length/12));page=Math.min(page,pages-1);$('questionList').innerHTML=list.slice(page*12,page*12+12).map((x,i)=>{const images=x.images.map(p=>{const data=imageData(p);return data?`<button class="image-thumb" type="button" data-image="${esc(p.id)}" data-note="${esc(x.id)}" aria-label="查看错题图片"><img src="${data}" alt="${esc(p.name||'题目图片')}" loading="lazy"><span>${esc(p.name||'题目图片')} · 点开查看</span></button>`:'';}).join('');return `<article class="question-card${x.mastered?' mastered':''}"><div class="question-head"><span class="badge">${x.mastered?'已掌握':'待复习'}</span><time>${esc(x.createTime||'')}</time></div><div class="question-title">${esc(x.question||'图片错题')}</div>${images?`<div class="image-grid">${images}</div>`:''}${[['答案',x.answer],['错误原因',x.reason],['解析与笔记',x.analysis]].filter(([k,v])=>v).map(([k,v])=>`<span class="text-label">${k}</span><p class="note-text">${esc(v)}</p>`).join('')}<div class="actions"><button class="btn small" type="button" data-master="${esc(x.id)}">${x.mastered?'改为待复习':'标记已掌握'}</button><button class="btn small" type="button" data-edit="${esc(x.id)}">编辑 / 移动</button><button class="btn small danger" type="button" data-delete="${esc(x.id)}">删除</button></div></article>`;}).join('')||`<div class="panel empty"><b>${all.length?'没有匹配的错题':'这本还等着第一道题'}</b>${all.length?'试试其他关键词或复习分类。':'点“收录错题”，题目照片也能直接放进来。'}</div>`;$('questionPager').innerHTML=pages>1?`<button class="btn small" data-page="-1" ${page===0?'disabled':''}>上一页</button><span>${page+1} / ${pages}</span><button class="btn small" data-page="1" ${page===pages-1?'disabled':''}>下一页</button>`:'';for(const b of $('reviewFilters').querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.filter===filter));}
function openBook(id){bookId=id;filter='all';page=0;$('questionSearch').value='';status('bookStatus','');renderBook();show('bookPage');}
$('bookshelf').onclick=e=>{const b=e.target.closest('[data-book]');if(b)openBook(b.dataset.book);};$('backShelf').onclick=()=>{renderShelf();show('shelfPage');};$('questionSearch').oninput=()=>{page=0;renderBook();};$('reviewFilters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;page=0;renderBook();}};$('questionPager').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page+=Number(b.dataset.page);renderBook();window.CampusPlugin?.reveal();}};
function renderPhotos(){$('photoDraft').innerHTML=photos.map(p=>`<div class="image-thumb"><img src="${imageData(p)}" alt="${esc(p.name||'题目图片')}"><span>${esc(p.name||'题目图片')}</span><button type="button" class="photo-remove" data-remove-photo="${esc(p.id)}">移除图片</button></div>`).join('');}
function editQuestion(id){const x=id==null?null:notes().find(x=>String(x.id)===String(id));editing=x?.id??null;$('editorTitle').textContent=x?'编辑这道错题':'收录一道错题';$('questionBook').innerHTML=books().map(b=>`<option value="${esc(b.id)}">${esc(b.name)} · ${esc(b.subject)}</option>`).join('');$('questionBook').value=x?.bookId||bookId||books()[0].id;for(const key of ['question','answer','reason','analysis'])$(key).value=x?.[key]||'';$('questionMastered').checked=!!x?.mastered;photos=(x?.images||[]).map(p=>({...p}));$('question').removeAttribute('aria-invalid');status('editorStatus','');status('photoStatus','');renderPhotos();show('editorPage');}
$('addQuestion').onclick=()=>editQuestion(null);function cancelQuestion(){if(busy||photoBusy)return;renderBook();show('bookPage');}$('cancelQuestion').onclick=cancelQuestion;$('cancelQuestionBottom').onclick=cancelQuestion;
function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error('图片读取失败，请重新选择。'));r.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('图片格式无法读取，请使用 JPG、PNG 或 WebP。'));img.onload=()=>{if(img.naturalWidth*img.naturalHeight>64000000){reject(new Error('图片像素过大，请先缩小到 6400 万像素以内。'));return;}try{let scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');let data='';for(const quality of [.88,.76,.64]){canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/jpeg',quality);if(data.length<500000)break;scale*=.8;}if(data.length>=500000)throw new Error('图片内容过大，请裁剪题目后再添加。');resolve({id:uid(),name:file.name.slice(0,100),data,width:canvas.width,height:canvas.height});}catch(e){reject(e);}};img.src=r.result;};r.readAsDataURL(file);});}
$('questionImages').onchange=async()=>{const files=Array.from($('questionImages').files);$('questionImages').value='';if(!files.length||photoBusy||busy)return;if(photos.length+files.length>6){status('photoStatus','一题最多 6 张图片，请减少本次选择。',true);return;}photoBusy=true;$('saveQuestion').disabled=true;status('photoStatus','正在整理图片…');try{const added=[];for(const file of files){if(!/^image\/(jpeg|png|webp|gif|bmp)$/i.test(file.type))throw new Error('请选择 JPG、PNG、WebP 或 GIF；HEIC 请先转为 JPG。');if(file.size>12000000)throw new Error('每张图片需要小于 12 MB，请先缩小图片。');added.push(await readImage(file));}photos.push(...added);renderPhotos();status('photoStatus',`已准备 ${photos.length} 张图片，保存错题后会一起留在本机。`);}catch(e){status('photoStatus',e.message,true);}finally{photoBusy=false;$('saveQuestion').disabled=false;}};
$('photoDraft').onclick=e=>{const b=e.target.closest('[data-remove-photo]');if(b&&!busy&&!photoBusy){photos=photos.filter(p=>p.id!==b.dataset.removePhoto);renderPhotos();}};
$('questionForm').onsubmit=e=>{e.preventDefault();if(photoBusy)return;run(async()=>{const question=$('question').value.trim();if(!question&&!photos.length){$('question').setAttribute('aria-invalid','true');throw new Error('填写题干或添加至少一张题目图片。');}const all=notes();if(editing==null&&all.length>=5000)throw new Error('错题最多保存 5000 道，请先导出部分本子。');const book=books().find(b=>b.id===$('questionBook').value);if(!book)throw new Error('请选择一本现有错题本。');const old=all.find(x=>String(x.id)===String(editing)),extra=[];for(const p of photos)if(p.data){if(!validImage(p.data))throw new Error('图片内容无效，请重新添加。');extra.push([PHOTO+p.id,p.data]);}for(const p of old?.images||[])if(!photos.some(x=>x.id===p.id))extra.push([PHOTO+p.id,null]);const item={...(old||{}),id:old?.id??uid(),question,answer:$('answer').value.trim(),reason:$('reason').value.trim(),analysis:$('analysis').value.trim(),bookId:book.id,subject:book.id===UNFILED?'':book.subject,mastered:$('questionMastered').checked,images:photos.map(({data,...p})=>p),createTime:old?.createTime||new Date().toLocaleString('zh-CN'),updatedAt:new Date().toISOString()};const i=all.findIndex(x=>String(x.id)===String(editing));if(i>=0)all[i]=item;else all.push(item);$('saveQuestion').disabled=true;try{await saveNotes(all,extra);}finally{$('saveQuestion').disabled=false;}bookId=book.id;page=0;renderBook();show('bookPage');status('bookStatus','错题和图片已保存。');},'editorStatus');};
$('questionList').onclick=e=>{const b=e.target.closest('[data-master],[data-edit],[data-delete],[data-image]');if(!b)return;if(b.dataset.edit)return editQuestion(b.dataset.edit);if(b.dataset.image){const item=notes().find(x=>String(x.id)===b.dataset.note),p=item?.images.find(p=>p.id===b.dataset.image);if(p){$('fullImage').src=imageData(p);$('imageCaption').textContent=p.name||'题目图片';imageReturn='bookPage';show('imagePage');}return;}run(async()=>{const all=notes(),id=b.dataset.master||b.dataset.delete,x=all.find(x=>String(x.id)===id);if(!x)return;if(b.dataset.master){x.mastered=!x.mastered;await saveNotes(all);}else{if(!confirm('删除这道错题和它的图片？'))return;await saveNotes(all.filter(x=>String(x.id)!==id),x.images.map(p=>[PHOTO+p.id,null]));}renderBook();},'bookStatus');};$('closeImage').onclick=()=>show(imageReturn);
function editBook(id){editingBook=id||null;const b=books().find(x=>x.id===id);$('bookEditorTitle').textContent=b?'整理这本错题本':'新建一本错题本';$('newSubject').value=b?.subject||'';$('newBookName').value=b?.name||'';$('bookColours').innerHTML=colours.map(([id,name,value])=>`<label class="colour-pick" style="--book:${value}" title="${name}"><input type="radio" name="bookColour" value="${id}" ${(b?.color||'sky')===id?'checked':''} aria-label="${name}封面"><span></span></label>`).join('');$('removeBook').hidden=!b;status('bookEditorStatus','');show('bookEditorPage');}
$('createBook').onclick=()=>editBook(null);$('bookSettings').onclick=()=>editBook(bookId);$('cancelBook').onclick=()=>{if(busy)return;if(editingBook){renderBook();show('bookPage');}else{renderShelf();show('shelfPage');}};
$('bookForm').onsubmit=e=>{e.preventDefault();run(async()=>{const all=books(),subject=$('newSubject').value.trim(),name=$('newBookName').value.trim()||subject+'错题本';if(!subject)throw new Error('先填写一个学科名称。');if(all.some(b=>b.id!==editingBook&&b.name===name))throw new Error('这本名称已经存在，换个名称更好分辨。');if(!editingBook&&all.length>=101)throw new Error('最多保存 100 本，请先整理书架。');const b={id:editingBook||uid(),subject,name,color:document.querySelector('input[name="bookColour"]:checked')?.value||'sky'},items=notes().map(x=>x.bookId===b.id?{...x,subject}:x),i=all.findIndex(x=>x.id===b.id);if(i>=0)all[i]=b;else all.push(b);await write([bookEntries(all),[KEY,JSON.stringify(items)]]);bookId=b.id;renderShelf();openBook(b.id);},'bookEditorStatus');};
$('removeBook').onclick=()=>run(async()=>{if(!editingBook)return;const all=books(),b=all.find(x=>x.id===editingBook),items=notes(),contained=items.filter(x=>x.bookId===editingBook);if(!confirm(`移走“${b.name}”？${contained.length?'其中 '+contained.length+' 道错题会转入“未分类”，图片保留。':'这是一本空本子。'}`))return;await write([bookEntries(all.filter(x=>x.id!==editingBook)),[KEY,JSON.stringify(items.map(x=>x.bookId===editingBook?{...x,bookId:UNFILED,subject:''}:x))]]);bookId=null;renderShelf();show('shelfPage');status('shelfStatus','本子已移走，原有错题保留在未分类。');},'bookEditorStatus');
function backup(onlyBook){const all=books(),items=notes().filter(x=>!onlyBook||x.bookId===onlyBook),data={version:2,kind:'campus-error-books',books:all.filter(b=>!onlyBook||b.id===onlyBook),items,images:{},exportedAt:new Date().toISOString()};for(const x of items)for(const p of x.images){const image=imageData(p);if(image)data.images[p.id]=image;}const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(onlyBook?all.find(b=>b.id===onlyBook)?.name:'错题书架')+'-备份.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
$('backupAll').onclick=()=>backup(null);$('backupBook').onclick=()=>backup(bookId);
$('restoreAction').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('restoreFile').click();}};
$('restoreFile').onchange=()=>{const file=$('restoreFile').files[0];$('restoreFile').value='';if(!file)return;run(async()=>{if(file.size>30000000)throw new Error('备份超过 30 MB，请分本子导出后恢复。');const obj=JSON.parse(await file.text()),imported=Array.isArray(obj)?obj:obj.items;if(!Array.isArray(imported)||imported.length>5000)throw new Error('请选择有效的错题书架备份。');if(!confirm(`追加恢复 ${imported.length} 道错题？现有记录会保留。`))return;const all=books(),current=notes();if(current.length+imported.length>5000)throw new Error('恢复后超过 5000 道，请分批整理。');const mapping=new Map(),newImages=[],added=[];for(const source of Array.isArray(obj.books)?obj.books:[]){if(!source?.id||typeof source.name!=='string'||typeof source.subject!=='string')throw new Error('备份中的本子格式不对。');if(source.id===UNFILED){mapping.set(source.id,UNFILED);continue;}let b=all.find(b=>b.name===source.name&&b.subject===source.subject);if(!b){b={id:uid(),name:source.name.slice(0,32),subject:source.subject.slice(0,24),color:colours.some(c=>c[0]===source.color)?source.color:'sky'};all.push(b);}mapping.set(source.id,b.id);}if(all.length>101)throw new Error('恢复后本子超过 100 本，请分批导入。');for(const x of imported){if(!x||typeof x!=='object'||['question','answer','reason','analysis'].some(k=>x[k]!=null&&(typeof x[k]!=='string'||x[k].length>10000)))throw new Error('备份中的错题内容格式不对。');if(x.images!=null&&!Array.isArray(x.images))throw new Error('备份中的图片列表格式不对。');if(!(x.question||'').trim()&&!(x.images||[]).length)throw new Error('备份中有空白错题，请检查内容。');const images=[];if(Array.isArray(x.images)&&x.images.length>6)throw new Error('每道错题最多恢复 6 张图片。');for(const p of x.images||[]){const data=obj.images?.[p.id];if(!validImage(data)||data.length>500000)throw new Error('备份图片缺失或内容过大。');const photo={id:uid(),name:String(p.name||'题目图片').slice(0,100)};images.push(photo);newImages.push([PHOTO+photo.id,data]);}let target=mapping.get(x.bookId)||all.find(b=>b.subject===x.subject)?.id||UNFILED;added.push({id:uid(),question:x.question||'',answer:x.answer||'',reason:x.reason||'',analysis:x.analysis||'',bookId:target,subject:all.find(b=>b.id===target)?.subject||'',mastered:!!x.mastered,images,createTime:String(x.createTime||new Date().toLocaleString('zh-CN'))});}status('shelfStatus','正在恢复错题和图片…');const written=[];try{for(let i=0;i<newImages.length;i+=20){const chunk=newImages.slice(i,i+20);await write(chunk);written.push(...chunk.map(x=>x[0]));}await write([bookEntries(all),[KEY,JSON.stringify(current.concat(added))]]);}catch(e){for(let i=0;i<written.length;i+=50)await write(written.slice(i,i+50).map(k=>[k,null])).catch(()=>{});throw e;}renderShelf();status('shelfStatus',`已追加恢复 ${added.length} 道错题，原有内容已保留。`);},'shelfStatus');};
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===BOOKS){renderShelf();if(!$('bookPage').hidden)renderBook();}});try{renderShelf();}catch(e){status('shelfStatus',e.message,true);}
})();
</script></body></html>
