<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的日记 · 每日记录</title>
<style>
  /* ============ 主题变量（亮色，跟随系统） ============ */
  :root{
    --bg:#f4f1ea;
    --paper:#fffdf9;
    --ink:#2f2a24;
    --ink-soft:#968e80;
    --accent:#c97b4a;
    --accent-soft:#f3e6da;
    --line:#eae4d6;
    --line-strong:#dcd3bf;
    --board:#fbf7ef;
    --ok:#7dae8a;
    --shadow-sm:0 3px 12px rgba(90,74,48,.08);
    --shadow-md:0 10px 30px rgba(90,74,48,.12);
    --radius-sm:12px;
    --radius:18px;
    --radius-lg:22px;
    --danger:#c94f42;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16140f;
      --paper:#1f1c16;
      --ink:#eae5da;
      --ink-soft:#9c9484;
      --accent:#e29a67;
      --accent-soft:#3a2c20;
      --line:#2d2921;
      --line-strong:#3a342a;
      --board:#262219;
      --ok:#7fb892;
      --shadow-sm:0 3px 12px rgba(0,0,0,.35);
      --shadow-md:0 10px 30px rgba(0,0,0,.45);
      --danger:#e08a7a;
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scrollbar-gutter:stable}
  body{
    margin:0;padding:0;overflow-x:hidden;
    background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    min-height:100vh;min-height:100dvh;transition:background .25s ease,color .25s ease;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px calc(48px + env(safe-area-inset-bottom))}

  /* ============ 头部 ============ */
  header{text-align:center;margin-bottom:20px}
  .kicker{letter-spacing:.28em;color:var(--accent);font-size:11px;margin:0 0 8px;font-weight:600;opacity:.85}
  h1{font-size:26px;margin:0;font-weight:700;letter-spacing:.04em}
  .clock{font-size:12.5px;color:var(--ink-soft);margin-top:7px;font-variant-numeric:tabular-nums}

  /* ============ 日期卡片 ============ */
  .date-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;margin-bottom:16px}
  .d-top{display:flex;align-items:stretch;gap:8px}
  .arrow{width:44px;flex:0 0 44px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--board);color:var(--ink);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,background .12s ease}
  .arrow:hover{background:var(--accent-soft)}
  .arrow:active{transform:scale(.94)}
  .arrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .d-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-width:0;padding:4px 2px}
  .d-date{font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1.2;text-align:center}
  .d-meta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-width:0}
  .d-week{font-size:13px;color:var(--ink-soft);font-weight:500}
  .weather{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:600;white-space:nowrap;transition:transform .12s ease,filter .12s ease}
  .weather:hover{filter:brightness(1.03)}
  .weather:active{transform:scale(.95)}
  .weather:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .weather .whint{opacity:.7;font-size:10px}
  .d-actions{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);border-radius:999px;background:var(--board);color:var(--ink);padding:9px 18px;font-size:13.5px;cursor:pointer;font-weight:600;font-family:inherit;transition:transform .12s ease,background .12s ease,border-color .12s ease}
  .btn:hover{border-color:var(--line-strong)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  input[type=date]{border:1px solid var(--line);border-radius:999px;background:var(--board);color:var(--ink);padding:8px 14px;font-size:13.5px;font-family:inherit}
  input[type=date]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ============ 自定义日历（替代原生 date picker，支持心情背景） ============
     原生 <input type="date"> 弹出的日历由浏览器内核绘制，无法注入内容，
     故自建日历弹层；原生 input 保留在页面上（位置/value 不变），
     上面盖一层透明按钮接管点击，原生日历不会再弹出。 */
  .date-pick-wrap{position:relative;display:inline-flex}
  .date-trigger{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;border-radius:999px;padding:0;font-family:inherit}
  .date-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .cal-pop{
    position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
    width:274px;z-index:10001;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow-md);padding:9px 9px 7px;
    -webkit-user-select:none;user-select:none;
  }
  .cal-pop[hidden]{display:none}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:1px;margin-bottom:5px}
  .cal-nav{width:26px;height:26px;flex:0 0 26px;border:0;background:transparent;color:var(--ink-soft);font-size:15px;line-height:1;border-radius:8px;cursor:pointer;font-family:inherit;padding:0;transition:background .12s ease,color .12s ease}
  .cal-nav:hover{background:var(--accent-soft);color:var(--accent)}
  .cal-nav:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .cal-title{flex:1;text-align:center;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
  .cal-week span{text-align:center;font-size:10.5px;color:var(--ink-soft);font-weight:600;padding:1px 0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-day{
    position:relative;aspect-ratio:1/1;min-height:32px;border:0;background:transparent;border-radius:9px;
    cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;
    transition:background .12s ease,color .12s ease;
  }
  .cal-day:hover{background:var(--accent-soft)}
  .cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .cal-day .cal-num{position:relative;z-index:1;font-variant-numeric:tabular-nums;line-height:1}
  /* 心情图标作为背景：半透明，日期数字仍然清晰可读 */
  .cal-day .cal-mood{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:21px;line-height:1;opacity:.32;pointer-events:none;
  }
  .cal-day.out{color:var(--ink-soft);opacity:.4}
  .cal-day.is-today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
  .cal-day.is-sel{background:var(--accent);color:#fff;font-weight:700;box-shadow:none}
  .cal-day.is-sel:hover{background:var(--accent)}
  .cal-day.is-sel .cal-mood{opacity:.45}
  .cal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line)}
  .cal-hint{font-size:10.5px;color:var(--ink-soft);line-height:1.25}
  .cal-today{border:1px solid var(--line);background:var(--board);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:11.5px;font-family:inherit;cursor:pointer;font-weight:600;flex:0 0 auto;transition:border-color .12s ease}
  .cal-today:hover{border-color:var(--line-strong)}
  .cal-today:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ============ 心情 ============ */
  .mood-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:13px 14px 15px;margin-bottom:16px}
  .mood-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .mood-title{font-size:14px;font-weight:700;letter-spacing:.04em}
  .mood-sub{font-size:11.5px;color:var(--ink-soft)}
  .mood-list{display:flex;flex-wrap:wrap;gap:8px}
  .mood-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--board);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;line-height:1;transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}
  .mood-btn:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .mood-btn:active{transform:scale(.94)}
  .mood-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mood-btn .mood-emoji{font-size:16px}
  .mood-btn .mood-dot{font-size:11px;margin-right:-1px}
  .mood-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 3px 10px rgba(201,123,74,.18)}
  @media (prefers-color-scheme: dark){ .mood-btn.on{box-shadow:0 3px 10px rgba(0,0,0,.35)} }
  .mood-btn.pop{animation:moodpop .28s ease}
  @keyframes moodpop{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}

  /* ============ 日记纸 ============ */
  .journal{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .25s ease}
  .journal:focus-within{box-shadow:var(--shadow-md)}
  .journal-head{padding:14px 18px 9px;border-bottom:1px dashed var(--line)}
  .j-hint{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  /* 手帐纸：横线纸底 + 内描边 */
  .paper-wrap{position:relative;padding:12px 14px 18px}
  .paper{
    position:relative;min-height:440px;border-radius:14px;padding:6px 14px 22px;
    background-image:repeating-linear-gradient(transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px);
    background-position:0 6px;
    box-shadow:inset 0 0 0 1px var(--line),inset 0 16px 28px -26px rgba(90,74,48,.5);
    transition:box-shadow .25s ease;
  }
  @media (prefers-color-scheme: dark){
    .paper{background-image:repeating-linear-gradient(transparent 0,transparent 27px,rgba(226,154,103,.14) 27px,rgba(226,154,103,.14) 28px)}
  }
  .journal:focus-within .paper{box-shadow:inset 0 0 0 1px var(--line-strong),inset 0 16px 28px -24px rgba(90,74,48,.55)}

  /* 文字块 */
  .blk-text{min-height:28px;line-height:28px;font-size:16px;color:var(--ink);outline:none;white-space:pre-wrap;word-break:break-word;caret-color:var(--accent);border-radius:6px}
  .blk-text:focus{background:rgba(201,123,74,.06)}
  .blk-text.is-empty::before{content:attr(data-ph);color:var(--ink-soft);opacity:.75;pointer-events:none}

  /* 照片块（拍立得 + 胶带 + 轻微旋转） */
  .blk-img{
    position:absolute;background:#fff;padding:6px 6px 16px;border-radius:6px;
    box-shadow:0 8px 18px rgba(90,74,48,.22);
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
    transition:box-shadow .18s ease;
  }
  .blk-img img{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px;pointer-events:none;background:var(--board)}
  .blk-img.dragging{cursor:grabbing;box-shadow:0 18px 34px rgba(90,74,48,.34)}
  .blk-img.active{z-index:60}
  .blk-img .photo-tape{
    position:absolute;top:-11px;left:50%;width:58px;height:20px;margin-left:-29px;border-radius:2px;
    background:linear-gradient(180deg,rgba(232,206,158,.78),rgba(219,188,132,.6));
    box-shadow:0 1px 3px rgba(90,74,48,.18);transform:rotate(-3deg);
    border-left:2px dashed rgba(255,255,255,.55);border-right:2px dashed rgba(255,255,255,.55);
    pointer-events:none;
  }
  .blk-img .photo-del{
    position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;padding:0;
    background:rgba(201,79,66,.92);color:#fff;font-size:14px;line-height:20px;cursor:pointer;z-index:4;
    box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0;transition:opacity .15s ease,transform .12s ease;
  }
  .blk-img:hover .photo-del,.blk-img.active .photo-del{opacity:1}
  .blk-img .photo-del:active{transform:scale(.9)}
  .blk-img .handle{
    position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);
    opacity:0;transition:opacity .15s ease;touch-action:none;z-index:2;
  }
  .blk-img:hover .handle,.blk-img.active .handle{opacity:1}
  .handle.nw{left:-8px;top:-8px;cursor:nwse-resize}
  .handle.ne{right:-8px;top:-8px;cursor:nesw-resize}
  .handle.sw{left:-8px;bottom:-8px;cursor:nesw-resize}
  .handle.se{right:-8px;bottom:-8px;cursor:nwse-resize}
  .blk-img.lost img{background:repeating-linear-gradient(45deg,var(--board) 0 8px,var(--accent-soft) 8px 16px)}
  .blk-img.lost::after{content:"🖼️ 图片已丢失";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:11.5px;color:var(--ink-soft);pointer-events:none}
  @media (hover:none){
    .blk-img .handle{opacity:.95;width:18px;height:18px}
    .blk-img .photo-del{opacity:1}
  }

  /* 小贴纸 */
  .stickers{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:14px}
  .sticker{position:absolute;font-size:19px;opacity:.7}

  /* 手帐工具条 */
  .paper-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 18px 14px}
  .tool-btn{border:1px dashed var(--line-strong);background:var(--board);color:var(--accent);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .12s ease,background .12s ease}
  .tool-btn:hover{background:var(--accent-soft)}
  .tool-btn:active{transform:scale(.96)}
  .tool-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tool-hint{font-size:11.5px;color:var(--ink-soft)}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 18px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft)}
  .status{display:inline-flex;align-items:center;gap:6px;opacity:.85}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);opacity:0;transition:opacity .2s ease}
  .status.saved .dot{opacity:1}
  .status.saving .dot{background:var(--accent);opacity:1;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .word-count{font-variant-numeric:tabular-nums}

  /* ============ 历史 ============ */
  .recent{margin-top:26px}
  .recent h2{font-size:14px;margin:0 0 12px;color:var(--ink-soft);font-weight:600;letter-spacing:.05em}
  .hist-list{display:flex;flex-direction:column;gap:8px}
  .hist-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 15px;cursor:pointer;text-align:left;font-family:inherit;transition:transform .12s ease,background .12s ease,border-color .12s ease}
  .hist-item:hover{background:var(--board)}
  .hist-item:active{transform:scale(.985)}
  .hist-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hist-left{display:flex;align-items:baseline;gap:8px;min-width:0}
  .hist-date{font-size:14.5px;font-weight:600}
  .hist-week{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;white-space:nowrap}
  .hist-mood{font-size:14px;line-height:1}
  .hist-pics{font-size:11px;color:var(--ink-soft);background:var(--board);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
  .hist-meta{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
  .hist-empty{color:var(--ink-soft);font-size:13px;padding:6px 2px}

  footer{margin-top:28px;text-align:center;font-size:11.5px;color:var(--ink-soft);opacity:.9}
  footer .lock{display:inline-flex;align-items:center;gap:5px}
  footer .lock.muted{opacity:.85}

  /* ============ 城市选择弹窗 ============ */
  dialog{border:1px solid var(--line);border-radius:var(--radius);padding:0;box-shadow:var(--shadow-md);max-width:400px;width:calc(100% - 32px);color:var(--ink);background:var(--paper)}
  dialog::backdrop{background:rgba(20,16,8,.4);backdrop-filter:blur(2px)}
  .dg{background:var(--paper);padding:20px;border-radius:var(--radius)}
  .dg h3{margin:0 0 6px;font-size:16px}
  .dg .sub{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft)}
  .dg-row{display:flex;gap:8px;margin-bottom:14px}
  .dg-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--board);color:var(--ink);padding:9px 14px;font-size:14px;font-family:inherit;outline:none}
  .dg-row input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .dg-btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:0 18px;font-size:14px;cursor:pointer;font-weight:600}
  .dg-link{display:block;width:100%;text-align:center;border:1px dashed var(--line-strong);background:var(--board);color:var(--accent);border-radius:999px;padding:9px;font-size:13px;cursor:pointer;font-weight:600}
  .dg-close{display:block;width:100%;text-align:center;margin-top:10px;background:none;border:0;color:var(--ink-soft);font-size:12.5px;cursor:pointer;padding:7px}
  .dg-msg{font-size:12.5px;margin:0 0 12px;min-height:16px}
  .dg-msg.err{color:var(--danger)}
  .dg-msg.ok{color:var(--ok)}

  /* ============ TextCursor 动效（React Bits TextCursor 移植 · 全页面版） ============
     整页固定浮层，pointer-events:none 只做视觉叠加，不拦截任何点击/拖拽/滚动。
     坐标直接使用 e.clientX / e.clientY（视口坐标），因此滚动页面时笔迹依然跟随鼠标。 */
  .text-cursor-layer{
    position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
    pointer-events:none;z-index:9999;
  }
  .text-cursor-item{
    position:absolute;user-select:none;-webkit-user-select:none;white-space:nowrap;
    font-size:1.5rem;line-height:1;color:var(--accent);
    opacity:0;transform:scale(1);will-change:transform,opacity;
    transition:opacity var(--tc-exit,.5s) ease-out,transform var(--tc-exit,.5s) ease-out;
  }
  .text-cursor-item.is-in{opacity:.45}
  .text-cursor-item.is-out{opacity:0;transform:scale(0)}
  .text-cursor-static{display:inline-block;transform:rotate(var(--tc-angle,0deg))}
  .text-cursor-float{display:inline-block;animation:tc-float 2s ease-in-out infinite alternate}
  @keyframes tc-float{
    0%{transform:rotate(var(--tc-angle,0deg)) translate(0,0) rotate(0deg)}
    100%{transform:rotate(var(--tc-angle,0deg)) translate(var(--tc-rx,0px),var(--tc-ry,0px)) rotate(var(--tc-rr,0deg))}
  }

  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition:none!important;animation:none!important} }
  @media (min-width:700px){ .wrap{padding-top:36px} }
  @media print{ .date-card,.recent,.clock,.weather,.mood-card,.paper-tools,.photo-del,.handle,.stickers,.tool-hint,.text-cursor-layer,.cal-pop,.date-trigger{display:none} body{background:#fff} .journal{border:1px solid #ccc;box-shadow:none} .paper{min-height:0;box-shadow:none} .blk-img{box-shadow:none} }
</style>

<style id="campus-plugin-ui-v2">
/* Self-contained visual system; the journal retains its paper and photo interactions. */

@media(max-width:760px){.wrap{max-width:640px;display:block;padding:25px 18px calc(28px + env(safe-area-inset-bottom))}#hero{padding-bottom:20px;margin-bottom:20px;grid-template-columns:1fr;gap:5px}.kicker{font-size:9px}h1{font-size:29px}.hero-note{font-size:11px}.clock{grid-column:1;grid-row:auto;text-align:left;font-size:9px;margin-top:4px}.date-card,.mood-card{margin-bottom:15px;padding:17px}.d-top{gap:8px}.arrow{width:35px;flex-basis:35px}.d-date{font-size:22px}.d-meta{gap:7px}.weather{font-size:10px;max-width:100%;padding:4px 8px}.d-week{font-size:11px}.d-actions{margin-top:15px;padding-top:13px}.btn,input[type=date]{font-size:12px}.cal-pop{left:50%;transform:translateX(-50%)}.mood-head{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}.mood-title{font-size:12px}.mood-sub{font-size:9px;margin:0}.mood-list{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.mood-btn{padding:9px 4px;gap:5px;flex-direction:column;font-size:10px;justify-content:center;min-height:59px}.mood-btn .mood-emoji{font-size:20px}.mood-dot{display:none}.journal-head{padding:17px}.paper-wrap{padding:14px 12px}.paper{min-height:410px;padding:6px 12px 22px}.blk-text{font-size:14px}.paper-tools{padding:0 17px 16px}.meta{padding:12px 17px}.recent{margin-top:25px}.recent h2{font-size:12px}.hist-item{padding:13px 14px}.hist-date{font-size:12px}.hist-empty{font-size:11px;padding:18px 14px}footer{margin-top:23px;font-size:9px;line-height:1.8}}
@media(max-width:350px){.wrap{padding-left:14px;padding-right:14px}.date-card,.mood-card{padding:14px}.d-date{font-size:19px}.arrow{width:28px;flex-basis:28px}.d-top{gap:4px}.weather{font-size:9px}.mood-head{display:block}.mood-sub{margin-top:4px}.mood-list{gap:5px}.mood-btn{font-size:9px}.journal-head{padding:15px}.paper-wrap{padding:12px 10px}.paper-tools,.meta{padding-left:15px;padding-right:15px}.cal-pop{left:calc(50% + 22px)}.hero-note{font-size:10px}}
@media(prefers-color-scheme:dark){:root{--bg:#17232c;--paper:#21303a;--ink:#edf3f2;--ink-soft:#a3b2b9;--accent:#9aa7ff;--accent-soft:#303d66;--line:#34444c;--line-strong:#4b5c63;--board:#1e2b34;--ok:#9bc6ad;--shadow-sm:0 8px 25px #00000010;--shadow-md:0 18px 45px #00000022}html{color-scheme:dark}.weather{background:#4e3e30;color:#ffd5ac}.btn.primary,.cal-day.is-sel,.dg-btn{color:#17232c}.paper{background-image:repeating-linear-gradient(transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px)}.blk-text:focus{background:#9aa7ff09}.mood-btn.on{box-shadow:none}.blk-img{background:#efede8}.journal:focus-within .paper{box-shadow:inset 0 0 0 1px var(--line-strong)}}
@media print{.wrap{display:block;max-width:100%;padding:0}#hero{display:block;border:0}.hero-note,footer{display:none}.journal{border-radius:0}.journal-head:before{display:none}.paper{min-height:0}}

<body>
<div class="wrap">
  <header id="hero">
    <p class="kicker">MY DIARY</p>
    <h1>我的日记</h1>
    <p class="hero-note">留给自己的一页校园时光。</p>
    <div class="clock" id="clock">2026年9月29日 星期二 20:25:46</div>
  </header>

  <section class="date-card">
    <div class="d-top">
      <button class="arrow" id="prevDay" title="前一天" aria-label="前一天">‹</button>
      <div class="d-mid">
        <div class="d-date" id="dateMain">2026年9月21日</div>
        <div class="d-meta">
          <span class="d-week" id="dateSub">星期一</span>
          <button class="weather" id="weather" title="点击选择城市"><span id="weatherTxt">☁️ 阴 · 最高24°C / 最低17°C · 西安</span><span class="whint">⌄</span></button>
        </div>
      </div>
      <button class="arrow" id="nextDay" title="后一天" aria-label="后一天">›</button>
    </div>
    <div class="d-actions">
      <span class="date-pick-wrap" id="dateWrap">
        <input type="date" id="datePicker" aria-label="选择日期" value="2026-09-21" tabindex="-1">
        <button type="button" class="date-trigger" id="dateTrigger" aria-label="选择日期" aria-haspopup="dialog" aria-expanded="false"></button>
        <div class="cal-pop" id="calPop" hidden role="dialog" aria-label="选择日期">
          <div class="cal-head">
            <button type="button" class="cal-nav" data-step="-12" aria-label="上一年">«</button>
            <button type="button" class="cal-nav" data-step="-1" aria-label="上个月">‹</button>
            <span class="cal-title" id="calTitle"></span>
            <button type="button" class="cal-nav" data-step="1" aria-label="下个月">›</button>
            <button type="button" class="cal-nav" data-step="12" aria-label="下一年">»</button>
          </div>
          <div class="cal-week"></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-foot">
            <span class="cal-hint">日期背景为当天记录的心情</span>
            <button type="button" class="cal-today" id="calToday">回到今天</button>
          </div>
        </div>
      </span>
      <button class="btn primary" id="todayBtn">今天</button>
    </div>
  </section>

  <section class="mood-card" aria-label="心情记录">
    <div class="mood-head">
      <span class="mood-title" id="moodTitle">今天的心情</span>
      <span class="mood-sub" id="moodSub">选一个此刻的心情</span>
    </div>
    <div class="mood-list" id="moodList"></div>
  </section>

  <article class="journal">
    <div class="journal-head"><div class="j-hint" id="jTime">写下今天发生的事情吧……</div></div>
    <div class="paper-wrap">
      <div class="paper" id="paper"></div>
      <div class="stickers" id="stickers" aria-hidden="true"></div>
    </div>
    <div class="paper-tools">
      <button class="tool-btn" id="addText" type="button">＋ 文字</button>
      <button class="tool-btn" id="addPhoto" type="button">📷 添加照片</button>
      <span class="tool-hint">照片只保存在本机 · 可拖动 / 缩放 / 删除</span>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
    <div class="meta">
      <div class="status" id="statusBox"><span class="dot"></span><span id="statusTxt">已切换</span></div>
      <div class="word-count" id="wordCount">0 字</div>
    </div>
  </article>

  <nav class="recent" aria-label="历史日记">
    <h2>历史日记</h2>
    <div class="hist-list" id="histList"><div class="hist-empty">还没有写过日记</div></div>
  </nav>

  <footer><span class="lock" id="lockHint">🔒 已本地加密，仅保存在你的浏览器中</span></footer>

  <dialog id="cityDlg">
    <div class="dg">
      <h3 id="dgTitle">设置天气城市</h3>
      <p class="sub" id="dgSub">输入城市名，或使用当前位置。城市名仅保存在本机。</p>
      <div class="dg-row">
        <input id="cityInput" placeholder="例如：北京、上海、广州" autocomplete="off" value="北京">
        <button class="dg-btn" id="cityGo">查询</button>
      </div>
      <p class="dg-msg ok" id="cityMsg">已设为：北京</p>
      <button class="dg-link" id="useLoc">📍 使用我的当前位置</button>
      <button class="dg-close" id="cityClose">取消</button>
    </div>
  </dialog>
</div>

<script>
(function(){
  "use strict";

  /* ================= 模块 0：常量 ================= */
  var PREFIX = "personal_";
  void PREFIX;

  /* ================= 模块 1：安全工具 ================= */
  var hasSubtle = !!(window.crypto && window.crypto.subtle);

  /** localStorage 封装：任何情况下返回可用对象或 null */
  function storage(){
    try {
      var k = PREFIX + "__t__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return window.localStorage;
    } catch (e) { return null; }
  }

  /** 简单 HTML 转义，避免 innerHTML 注入 */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function jsonParseSafe(text, fallback){
    try { return JSON.parse(text); }
    catch (e) { return fallback; }
  }
  function safeGetItem(s, key){
    if (!s) return null;
    try { return s.getItem(key); } catch (e) { return null; }
  }
  function safeSetItem(s, key, val){
    if (!s) return;
    try { s.setItem(key, val); } catch (e) { /* 存储满或不可用 */ }
  }
  function safeRemoveItem(s, key){
    if (!s) return;
    try { s.removeItem(key); } catch (e) {}
  }

  /* ================= 模块 2：日期工具（统一本地时区，YYYY-MM-DD） ================= */
  var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  function pad2(n){ return (n < 10 ? "0" : "") + n; }

  /** 把 Date 转成 YYYY-MM-DD（本地，无 UTC 偏移） */
  function toKey(d){
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  /** 从 YYYY-MM-DD 构造本地 Date（避免 new Date("YYYY-MM-DD") 的 UTC 陷阱） */
  function fromKey(k){
    var p = String(k).split("-").map(Number);
    return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1);
  }
  function todayKey(){
    return toKey(new Date());
  }
  function fmtDate(d){
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }
  function timeStampNow(){
    var n = new Date();
    return toKey(n) + " " + pad2(n.getHours()) + ":" + pad2(n.getMinutes()) + ":" + pad2(n.getSeconds());
  }
  function hhmm(stamp){
    return stamp && stamp.length >= 16 ? stamp.slice(11, 16) : "";
  }

  /* ================= 模块 3：存储键 ================= */
  var K = {
    diary: function(day){ return PREFIX + "diary_" + day; },          // 日记正文（旧格式，兼容保留）
    page: function(day){ return PREFIX + "diary_page_" + day; },      // 图文手帐整页（加密 JSON）
    mood: function(day){ return PREFIX + "mood_" + day; },            // 每日心情
    photo: function(id){ return PREFIX + "photo_" + id; },            // 照片兜底存储（IndexedDB 不可用时）
    updated: function(day){ return PREFIX + "updated_" + day; },      // 旧版本保存时间
    dayWeather: function(day){ return PREFIX + "diary_weather_" + day; },
    key: PREFIX + "diary_key",
    meta: PREFIX + "diary_meta",
    city: PREFIX + "weather_city",
    lat: PREFIX + "weather_lat",
    lon: PREFIX + "weather_lon",
    weatherCache: PREFIX + "weather_cache"
  };

  /* ================= 模块 4：加密（AES-GCM，兼容旧明文） ================= */
  var cryptoKeyRef = null;

  function bytesToB64(bytes){
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function b64ToBytes(str){
    var bin = atob(str);
    var u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  function ensureKey(){
    if (cryptoKeyRef) return Promise.resolve(cryptoKeyRef);
    var s = storage();
    var ks = safeGetItem(s, K.key);
    var raw;
    try {
      if (ks) raw = b64ToBytes(ks);
      else {
        raw = window.crypto.getRandomValues(new Uint8Array(32));
        safeSetItem(s, K.key, bytesToB64(raw));
      }
      return window.crypto.subtle
        .importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"])
        .then(function(k){ cryptoKeyRef = k; return k; });
    } catch (e) { return Promise.reject(e); }
  }

  /** 加密正文 -> 存储串（返回 Promise） */
  function encryptText(text){
    var iv = window.crypto.getRandomValues(new Uint8Array(12));
    var data = new TextEncoder().encode(text);
    return ensureKey()
      .then(function(key){ return window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, data); })
      .then(function(ct){ return JSON.stringify({ v: 1, iv: bytesToB64(iv), ct: bytesToB64(new Uint8Array(ct)) }); });
  }

  /**
   * 解密读取：
   *  - 空 -> ""
   *  - 我们的加密格式（v===1 且有 iv/ct）-> AES 解密
   *  - 其它任何内容（旧版本明文、"损坏"数据）-> 原样返回，保证旧数据可见、不误删
   */
  function decryptText(payload){
    if (!payload) return Promise.resolve("");
    var o = jsonParseSafe(payload, null);
    if (o && typeof o === "object" && o.v === 1 && typeof o.iv === "string" && typeof o.ct === "string") {
      var iv, ct;
      try { iv = b64ToBytes(o.iv); ct = b64ToBytes(o.ct); } catch (e) { return Promise.resolve(payload); }
      return ensureKey()
        .then(function(key){
          return window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
        })
        .then(function(pt){ return new TextDecoder().decode(pt); })
        .catch(function(){ return payload; }); // 解密失败按明文回退，不丢数据
    }
    // 非加密格式：兼容旧版本明文
    return Promise.resolve(String(payload));
  }
  function encFallback(text){
    return JSON.stringify({ v: 0, d: btoa(unescape(encodeURIComponent(text))) });
  }
  function decFallback(payload){
    try {
      var o = JSON.parse(payload);
      if (o && o.v === 0 && typeof o.d === "string") return decodeURIComponent(escape(atob(o.d)));
    } catch (e) {}
    return "";
  }

  /** 读取某天正文（异步），返回 Promise<string> */
  function readDiary(day){
    var s = storage();
    var v = safeGetItem(s, K.diary(day));
    if (v == null) return Promise.resolve("");
    if (hasSubtle) return decryptText(v);
    return Promise.resolve(decFallback(v) || v);
  }

  /* ================= 模块 5：元数据 / 历史（兼容旧数据） ================= */
  function readMeta(){
    var s = storage();
    var t = safeGetItem(s, K.meta);
    var arr = jsonParseSafe(t, []);
    return Array.isArray(arr) ? arr : [];
  }
  function saveMeta(list){
    safeSetItem(storage(), K.meta, JSON.stringify(list));
  }
  function findMeta(day){
    var list = readMeta();
    for (var i = 0; i < list.length; i++) if (list[i].d === day) return list[i];
    return null;
  }

  /** 取某天最后保存时间：meta 优先，其次旧版 updated 键 */
  function getUpdated(day){
    var m = findMeta(day);
    if (m && m.u) return m.u;
    return safeGetItem(storage(), K.updated(day)) || "";
  }

  /** 构建历史日期列表：meta ∪ 扫描到的旧 diary 键 ∪ 只记了心情的日期 */
  function buildHistory(){
    var map = {};
    var list = readMeta();
    list.forEach(function(m){ if (m && m.d) map[m.d] = m.u || ""; });

    var s = storage();
    if (s) {
      try {
        for (var i = 0; i < s.length; i++) {
          var key = s.key(i) || "";
          var prefix = PREFIX + "diary_";
          var moodPrefix = PREFIX + "mood_";
          if (key.indexOf(prefix) === 0) {
            var day = key.slice(prefix.length);
            if (/^\d{4}-\d{2}-\d{2}$/.test(day) && !(day in map)) {
              map[day] = safeGetItem(s, K.updated(day)) || "";
            }
          } else if (key.indexOf(moodPrefix) === 0) {
            var mday = key.slice(moodPrefix.length);
            if (/^\d{4}-\d{2}-\d{2}$/.test(mday) && !(mday in map)) {
              map[mday] = "";
            }
          }
        }
      } catch (e) {}
    }
    return Object.keys(map).sort().reverse();
  }

  /* ================= 模块 6：DOM 引用 ================= */
  var $ = $id;
  function $id(id){ return document.getElementById(id); }

  var el = {
    dateMain: $("dateMain"), dateSub: $("dateSub"), jTime: $("jTime"),
    paper: $("paper"), stickers: $("stickers"), picker: $("datePicker"), clock: $("clock"),
    statusBox: $("statusBox"), statusTxt: $("statusTxt"), wordCount: $("wordCount"),
    histList: $("histList"), weatherTxt: $("weatherTxt"), weather: $("weather"),
    cityDlg: $("cityDlg"), cityInput: $("cityInput"), cityMsg: $("cityMsg"),
    moodList: $("moodList"), moodTitle: $("moodTitle"), moodSub: $("moodSub"),
    photoInput: $("photoInput")
  };

  var curDate; // 当前浏览的日期（Date，本地）

  /* ================= 模块 7：状态栏 ================= */
  function setStatus(mode, txt){
    el.statusBox.className = "status" + (mode ? " " + mode : "");
    el.statusTxt.textContent = txt;
  }

  /* ================= 模块 8：字数 / 头部提示 ================= */
  /** 取某个文字块的纯文本 */
  function blockText(node){
    if (!node) return "";
    var t = node.innerText != null ? node.innerText : node.textContent;
    return String(t == null ? "" : t).replace(/\u00a0/g, " ").replace(/\n+$/, "");
  }
  /** 当前手帐是否已有内容（文字或照片） */
  function hasContent(){
    if (!el.paper) return false;
    var t = el.paper.querySelectorAll(".blk-text");
    for (var i = 0; i < t.length; i++) if (blockText(t[i]).trim()) return true;
    return el.paper.querySelectorAll(".blk-img").length > 0;
  }
  function updateWordCount(){
    if (!el.paper) return;
    var n = 0, t = el.paper.querySelectorAll(".blk-text");
    for (var i = 0; i < t.length; i++) n += blockText(t[i]).trim().length;
    var pics = el.paper.querySelectorAll(".blk-img").length;
    el.wordCount.textContent = n + " 字" + (pics ? " · " + pics + " 图" : "");
  }
  function updateHead(){
    if (hasContent()) {
      var t = getUpdated(toKey(curDate));
      el.jTime.textContent = "最后保存 · " + (hhmm(t) || "—");
    } else {
      el.jTime.textContent = "写下今天发生的事情吧……";
    }
  }

  /* ================= 模块 9：自动保存（防抖 + 切换前强制落盘） ================= */
  var saveTimer = null;

  function scheduleSave(){
    clearTimeout(saveTimer);
    setStatus("saving", "正在保存…");
    saveTimer = setTimeout(function(){ doSaveFixed(); }, 700);
    updateWordCount();
    updateHead();
  }

  /** 采集当前纸面上的手帐内容（数组顺序 = 插入顺序：文字↓图片↓文字↓图片） */
  function collectBlocks(){
    var out = [];
    if (!el.paper) return out;
    var kids = el.paper.children;
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (!n.classList) continue;
      if (n.classList.contains("blk-img")) {
        out.push({
          type: "image",
          id: n.getAttribute("data-id") || "",
          x: Math.round(parseFloat(n.style.left) || 0),
          y: Math.round(parseFloat(n.style.top) || 0),
          width: Math.round(n.offsetWidth),
          height: Math.round(n.offsetHeight),
          rot: parseFloat(n.getAttribute("data-rot") || "0") || 0
        });
      } else if (n.classList.contains("blk-text")) {
        out.push({ type: "text", content: blockText(n) });
      }
    }
    return out;
  }

  /** 组装某一天的完整页面数据（文字 + 照片 + 心情 + 天气） */
  function collectPage(day){
    var mood = readMood(day);
    var snap = readSnap(day);
    return {
      date: day,
      mood: mood ? { key: mood.mood, emoji: mood.emoji, label: mood.label } : null,
      weather: snap ? {
        city: snap.city || "",
        temperature: (snap.temp != null ? snap.temp : null),
        high: (snap.high != null ? snap.high : null),
        low: (snap.low != null ? snap.low : null)
      } : null,
      blocks: collectBlocks()
    };
  }

  function pageHasContent(page){
    if (!page || !page.blocks) return false;
    for (var i = 0; i < page.blocks.length; i++) {
      var b = page.blocks[i];
      if (!b) continue;
      if (b.type === "image" && b.id) return true;
      if (b.type === "text" && b.content && b.content.trim()) return true;
    }
    return false;
  }
  function pageText(page){
    var out = [];
    (page.blocks || []).forEach(function(b){ if (b && b.type === "text" && b.content) out.push(b.content); });
    return out.join("\n");
  }
  function pageImageCount(page){
    var n = 0;
    (page.blocks || []).forEach(function(b){ if (b && b.type === "image" && b.id) n++; });
    return n;
  }

  /**
   * 把"当前日期 key + 当前手帐页"固定捕获后立即保存到该日期。
   * 不依赖可能随后变化的 curDate / 当前纸面，保证：
   *   - 切换日期前旧内容一定落到正确的旧日期；
   *   - 切换发生后，旧的防抖任务（若有）也不会污染新日期。
   */
  function doSaveFixed(){
    var s = storage();
    if (!s) { setStatus("", "无法保存：本地存储不可用"); return; }
    var day = toKey(curDate);                 // 提前捕获固定日期 key
    commitPage(day, collectPage(day));        // 提前捕获固定内容
  }

  /**
   * 底层写入：对固定 day + page 执行 AES-GCM 加密保存 / 清空。
   * 主键 personal_diary_page_<day>；同时把纯文字同步写回旧的 personal_diary_<day>，保证旧格式可读。
   * 返回 Promise，完成后才允许切换日期。
   */
  function commitPage(day, page){
    var s = storage();
    if (!s) return Promise.resolve();
    var stamp = timeStampNow();
    var has = pageHasContent(page);
    var text = pageText(page);
    var nImg = pageImageCount(page);

    function finalize(){
      var list = readMeta();
      if (has) {
        var found = false;
        for (var i = 0; i < list.length; i++) if (list[i].d === day) { list[i].u = stamp; list[i].n = nImg; found = true; break; }
        if (!found) list.push({ d: day, u: stamp, n: nImg });
      } else {
        list = list.filter(function(x){ return x.d !== day; });
      }
      saveMeta(list);
      // UI 回调只在"当前仍在该日期"时生效，避免旧日期保存结果污染目标新日期页面
      if (toKey(curDate) === day) {
        setStatus("saved", "已保存 · " + hhmm(stamp));
        updateHead();
        renderHistory();
      }
    }
    function fail(){ if (toKey(curDate) === day) setStatus("", "保存失败，请重试"); }

    /** 兼容旧格式：把纯文字同步写入 personal_diary_<day>（无文字则清掉） */
    function writeLegacy(){
      if (text && text.trim()) {
        if (hasSubtle) return encryptText(text).then(function(e){ safeSetItem(s, K.diary(day), e); });
        safeSetItem(s, K.diary(day), encFallback(text));
        return Promise.resolve();
      }
      safeRemoveItem(s, K.diary(day));
      return Promise.resolve();
    }

    if (!has) {
      safeRemoveItem(s, K.page(day));
      return writeLegacy().then(finalize).catch(fail);
    }
    var payload = JSON.stringify({ v: 2, page: page });
    var enc = hasSubtle ? encryptText(payload) : Promise.resolve(encFallback(payload));
    return enc.then(function(cipher){
      safeSetItem(s, K.page(day), cipher);
      return writeLegacy();
    }).then(finalize).catch(fail);
  }

  /** 切换日期前调用：立即落盘当前日期内容，并取消挂起的防抖保存，返回 Promise 以便等待保存完成 */
  function flushBeforeSwitch(){
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!storage()) return Promise.resolve();
    var day = toKey(curDate);                 // 固定捕获当前日期
    return commitPage(day, collectPage(day));
  }

  /* ================= 模块 10：加载当日手帐（带竞态保护 + 旧数据兼容） ================= */
  var loadToken = 0;   // 递增令牌：只有最后一次请求可写回，防止快速切换时旧解密覆盖新页面

  /**
   * 读取某天页面数据：
   *  - 优先 personal_diary_page_<day>（加密 JSON）
   *  - 没有时读取旧的纯文字日记，自动转换为 [{type:"text",content:"旧日记内容"}]，不丢失历史数据
   */
  function readPage(day){
    var s = storage();
    var raw = safeGetItem(s, K.page(day));
    var base;
    if (raw == null) base = Promise.resolve("");
    else if (hasSubtle) base = decryptText(raw);
    else base = Promise.resolve(decFallback(raw) || raw);

    return base.then(function(json){
      var obj = jsonParseSafe(json, null);
      // 兼容两种包裹：{v:2,page:{...}} 与直接 {blocks:[...]}
      var pg = (obj && typeof obj === "object" && obj.page && typeof obj.page === "object") ? obj.page : obj;
      if (pg && typeof pg === "object" && Array.isArray(pg.blocks)) {
        return { page: pg, migrated: false };
      }
      // 兼容旧数据：只有文字的日记 -> block 结构
      return readDiary(day).then(function(txt){
        var mood = readMood(day);
        return {
          page: {
            date: day,
            mood: mood ? { key: mood.mood, emoji: mood.emoji, label: mood.label } : null,
            weather: null,
            blocks: [{ type: "text", content: txt || "" }]
          },
          migrated: !!(txt && txt.trim())
        };
      });
    });
  }

  function loadContent(day){
    var myToken = ++loadToken;
    var expectedKey = String(day);
    readPage(day).then(function(res){
      // 若期间又发起了新的加载请求，或当前浏览日期已变化，则丢弃本次结果
      if (myToken !== loadToken) return;
      if (toKey(curDate) !== expectedKey) return;
      renderPage(res.page, day);
      updateHead();
      updateWordCount();
      if (res.migrated) commitPage(day, collectPage(day));   // 旧数据迁移落盘（保留旧键不删）
    });
  }

  /* ================= 模块 11：天气 ================= */
  var WCODES = {
    0:["☀️","晴"],1:["🌤️","基本晴"],2:["⛅","多云"],3:["☁️","阴"],45:["🌫️","雾"],48:["🌫️","雾凇"],
    51:["🌦️","小毛毛雨"],53:["🌦️","毛毛雨"],55:["🌧️","浓毛毛雨"],56:["🌧️","冻毛毛雨"],57:["🌧️","冻毛毛雨"],
    61:["🌧️","小雨"],63:["🌧️","中雨"],65:["🌧️","大雨"],66:["🌧️","冻雨"],67:["🌧️","冻雨"],
    71:["🌨️","小雪"],73:["🌨️","中雪"],75:["🌨️","大雪"],77:["❄️","雪粒"],
    80:["🌦️","小阵雨"],81:["🌧️","中阵雨"],82:["⛈️","强阵雨"],85:["🌨️","阵雪"],86:["🌨️","阵雪"],
    95:["⛈️","雷暴"],96:["⛈️","冰雹雷暴"],99:["⛈️","冰雹雷暴"]
  };
  function weatherDesc(code){ var e = WCODES[code]; return e || ["🌡️", "天气"]; }
  function isFresh(ts, min){ return ts && (Date.now() - ts < min * 60 * 1000); }

  function readSnap(day){ return jsonParseSafe(safeGetItem(storage(), K.dayWeather(day)), null); }
  function saveSnap(day, obj){ safeSetItem(storage(), K.dayWeather(day), JSON.stringify(obj)); }
  function readCache(){ return jsonParseSafe(safeGetItem(storage(), K.weatherCache), null); }
  function writeCache(obj){ safeSetItem(storage(), K.weatherCache, JSON.stringify(obj)); }

  /** 某天快照是否含可用天气数据（有最高/最低或实时温度即算"已有记录"） */
  function hasWeather(snap){
    return !!(snap && (snap.temp != null || snap.high != null || snap.low != null));
  }

  /** 城市名 -> 坐标（纯查询，不写存储，由调用方在成功后落库） */
  function geocodeCity(name){
    return fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) + "&count=1&language=zh&format=json")
      .then(function(r){ if (!r.ok) throw new Error("geo"); return r.json(); })
      .then(function(d){
        if (d && d.results && d.results[0]) {
          return { lat: d.results[0].latitude, lon: d.results[0].longitude };
        }
        return null;
      })
      .catch(function(){ return null; });
  }

  /**
   * 解析"指定城市"的坐标：
   *  - 与该城市同名的"最近使用城市"已有坐标 -> 直接复用，省一次网络请求；
   *  - 否则按城市名重新地理编码，保证"城市名 ↔ 坐标"始终对应，不会串城市。
   */
  function resolveCityCoord(name){
    if (!name) return Promise.resolve(null);
    var s = storage();
    var savedCity = safeGetItem(s, K.city);
    var savedLat = safeGetItem(s, K.lat);
    var savedLon = safeGetItem(s, K.lon);
    if (savedCity === name && savedLat != null && savedLon != null) {
      var la = parseFloat(savedLat), lo = parseFloat(savedLon);
      if (!isNaN(la) && !isNaN(lo)) return Promise.resolve({ lat: la, lon: lo });
    }
    return geocodeCity(name);
  }

  /** 两个 YYYY-MM-DD 之间的天数差（to - from） */
  function daysBetween(from, to){
    var a = String(from).split("-").map(Number), b = String(to).split("-").map(Number);
    var ta = Date.UTC(a[0] || 1970, (a[1] || 1) - 1, a[2] || 1);
    var tb = Date.UTC(b[0] || 1970, (b[1] || 1) - 1, b[2] || 1);
    return Math.round((tb - ta) / 86400000);
  }

  /** 由接口返回构造"某天快照"（唯一出口）；数据不可用时返回 null */
  function buildSnap(d, day, cityName, isToday, coord){
    if (!d) return null;
    var code = null, mx = null, mn = null, temp = null;
    if (isToday) {
      if (!d.current) return null;
      code = d.current.weather_code;
      temp = d.current.temperature_2m != null ? Math.round(d.current.temperature_2m) : null;
      mx = d.daily && d.daily.temperature_2m_max ? d.daily.temperature_2m_max[0] : null;
      mn = d.daily && d.daily.temperature_2m_min ? d.daily.temperature_2m_min[0] : null;
    } else {
      if (!d.daily || !Array.isArray(d.daily.time) || d.daily.time.length === 0) return null;
      var idx = d.daily.time.indexOf(day);
      if (idx < 0) idx = 0;
      code = d.daily.weather_code ? d.daily.weather_code[idx] : null;
      mx = d.daily.temperature_2m_max ? d.daily.temperature_2m_max[idx] : null;
      mn = d.daily.temperature_2m_min ? d.daily.temperature_2m_min[idx] : null;
    }
    var w = weatherDesc(code);
    var snap = {
      icon: w[0], desc: w[1], temp: temp,
      high: mx != null ? Math.round(mx) : null,
      low: mn != null ? Math.round(mn) : null,
      city: cityName, ts: Date.now(), coord: coord || null
    };
    return hasWeather(snap) ? snap : null;
  }

  /**
   * 查询"某一天 + 某城市"的天气（全站唯一的天气查询出口）：
   *   - day === 今天 -> forecast 接口：实时天气 + 当日最高/最低
   *   - day  <  今天 -> 该历史日期当天的天气（近 92 天用 past_days，更久用 ERA5 存档兜底）
   *   - day  >  今天 -> 无记录，返回 null
   * coords 可选：定位等场景直接传坐标，跳过地理编码。
   */
  function fetchWeatherForDay(day, cityName, coords){
    var today = todayKey();
    if (!cityName || day > today) return Promise.resolve(null);
    var isToday = (day === today);
    var coordPromise = (coords && coords.lat != null && coords.lon != null)
      ? Promise.resolve({ lat: coords.lat, lon: coords.lon })
      : resolveCityCoord(cityName);

    return coordPromise.then(function(c){
      if (!c) return null;
      var base = "latitude=" + c.lat + "&longitude=" + c.lon + "&timezone=auto";
      var urls;
      if (isToday) {
        urls = ["https://api.open-meteo.com/v1/forecast?" + base +
          "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min"];
      } else {
        var ago = daysBetween(day, today);
        urls = [];
        if (ago >= 1 && ago <= 92) {
          // 近期历史：预报接口的 past_days 更新更快，且能覆盖 ERA5 尚未收录的最近几天
          urls.push("https://api.open-meteo.com/v1/forecast?" + base +
            "&past_days=" + ago + "&forecast_days=1&daily=temperature_2m_max,temperature_2m_min,weather_code");
        }
        // 久远历史 / 兜底：ERA5 存档接口
        urls.push("https://archive-api.open-meteo.com/v1/era5?" + base +
          "&start_date=" + day + "&end_date=" + day + "&daily=temperature_2m_max,temperature_2m_min,weather_code");
      }

      function attempt(i){
        if (i >= urls.length) return Promise.resolve(null);
        return fetch(urls[i])
          .then(function(r){ if (!r.ok) throw new Error("weather"); return r.json(); })
          .then(function(d){
            var snap = buildSnap(d, day, cityName, isToday, c);
            return snap || attempt(i + 1);
          })
          .catch(function(){ return attempt(i + 1); });
      }
      return attempt(0);
    }).catch(function(){ return null; });
  }

  /** 统一的快照文本：今天快照有 temp，历史快照只有最高/最低 */
  function snapText(snap){
    if (!snap) return "天气 · 点击设置";
    var head = snap.icon + " " + snap.desc;
    if (snap.temp != null) {
      return head + " · " + snap.temp + "°C · " + (snap.city || "当前位置");
    }
    if (snap.high != null || snap.low != null) {
      return head + " · 最高" + (snap.high != null ? snap.high : "—") + "°C / 最低" + (snap.low != null ? snap.low : "—") + "°C · " + (snap.city || "当前位置");
    }
    return head + (snap.city ? (" · " + snap.city) : "");
  }

  /**
   * 渲染天气条：
   *   1) 该日已有天气快照 -> 直接恢复当时保存的天气，不查询、不覆盖
   *   2) 今天且无快照     -> 有最近使用的城市才自动获取实时天气，否则提示选择城市
   *   3) 过去日期且无快照 -> 不自动查询，提示点击选择城市（补写日记时由用户手动选择）
   *   4) 未来日期         -> 未来天气暂未记录
   */
  function renderWeather(){
    var day = toKey(curDate);
    var snap = readSnap(day);

    // 1) 已有记录：优先恢复当时保存的天气
    if (hasWeather(snap)) {
      el.weatherTxt.textContent = snapText(snap);
      return;
    }

    var today = todayKey();
    if (day === today) {
      var city = safeGetItem(storage(), K.city);
      var cache = readCache();
      if (cache && cache.temp != null && isFresh(cache.ts, 45) && (!city || cache.city === city)) {
        el.weatherTxt.textContent = snapText(cache);
      } else if (city) {
        el.weatherTxt.textContent = "正在获取今天天气…";
      } else {
        el.weatherTxt.textContent = "天气 · 点击选择城市";
      }
      fetchWeatherForToday(day);
    } else if (day < today) {
      // 2) 历史日期且无记录：不自动查询，等用户手动选择城市后按该城市查当天天气
      el.weatherTxt.textContent = "历史天气 · 点击选择城市";
    } else {
      // 3) 未来日期
      el.weatherTxt.textContent = "未来天气暂未记录";
    }
  }

  /* 天气竞态令牌：返回结果只更新当前仍在查看的日期页面，避免历史请求覆盖新日期 */
  var weatherToken = 0;

  /** 今天：用最近使用的城市补全实时天气并写入当天快照 */
  function fetchWeatherForToday(day){
    if (day !== todayKey()) return;
    if (hasWeather(readSnap(day))) return;
    var city = safeGetItem(storage(), K.city);
    if (!city) return;                       // 没有城市：等用户手动选择，不静默定位
    var cache = readCache();
    if (cache && cache.temp != null && isFresh(cache.ts, 45) && cache.city === city) {
      saveSnap(day, cache);
      return;
    }
    var myToken = ++weatherToken;
    fetchWeatherForDay(day, city).then(function(res){
      if (!res) {
        if (myToken === weatherToken && toKey(curDate) === day) el.weatherTxt.textContent = "天气暂时无法获取";
        return;
      }
      var snap = { icon: res.icon, desc: res.desc, temp: res.temp, high: res.high, low: res.low, city: res.city, ts: res.ts };
      writeCache(snap);
      saveSnap(day, snap);
      if (myToken === weatherToken && toKey(curDate) === day) el.weatherTxt.textContent = snapText(snap);
    });
  }

  function setCity(name, lat, lon){
    var s = storage();
    if (!s) return;
    safeSetItem(s, K.city, name);
    if (lat != null && lon != null) {
      safeSetItem(s, K.lat, String(lat));
      safeSetItem(s, K.lon, String(lon));
    }
  }

  /* 城市弹窗当前对应的日期；以及本次会话中已提示过选城市的日期（避免重复弹窗） */
  var dlgDay = null;
  var cityAsked = {};

  /**
   * 为某一天设置 / 修改城市：
   * 查询该城市在该日记日期当天的天气，写入（或覆盖）该日快照。
   * 成功返回 true；失败返回 false，且不覆盖原有设置与快照。
   */
  function applyCityForDay(day, name, coords){
    var s = storage();
    if (!s) {
      el.cityMsg.textContent = "本地存储不可用，无法设置城市。";
      el.cityMsg.className = "dg-msg err";
      return Promise.resolve(false);
    }
    if (day > todayKey()) {
      el.cityMsg.textContent = "未来日期暂无天气记录，无法查询。";
      el.cityMsg.className = "dg-msg err";
      return Promise.resolve(false);
    }
    el.cityMsg.textContent = "查询中…";
    el.cityMsg.className = "dg-msg";

    var prevCity = safeGetItem(s, K.city);
    return fetchWeatherForDay(day, name, coords).then(function(res){
      if (!res) {
        el.cityMsg.textContent = "未找到 " + name + " 在 " + day + " 的天气，请检查城市名后重试。";
        el.cityMsg.className = "dg-msg err";
        return false;
      }
      var snap = { icon: res.icon, desc: res.desc, temp: res.temp, high: res.high, low: res.low, city: res.city, ts: res.ts };
      saveSnap(day, snap);                        // 只更新这一天的天气记录
      setCity(res.city, res.coord ? res.coord.lat : null, res.coord ? res.coord.lon : null);
      if (day === todayKey()) {
        writeCache(snap);                         // 今天：同步实时天气缓存
      } else if (prevCity !== res.city) {
        safeRemoveItem(s, K.weatherCache);        // 城市变了，今天的旧缓存作废
      }
      el.cityMsg.textContent = "已设为：" + res.city;
      el.cityMsg.className = "dg-msg ok";
      if (toKey(curDate) === day) renderWeather();
      return true;
    });
  }

  /** 弹窗点查询：为弹窗对应的那一天设置城市（今天取实时天气，过去取该日历史天气） */
  function lookupCity(name){
    var day = dlgDay || toKey(curDate);
    applyCityForDay(day, name).then(function(ok){
      if (ok) setTimeout(closeCityDlg, 500);
    });
  }

  /** 使用浏览器定位（必须用户授权）；定位结果同样只作用于当前那一天 */
  function useGeolocation(){
    if (!navigator.geolocation) {
      el.cityMsg.textContent = "当前浏览器不支持定位，请手动输入城市。";
      el.cityMsg.className = "dg-msg err";
      return;
    }
    var day = dlgDay || toKey(curDate);
    try {
      navigator.geolocation.getCurrentPosition(function(pos){
        var lat = pos.coords.latitude, lon = pos.coords.longitude;
        fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=zh")
          .then(function(r){ if (!r.ok) throw new Error("rev"); return r.json(); })
          .then(function(d){
            var name = (d && (d.city || d.locality)) || "当前位置";
            applyCityForDay(day, name, { lat: lat, lon: lon }).then(function(ok){ if (ok) setTimeout(closeCityDlg, 600); });
          })
          .catch(function(){
            applyCityForDay(day, "当前位置", { lat: lat, lon: lon }).then(function(ok){ if (ok) setTimeout(closeCityDlg, 600); });
          });
      }, function(err){
        el.cityMsg.textContent = (err && err.code === 1)
          ? "你已拒绝定位授权，可手动输入城市。"
          : "定位失败，请手动输入城市。";
        el.cityMsg.className = "dg-msg err";
      }, { timeout: 10000, maximumAge: 300000 });
    } catch (e) {
      el.cityMsg.textContent = "定位不可用，请手动输入城市。";
      el.cityMsg.className = "dg-msg err";
    }
  }

  /* ================= 模块 16：每日心情 ================= */
  var MOODS = [
    { key: "happy",   emoji: "😀", label: "开心" },
    { key: "calm",    emoji: "😌", label: "平静" },
    { key: "loved",   emoji: "🥰", label: "幸福" },

  /** 选择心情：每天只能有一个，再点一次可取消，随时可改 */
  function pickMood(key){
