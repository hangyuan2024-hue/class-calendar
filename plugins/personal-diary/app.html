  /* 小贴纸（按日期稳定生成，纯装饰） */
  var STICKER_POOL = ["🌿", "✨", "🌸", "☕", "🎀", "🍂", "⭐", "🌙", "🕊️", "🍁"];
  function renderStickers(day){
    if (!el.stickers) return;
    var h = 2166136261;
    for (var i = 0; i < day.length; i++) { h ^= day.charCodeAt(i); h = (h * 16777619) >>> 0; }
    var n = 3 + (h % 3);
    var html = "";
    for (var k = 0; k < n; k++) {
      h = (h * 1103515245 + 12345) >>> 0;
      var top = 3 + (h % 90);
      var left = 2 + ((h >>> 7) % 92);
      var rot = ((h >>> 13) % 32) - 16;
      var em = STICKER_POOL[(h >>> 5) % STICKER_POOL.length];
      html += '<span class="sticker" style="top:' + top + '%;left:' + left + '%;transform:rotate(' + rot + 'deg)">' + em + '</span>';
    }
    el.stickers.innerHTML = html;
  }

  /* ================= 模块 17：照片仓库（IndexedDB：personal_diary_db / photos） ================= */
  var DB_NAME = "personal_diary_db";
  var DB_STORE = "photos";
  var DB_VER = 1;
  var MAX_EDGE = 1600;              // 照片最长边压缩上限，控制体积
  var dbPromise = null;
  var photoURLs = {};               // id -> objectURL，切换日期/删除时释放

  function idbOpen(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve){
      var req;
      try {
        if (!window.indexedDB) { resolve(null); return; }
        req = window.indexedDB.open(DB_NAME, DB_VER);
      } catch (e) { resolve(null); return; }
      req.onupgradeneeded = function(){
        var db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          var os = db.createObjectStore(DB_STORE, { keyPath: "id" });
          try { os.createIndex("day", "day", { unique: false }); } catch (e) {}
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ resolve(null); };
      req.onblocked = function(){ resolve(null); };
    });
    return dbPromise;
  }

  function idbTx(mode, fn){
    return idbOpen().then(function(db){
      if (!db) return null;
      return new Promise(function(resolve){
        var tx, out;
        try { tx = db.transaction(DB_STORE, mode); } catch (e) { resolve(null); return; }
        try { out = fn(tx.objectStore(DB_STORE)); } catch (e) { resolve(null); return; }
        tx.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : true); };
        tx.onerror = function(){ resolve(null); };
        tx.onabort = function(){ resolve(null); };
      });
    }).catch(function(){ return null; });
  }
  function idbPut(rec){ return idbTx("readwrite", function(os){ return os.put(rec); }).then(function(r){ return r !== null; }); }
  function idbGet(id){ return idbTx("readonly", function(os){ return os.get(id); }); }
  function idbDel(id){ return idbTx("readwrite", function(os){ return os.delete(id); }); }

  function blobToDataURL(blob){
    return new Promise(function(resolve){
      try {
        var fr = new FileReader();
        fr.onload = function(){ resolve(typeof fr.result === "string" ? fr.result : null); };
        fr.onerror = function(){ resolve(null); };
        fr.readAsDataURL(blob);
      } catch (e) { resolve(null); }
    });
  }

  /** 存照片：IndexedDB 优先；不可用时回退 localStorage（personal_photo_<id>） */
  function photoPut(id, day, blob){
    var rec = { id: id, day: day, blob: blob, type: (blob && blob.type) || "", createdAt: Date.now() };
    return idbPut(rec).then(function(ok){
      if (ok) return "idb";
      return blobToDataURL(blob).then(function(du){
        if (du && du.length < 2000000) { safeSetItem(storage(), K.photo(id), du); return "local"; }
        return null;
      });
    });
  }
  /** 取照片可显示地址：IndexedDB -> objectURL；回退 localStorage -> dataURL */
  function photoGetURL(id){
    if (!id) return Promise.resolve(null);
    return idbGet(id).then(function(rec){
      if (rec && rec.blob) {
        try {
          var u = URL.createObjectURL(rec.blob);
          photoURLs[id] = u;
          return u;
        } catch (e) {}
      }
      return safeGetItem(storage(), K.photo(id)) || null;
    }).catch(function(){ return safeGetItem(storage(), K.photo(id)) || null; });
  }
  /** 删除照片：页面元素 + IndexedDB + 兜底存储一起删 */
  function photoDel(id){
    if (!id) return Promise.resolve();
    if (photoURLs[id]) { try { URL.revokeObjectURL(photoURLs[id]); } catch (e) {} delete photoURLs[id]; }
    safeRemoveItem(storage(), K.photo(id));
    return idbDel(id);
  }
  function releasePhotoURLs(){
    Object.keys(photoURLs).forEach(function(k){ try { URL.revokeObjectURL(photoURLs[k]); } catch (e) {} });
    photoURLs = {};
  }

  /** 读取图片文件并等比压缩 -> {blob, ratio}；失败返回 null */
  function processImage(file){
    return new Promise(function(resolve){
      var url;
      try { url = URL.createObjectURL(file); } catch (e) { resolve(null); return; }
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
        var ratio = w / h;
        var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
        var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
        var done = function(blob){
          try { URL.revokeObjectURL(url); } catch (e) {}
          resolve({ blob: blob || file, ratio: ratio });
        };
        try {
          var cv = document.createElement("canvas");
          cv.width = tw; cv.height = th;
          cv.getContext("2d").drawImage(img, 0, 0, tw, th);
          if (cv.toBlob) { cv.toBlob(function(b){ done(b); }, "image/jpeg", 0.86); return; }
        } catch (e) {}
        done(file);
      };
      img.onerror = function(){ try { URL.revokeObjectURL(url); } catch (e) {} resolve(null); };
      img.src = url;
    });
  }

  /* ================= 模块 18：图文手帐（Block 编辑器） ================= */
  var ROTS = [-3, 2, -2, 3, -1, 1.5, -1.5, 2.5];
  var zTop = 20;

  function paperWidth(){ return el.paper ? (el.paper.clientWidth || 320) : 320; }
  function newPhotoId(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /** 纸面高度自适应：跟随文字流与照片下沿 */
  function updatePaperHeight(){
    if (!el.paper) return;
    var maxB = 0, i;
    var imgs = el.paper.querySelectorAll(".blk-img");
    for (i = 0; i < imgs.length; i++) {
      var b = (parseFloat(imgs[i].style.top) || 0) + imgs[i].offsetHeight + 30;
      if (b > maxB) maxB = b;
    }
    var txt = el.paper.querySelectorAll(".blk-text");
    for (i = 0; i < txt.length; i++) {
      var tb = txt[i].offsetTop + txt[i].offsetHeight + 24;
      if (tb > maxB) maxB = tb;
    }
    el.paper.style.minHeight = Math.max(440, maxB) + "px";
  }

  /** 清空纸面（切换日期时先清，避免闪现上一天内容） */
  function clearPaper(){
    releasePhotoURLs();
    if (el.paper) el.paper.innerHTML = "";
  }

  function placeCaretAtEnd(node){
    try {
      var r = document.createRange();
      r.selectNodeContents(node);
      r.collapse(false);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (e) {}
  }
  function refreshTextEmpty(node){
    if (node && node.classList) node.classList.toggle("is-empty", !blockText(node).trim());
  }

  /** 文字块 */
  function addTextBlock(content, focus){
    var d = document.createElement("div");
    d.className = "blk-text";
    d.setAttribute("contenteditable", "true");
    d.setAttribute("role", "textbox");
    d.setAttribute("data-ph", "写点什么…");
    if (content) d.textContent = content;
    refreshTextEmpty(d);
    d.addEventListener("input", function(){
      refreshTextEmpty(d);
      updateWordCount();
      updatePaperHeight();
      scheduleSave();
      maybeAskCityForPastDay();          // 补写历史日记时仍会提示选择城市
    });
    d.addEventListener("blur", function(){
      refreshTextEmpty(d);
      updatePaperHeight();
      scheduleSave();
    });
    d.addEventListener("paste", function(e){
      var cd = e.clipboardData || window.clipboardData;
      if (!cd) return;
      if (cd.items) {
        for (var i = 0; i < cd.items.length; i++) {
          var it = cd.items[i];
          if (it.kind === "file" && it.type && it.type.indexOf("image/") === 0) return;  // 图片交给纸面处理
        }
      }
      e.preventDefault();
      var txt = cd.getData("text/plain") || "";
      if (txt) { try { document.execCommand("insertText", false, txt); } catch (err) { d.textContent += txt; } }
    });
    el.paper.appendChild(d);
    if (focus) { d.focus(); placeCaretAtEnd(d); }
    updatePaperHeight();
    return d;
  }

  /** 图片块：拍立得外观 + 胶带 + 拖动 + 四角缩放 + 右上角删除 */
  function addImageBlock(b, focus){
    var id = b.id;
    var rot = (b.rot != null ? b.rot : 0);
    var fig = document.createElement("div");
    fig.className = "blk-img";
    fig.setAttribute("data-id", id);
    fig.setAttribute("data-rot", String(rot));
    fig.style.left = Math.round(b.x || 0) + "px";
    fig.style.top = Math.round(b.y || 0) + "px";
    fig.style.width = Math.round(b.width || 180) + "px";
    fig.style.height = Math.round(b.height || 140) + "px";
    fig.style.transform = "rotate(" + rot + "deg)";
    fig.style.zIndex = String(++zTop);

    var tape = document.createElement("span");
    tape.className = "photo-tape";
    fig.appendChild(tape);

    var img = document.createElement("img");
    img.alt = "手帐照片";
    img.draggable = false;
    fig.appendChild(img);

    var del = document.createElement("button");
    del.type = "button";
    del.className = "photo-del";
    del.setAttribute("aria-label", "删除照片");
    del.textContent = "×";
    del.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
    del.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();
      removeImageBlock(fig, id);
    });
    fig.appendChild(del);

    ["nw", "ne", "sw", "se"].forEach(function(pos){
      var h = document.createElement("span");
      h.className = "handle " + pos;
      h.setAttribute("data-pos", pos);
      fig.appendChild(h);
    });

    bindImageDrag(fig);
    el.paper.appendChild(fig);

    photoGetURL(id).then(function(u){
      if (u) img.src = u;
      else fig.classList.add("lost");
    });
    if (focus) fig.classList.add("active");
    return fig;
  }

  /** 删除照片：页面消失 + IndexedDB 删除 + 保存 */
  function removeImageBlock(fig, id){
    if (fig && fig.parentNode) fig.parentNode.removeChild(fig);
    photoDel(id);
    updatePaperHeight();
    updateWordCount();
    scheduleSave();
  }

  function bindImageDrag(fig){
    var mode = null, pos = null, sx = 0, sy = 0, ox = 0, oy = 0, ow = 0, oh = 0, ratio = 1;

    function onDown(e){
      if (e.pointerType === "mouse" && e.button !== 0) return;
      var t = e.target;
      if (t && t.classList && t.classList.contains("photo-del")) return;
      pos = (t && t.classList && t.classList.contains("handle")) ? t.getAttribute("data-pos") : null;
      mode = pos ? "resize" : "move";
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(fig.style.left) || 0;
      oy = parseFloat(fig.style.top) || 0;
      ow = fig.offsetWidth; oh = fig.offsetHeight;
      ratio = oh ? (ow / oh) : 1;
      fig.classList.add("dragging", "active");
      fig.style.zIndex = String(++zTop);
      try { fig.setPointerCapture(e.pointerId); } catch (err) {}
      if (e.preventDefault) e.preventDefault();
    }

    function onMove(e){
      if (!mode) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (mode === "move") {
        var nx = ox + dx, ny = oy + dy;
        var maxX = paperWidth() - 40;
        if (nx < -12) nx = -12;
        if (nx > maxX) nx = maxX;
        if (ny < -8) ny = -8;
        fig.style.left = Math.round(nx) + "px";
        fig.style.top = Math.round(ny) + "px";
      } else {
        var w = (pos === "ne" || pos === "se") ? ow + dx : ow - dx;
        var minW = 72, maxW = Math.max(160, paperWidth() + 60);
        if (w < minW) w = minW;
        if (w > maxW) w = maxW;
        var h = Math.round(w / ratio);
        var x = (pos === "nw" || pos === "sw") ? ox + (ow - w) : ox;
        var y = (pos === "nw" || pos === "ne") ? oy + (oh - h) : oy;
        fig.style.width = Math.round(w) + "px";
        fig.style.height = h + "px";
        fig.style.left = Math.round(x) + "px";
        fig.style.top = Math.round(y) + "px";
      }
      updatePaperHeight();
      if (e.preventDefault) e.preventDefault();
    }

    function onUp(e){
      if (!mode) return;
      mode = null;
      fig.classList.remove("dragging");
      try { fig.releasePointerCapture(e.pointerId); } catch (err) {}
      updatePaperHeight();
      scheduleSave();
    }

    fig.addEventListener("pointerdown", onDown);
    fig.addEventListener("pointermove", onMove);
    fig.addEventListener("pointerup", onUp);
    fig.addEventListener("pointercancel", onUp);
  }

  /** 当前纸面内容的下沿（用于新照片依次排在下方，避免相互压住） */
  function contentBottom(){
    var maxB = 10, i;
    var imgs = el.paper.querySelectorAll(".blk-img");
    for (i = 0; i < imgs.length; i++) {
      var b = (parseFloat(imgs[i].style.top) || 0) + imgs[i].offsetHeight;
      if (b > maxB) maxB = b;
    }
    var txt = el.paper.querySelectorAll(".blk-text");
    for (i = 0; i < txt.length; i++) {
      var tb = txt[i].offsetTop + txt[i].offsetHeight;
      if (tb > maxB) maxB = tb;
    }
    return maxB;
  }

  /** 添加照片（本地选择 / 粘贴 / 拖入），图片只存本机 */
  function addPhotos(files){
    var arr = [];
    for (var i = 0; i < files.length && arr.length < 9; i++) {
      var f = files[i];
      if (!f || !f.type || f.type.indexOf("image/") !== 0) continue;
      arr.push(f);
    }
    if (!arr.length) { setStatus("", "只支持图片文件"); return; }

    setStatus("saving", "正在添加照片…");
    var day = toKey(curDate);
    var base = el.paper.querySelectorAll(".blk-img").length;

    Promise.all(arr.map(function(file, k){
      return processImage(file).then(function(res){
        if (!res) return false;
        var id = newPhotoId();
        return photoPut(id, day, res.blob).then(function(where){
          if (!where) return false;
          var w = Math.min(240, Math.round(paperWidth() * 0.56));
          var inner = Math.max(60, w - 12);
          var h = Math.round(inner / (res.ratio || 1.2)) + 22;
          var idx = base + k;
          addImageBlock({
            id: id,
            x: 14 + (idx % 3) * 18,        // 轻微错位，避免完全对齐
            y: contentBottom() + 14,       // 依次排在现有内容下方
            width: w, height: h,
            rot: ROTS[idx % ROTS.length]
          }, true);
          return true;
        });
      }).catch(function(){ return false; });
    })).then(function(rs){
      var okCount = rs.filter(Boolean).length;
      updatePaperHeight();
      updateWordCount();
      if (okCount) scheduleSave();
      else setStatus("", "照片添加失败，请重试");
    });
  }

  /** 把某天数据渲染到纸面（Block 顺序 = 文字↓图片↓文字↓图片） */
  function renderPage(page, day){
    clearPaper();
    var blocks = (page && Array.isArray(page.blocks)) ? page.blocks : [];
    var hasText = false;
    blocks.forEach(function(b){
      if (!b) return;
      if (b.type === "image" && b.id) addImageBlock(b, false);
      else if (b.type === "text") { addTextBlock(b.content || "", false); hasText = true; }
    });
    if (!hasText) addTextBlock("", false);
    updatePaperHeight();
    updateWordCount();
  }

  /* ================= 模块 19：TextCursor 动效 =================
     来源：React Bits「TextCursor」(JS + CSS 版) https://reactbits.dev/micro/text-cursor
     原版是 React + motion 组件；本项目是零依赖单文件页面，故按官方源码 1:1 移植为
     原生 DOM + CSS 动画，参数、行为、生命周期清理保持一致：
       - 鼠标累计位移 >= spacing 时沿轨迹补点，最多保留 maxPoints 个
       - 每个点按鼠标方向旋转，随机轻微浮动，鼠标停下后逐个淡出移除
     作用范围：**整页**。动效挂在 body 上的固定浮层里，页面任意位置移动鼠标都会留下笔迹；
     浮层 pointer-events:none，不会拦截点击、拖拽、选择或滚动。
     抑制条件（两种，任一满足即不产生笔迹，并立即清空已显示的笔迹）：
       1) 正在编辑文字：焦点落在 input / textarea / select / contenteditable 上；
       2) 正在编辑时鼠标划过正文，不会在字上叠笔迹，避免干扰阅读与输入。
     设备条件：仅「精确指针 + 支持 hover」的设备挂载；触摸设备完全不挂载。
  */
  var TC_OPTIONS = {
    text: "✎",                    // 手帐风格笔迹（原版默认 "⚛️"）
    spacing: 90,                  // 每移动 90px 落一个点（原版 100）
    followMouseDirection: true,
    randomFloat: true,
    exitDuration: 0.5,
    removalInterval: 30,
    idleBeforeRemoval: 350,       // 停笔后多少毫秒开始回收（原版 100，太短会几乎看不见）
    maxPoints: 4
  };

  /* 「减弱动效」环境下的降级参数：仍然显示笔迹，但不浮动、不旋转、数量更少 */
  var TC_OPTIONS_CALM = {
    text: "✎",
    spacing: 110,
    followMouseDirection: false,
    randomFloat: false,
    exitDuration: 0.2,
    removalInterval: 30,
    idleBeforeRemoval: 500,
    maxPoints: 3
  };

  /* 是否因为系统「减弱动效」偏好而彻底关闭本动效。
     默认 false，原因（重要）：
       Windows「设置 → 辅助功能 → 视觉效果 → 动画效果」一旦关闭，Chrome / Edge 会把
       prefers-reduced-motion 报成 reduce。此时即使设备是完全正常的桌面 + 鼠标，动效也会被
       静默禁用，表现为"这个动效无法实现"。
     本动效只是标题区的小装饰、无眩晕风险，所以默认**降级而非关闭**：
     检测到 reduce 时改用 TC_OPTIONS_CALM（无浮动、无旋转、点数更少）。
     如需严格遵循系统偏好、直接不显示，把下面改成 true 即可。 */
  var TC_RESPECT_REDUCED_MOTION = false;

  var textCursor = null;

  function prefersReducedMotion(){
    try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
    catch (e) { return false; }
  }

  /** 是否真的是「有鼠标的桌面设备」：这是唯一必须满足的硬条件 */
  function hasMousePointer(){
    try { return !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches); }
    catch (e) { return false; }
  }

  /** 是否适合启用（触摸设备一律不挂载，不会出现异常光标） */
  function textCursorSupported(){
    if (!hasMousePointer()) return false;
    if (TC_RESPECT_REDUCED_MOTION && prefersReducedMotion()) return false;
    return true;
  }

  /** 当前应使用的参数：减弱动效环境下自动降级 */
  function textCursorOptions(){
    return prefersReducedMotion() ? TC_OPTIONS_CALM : TC_OPTIONS;
  }

  /** 当前是否正在编辑文字（输入框 / 文本域 / 下拉 / contenteditable 获得焦点） */
  function isEditingText(){
    try {
      var a = document.activeElement;
      if (!a || a === document.body || a === document.documentElement) return false;
      if (a.isContentEditable) return true;
      var tag = (a.tagName || "").toLowerCase();
      return tag === "input" || tag === "textarea" || tag === "select";
    } catch (e) { return false; }
  }

  /** 排查用：控制台执行 textCursorStatus() 可看到"为什么没有动效" */
  function textCursorStatus(){
    return {
      scope: "整页（body 固定浮层）",
      hasMousePointer: hasMousePointer(),
      prefersReducedMotion: prefersReducedMotion(),
      respectReducedMotion: TC_RESPECT_REDUCED_MOTION,
      mode: prefersReducedMotion() ? "calm（降级）" : "normal（完整）",
      mounted: !!document.querySelector(".text-cursor-layer"),
      editingText: isEditingText(),
      hint: !hasMousePointer()
        ? "未检测到精确指针（触摸设备），按设计不挂载"
        : (TC_RESPECT_REDUCED_MOTION && prefersReducedMotion()
            ? "系统开启了减弱动效，且 TC_RESPECT_REDUCED_MOTION = true，按配置不挂载"
            : (isEditingText()
                ? "当前焦点在文字编辑区，按设计临时不产生笔迹；点击页面空白处即恢复"
                : "满足启用条件，页面任意位置移动鼠标即可看到笔迹"))
    };
  }

  /**
   * 挂载动效，返回 { destroy } 句柄。
   * container 是挂在 body 上的整页固定浮层；坐标直接使用 e.clientX / e.clientY（视口坐标），
   * 因此页面滚动时笔迹依然精确跟随鼠标，不需要换算容器偏移。
   * destroy 会移除监听、回收定时器与 rAF、并一次性摘除浮层与全部节点，
   * 与 React 版 useEffect 的清理逻辑一一对应，不会留下内存泄漏。
   */
  function mountTextCursor(container, opts){
    var o = opts || TC_OPTIONS;
    container.setAttribute("aria-hidden", "true");

    var trail = [];              // 存活中的点（最多 maxPoints 个）
    var lastMoveTime = Date.now();
    var ticking = false;
    var pending = null;
    var rafId = 0;
    // 缓存"是否正在编辑文字"：只在焦点变化时重算，避免每次 mousemove 都做样式查询
    var editing = isEditingText();

    function randomData(){
      return o.randomFloat
        ? { rx: Math.random() * 10 - 5, ry: Math.random() * 10 - 5, rr: Math.random() * 10 - 5 }
        : { rx: 0, ry: 0, rr: 0 };
    }

    function makeItem(p){
      var el = document.createElement("div");
      el.className = "text-cursor-item";
      el.style.left = p.x + "px";      // 视口坐标，与 .text-cursor-layer 的 fixed 定位一致
      el.style.top = p.y + "px";
      el.style.setProperty("--tc-angle", p.angle + "deg");
      el.style.setProperty("--tc-rx", p.rx + "px");
      el.style.setProperty("--tc-ry", p.ry + "px");
      el.style.setProperty("--tc-rr", p.rr + "deg");
      el.style.setProperty("--tc-exit", o.exitDuration + "s");
      var span = document.createElement("span");
      span.className = o.randomFloat ? "text-cursor-float" : "text-cursor-static";
      span.textContent = o.text;
      el.appendChild(span);
      container.appendChild(el);
      return { el: el, x: p.x, y: p.y };
    }

    function pushPoint(p){
      var rec = makeItem(p);
      trail.push(rec);
      requestAnimationFrame(function(){ rec.el.classList.add("is-in"); });   // 入场淡入
      return rec;
    }

    /** 移除最旧的点：先播淡出，transitionend（或超时兜底）后再摘除节点 */
    function removeOldest(){
      var rec = trail.shift();
      if (!rec) return;
      var el = rec.el;
      var done = function(){
        el.removeEventListener("transitionend", done);
        if (el.parentNode) el.parentNode.removeChild(el);
      };
      el.addEventListener("transitionend", done);
      setTimeout(done, (o.exitDuration + 0.25) * 1000);
      el.classList.add("is-out");
    }

    /** 立即清空全部笔迹（进入文字编辑时调用，避免笔迹叠在正在输入的字上） */
    function clearTrail(){
      while (trail.length) removeOldest();
    }

    function flush(){
      ticking = false;
      var p = pending;
      pending = null;
      if (!p) return;

      if (trail.length === 0) {
        var d0 = randomData();
        pushPoint({ x: p.x, y: p.y, angle: 0, rx: d0.rx, ry: d0.ry, rr: d0.rr });
      } else {
        var last = trail[trail.length - 1];
        var dx = p.x - last.x;
        var dy = p.y - last.y;
        var distance = Math.sqrt(dx * dx + dy * dy);
        if (distance >= o.spacing) {
          var rawAngle = Math.atan2(dy, dx) * 180 / Math.PI;
          var angle = o.followMouseDirection ? rawAngle : 0;
          var steps = Math.floor(distance / o.spacing);
          for (var i = 1; i <= steps; i++) {
            var t = (o.spacing * i) / distance;
            var d = randomData();
            pushPoint({ x: last.x + dx * t, y: last.y + dy * t, angle: angle, rx: d.rx, ry: d.ry, rr: d.rr });
          }
        }
      }
      while (trail.length > o.maxPoints) removeOldest();
      lastMoveTime = Date.now();
    }

    function onMove(e){
      if (editing) {                          // 正在编辑文字：不产生笔迹
        if (trail.length) clearTrail();
        return;
      }
      pending = { x: e.clientX, y: e.clientY };
      if (ticking) return;
      ticking = true;
      rafId = requestAnimationFrame(flush);   // 每帧最多处理一次，高频移动/滚动不卡顿
    }

    /** 焦点变化时重算编辑态；一进入编辑就立刻清空已有笔迹 */
    function onFocusChange(){
      editing = isEditingText();
      if (editing && trail.length) clearTrail();
    }

    // 鼠标停下 idleBeforeRemoval 毫秒后，每 removalInterval 毫秒回收最旧的一个点
    var timer = setInterval(function(){
      if (Date.now() - lastMoveTime > (o.idleBeforeRemoval || 100) && trail.length > 0) removeOldest();
    }, o.removalInterval);

    // 监听整页：页面任意位置移动鼠标都会留下笔迹
    document.addEventListener("mousemove", onMove, { passive: true });
    document.addEventListener("focusin", onFocusChange);
    document.addEventListener("focusout", onFocusChange);

    return {
      destroy: function(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("focusin", onFocusChange);
        document.removeEventListener("focusout", onFocusChange);
        clearInterval(timer);
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        ticking = false;
        pending = null;
        trail.length = 0;
        if (container.parentNode) container.parentNode.removeChild(container);
      }
    };
  }

  function initTextCursor(){
    if (!textCursorSupported()) return null;   // 触摸设备：不挂载，不出现异常光标
    var layer = document.createElement("div");
    layer.className = "text-cursor-layer";
    document.body.appendChild(layer);
    try { textCursor = mountTextCursor(layer, textCursorOptions()); }
    catch (e) {
      textCursor = null;
      if (layer.parentNode) layer.parentNode.removeChild(layer);
    }
    return textCursor;
  }

  /* ================= 模块 20：自定义日历（日期格带心情背景） =================
     原生 <input type="date"> 弹出的日历由浏览器内核绘制，CSS/JS 都无法往里注入内容，
     所以这里自建日历弹层来替代它：
       - 每个日期格把「当天记录的心情 emoji」当作半透明背景（opacity .32），日期数字仍清晰可读
       - 当天没有记录心情时，只显示日期数字
       - 今天用描边标出，当前选中日期用主色填充
     原生 input 仍保留在页面上（外观、位置、value 全不变，其他逻辑照旧读 el.picker.value），
     上面盖一层透明按钮接管点击，因此原生日历不会再弹出。
  */
  var CAL_WEEK = ["一", "二", "三", "四", "五", "六", "日"];
  var calMonth = null;      // 当前展示的月份（该月 1 号）
  var calOpen = false;

  function calPop(){ return document.getElementById("calPop"); }

  /** 渲染 calMonth 这个月的月历；有心情记录的日期用该心情 emoji 做半透明背景 */
  function renderCal(){
    var pop = calPop();
    if (!pop || !calMonth) return;
    var y = calMonth.getFullYear(), m = calMonth.getMonth();
    var title = document.getElementById("calTitle");
    if (title) title.textContent = y + "年" + (m + 1) + "月";

    var week = pop.querySelector(".cal-week");
    if (week && !week.children.length) {
      var wh = "";
      for (var w = 0; w < 7; w++) wh += "<span>" + CAL_WEEK[w] + "</span>";
      week.innerHTML = wh;
    }

    var offset = (new Date(y, m, 1).getDay() + 6) % 7;         // 周一为一周的第一天
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var prevDays = new Date(y, m, 0).getDate();
    var rows = Math.ceil((offset + daysInMonth) / 7);
    var total = rows * 7;
    var sel = toKey(curDate), today = todayKey();

    var html = "";
    for (var i = 0; i < total; i++) {
      var dObj, out = false;
      if (i < offset) { dObj = new Date(y, m - 1, prevDays - offset + 1 + i); out = true; }
      else if (i >= offset + daysInMonth) { dObj = new Date(y, m + 1, i - offset - daysInMonth + 1); out = true; }
      else { dObj = new Date(y, m, i - offset + 1); }

      var day = toKey(dObj);
      var mood = readMood(day);                                 // 没有记录则为 null
      var cls = "cal-day" + (out ? " out" : "") + (day === today ? " is-today" : "") + (day === sel ? " is-sel" : "");
      html += '<button type="button" class="' + cls + '" data-day="' + esc(day) + '"' +
        (day === sel ? ' aria-current="date"' : '') +
        ' aria-label="' + esc(fmtDate(dObj) + (mood ? "，" + mood.label : "，无心情记录")) + '">' +
        (mood ? '<span class="cal-mood" aria-hidden="true">' + mood.emoji + '</span>' : '') +
        '<span class="cal-num">' + dObj.getDate() + '</span></button>';
    }
    var grid = document.getElementById("calGrid");
    if (grid) grid.innerHTML = html;
  }

  function openCal(){
    var pop = calPop();
    if (!pop) return;
    calMonth = new Date(curDate.getFullYear(), curDate.getMonth(), 1);
    renderCal();
    pop.hidden = false;
    calOpen = true;
    var t = document.getElementById("dateTrigger");
    if (t) t.setAttribute("aria-expanded", "true");
    setTimeout(function(){                                      // 打开后把焦点放到当前选中日期，方便键盘操作
      var b = pop.querySelector(".cal-day.is-sel") || pop.querySelector(".cal-day:not(.out)");
      if (b && b.focus) b.focus();
    }, 0);
  }
  function closeCal(){
    var pop = calPop();
    if (!pop || !calOpen) return;
    pop.hidden = true;
    calOpen = false;
    var t = document.getElementById("dateTrigger");
    if (t) t.setAttribute("aria-expanded", "false");
  }
  function toggleCal(){ if (calOpen) closeCal(); else openCal(); }

  function bindCal(){
    var wrap = document.getElementById("dateWrap");
    var pop = calPop();
    if (!wrap || !pop) return;

    var trigger = document.getElementById("dateTrigger");
    if (trigger) trigger.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleCal();
    });

    pop.addEventListener("click", function(e){
      var t = e.target;
      var nav = t.closest ? t.closest(".cal-nav") : null;
      if (nav) {
        var step = parseInt(nav.getAttribute("data-step"), 10) || 0;
        calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + step, 1);
        renderCal();
        return;
      }
      if (t.closest && t.closest(".cal-today")) { closeCal(); go(todayKey()); return; }
      var cell = t.closest ? t.closest(".cal-day") : null;
      if (cell) {
        var day = cell.getAttribute("data-day");
        closeCal();
        if (day) go(day);
      }
    });

    // 点击弹层外部关闭
    document.addEventListener("click", function(e){
      if (!calOpen) return;
      if (wrap.contains(e.target) || pop.contains(e.target)) return;
      closeCal();
    });

    // Esc 关闭；方向键在日期格之间移动焦点
    document.addEventListener("keydown", function(e){
      if (!calOpen) return;
      if (e.key === "Escape") {
        closeCal();
        var tg = document.getElementById("dateTrigger");
        if (tg) tg.focus();
        return;
      }
      var step = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1
               : e.key === "ArrowUp" ? -7 : e.key === "ArrowDown" ? 7 : 0;
      if (!step) return;
      var cur = document.activeElement;
      if (!cur || !cur.classList || !cur.classList.contains("cal-day")) return;
      e.preventDefault();
      var list = Array.prototype.slice.call(pop.querySelectorAll(".cal-day"));
      var idx = list.indexOf(cur);
      if (idx < 0) return;
      var next = list[idx + step];
      if (!next) {                                              // 跨月：翻页后聚焦首/末个日期
        calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (step < 0 ? -1 : 1), 1);
        renderCal();
        var list2 = Array.prototype.slice.call(pop.querySelectorAll(".cal-day"));
        next = step < 0 ? list2[list2.length + step] : list2[step - 1];
      }
      if (next && next.focus) next.focus();
    });
  }

  /* ================= 模块 12：渲染 ================= */
  function render(){
    var day = toKey(curDate);
    var d = curDate;
    el.dateMain.textContent = fmtDate(d);
    el.dateSub.textContent = WEEK[d.getDay()];
    el.picker.value = day;
    var dTrig = document.getElementById("dateTrigger");
    if (dTrig) dTrig.setAttribute("aria-label", "选择日期，当前 " + fmtDate(d));
    if (calOpen) renderCal();     // 日历展开时同步高亮当前选中日期
    clearTimeout(cityAskTimer);   // 换日期后作废挂起的"选城市"提示
    cityAskTimer = null;
    renderMood();                 // 恢复当天保存的心情
    renderStickers(day);          // 手帐贴纸（按日期稳定生成）
    clearPaper();                 // 先清空，避免切换瞬间显示上一天的图文
    loadContent(day);             // 异步恢复当天的手帐内容
    updateHead();
    updateWordCount();
    renderWeather();
    renderHistory();
    setStatus("", day === todayKey() ? "今天 · 写得自在" : "已切换");
  }

  function renderHistory(){
    if (!storage()) { el.histList.innerHTML = '<div class="hist-empty">本地存储不可用</div>'; return; }
    var days = buildHistory();
    if (days.length === 0) { el.histList.innerHTML = '<div class="hist-empty">还没有写过日记</div>'; return; }
    var html = "";
    days.slice(0, 20).forEach(function(day){
      var d = fromKey(day);
      var week = WEEK[d.getDay()];
      var weekShort = week.length > 2 ? week.slice(2, 3) : "";
      var t = getUpdated(day);
      var mood = readMood(day);                     // 当天心情 emoji
      var m = findMeta(day);
      var pics = (m && m.n) ? m.n : 0;              // 当天照片数
      html += '<button class="hist-item" data-key="' + esc(day) + '">' +
        '<span class="hist-left"><span class="hist-date">' + esc(day) + '</span>' +
        '<span class="hist-week">' + esc(weekShort) + '</span>' +
        (mood ? '<span class="hist-mood" title="' + esc(mood.label || "") + '">' + esc(mood.emoji || "") + '</span>' : '') +
        (pics > 0 ? '<span class="hist-pics">📷' + pics + '</span>' : '') +
        '</span>' +
        '<span class="hist-meta">' + (hhmm(t) ? esc(hhmm(t)) : "") + '</span></button>';
    });
    el.histList.innerHTML = html;
  }

  function go(day){
    flushBeforeSwitch().then(function(){      // 先等待当前日期保存完成
      curDate = fromKey(day);
      render();
      if (window.scrollTo) window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }
  function shiftDays(delta){
    flushBeforeSwitch().then(function(){      // 先等待当前日期保存完成
      var d = new Date(curDate.getFullYear(), curDate.getMonth(), curDate.getDate());
      d.setDate(d.getDate() + delta);
      curDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      render();
    });
  }

  /* ================= 模块 13：实时时钟 ================= */
  function tickClock(){
    var n = new Date();
    el.clock.textContent = fmtDate(n) + " " + WEEK[n.getDay()] + " " +
      pad2(n.getHours()) + ":" + pad2(n.getMinutes()) + ":" + pad2(n.getSeconds());
  }

  /* ================= 模块 14：城市弹窗 ================= */
  function closeCityDlg(){ try { el.cityDlg.close(); } catch (e) {} dlgDay = null; }

  /**
   * 打开城市弹窗：始终针对"当前浏览的这一天"。
   *  - 该日已有天气 -> 修改城市（重查该城市在该日期的天气并覆盖当天记录）
   *  - 该日无天气   -> 选择城市（今天查实时天气，过去查该日历史天气）
   */
  function openCityDlg(){
    dlgDay = toKey(curDate);
    var day = dlgDay;
    var today = todayKey();
    var snap = readSnap(day);

    el.cityInput.value = (snap && snap.city) || safeGetItem(storage(), K.city) || "";
    el.cityMsg.textContent = "";
    el.cityMsg.className = "dg-msg";

    var titleEl = $("dgTitle"), subEl = $("dgSub");
    if (titleEl) titleEl.textContent = hasWeather(snap) ? "修改天气城市" : "选择天气城市";
    if (subEl) {
      if (day === today) subEl.textContent = "将查询该城市今天的实时天气，城市名仅保存在本机。";
      else if (day < today) subEl.textContent = "将查询该城市在 " + day + " 当天的历史天气，城市名仅保存在本机。";
      else subEl.textContent = "未来日期暂无天气记录，城市名仅保存在本机。";
    }
    if (el.cityDlg.showModal) el.cityDlg.showModal();
  }

  /**
   * 补写历史日记时：该日期没有任何天气记录，就提示用户手动选择城市。
   * 每天每次会话只提示一次；取消后仍可点天气条重新选择。
   * 注意：等用户停手 2.5 秒且仍停在纸面上才弹，避免打字中途抢焦点。
   */
  var cityAskTimer = null;
  function scheduleCityAsk(){
    var day = toKey(curDate);
    if (day >= todayKey()) return;
    if (hasWeather(readSnap(day))) return;
    if (cityAsked[day]) return;
    clearTimeout(cityAskTimer);
    cityAskTimer = setTimeout(function(){
      cityAskTimer = null;
      if (toKey(curDate) !== day) return;
      if (hasWeather(readSnap(day))) return;
      if (cityAsked[day]) return;
      var ae = document.activeElement;
      if (!ae || !el.paper || !el.paper.contains(ae)) return;   // 已离开纸面，不再打断
      cityAsked[day] = true;
      openCityDlg();
    }, 2500);
  }
  function maybeAskCityForPastDay(){ scheduleCityAsk(); }

  /* ================= 模块 15：绑定与初始化 ================= */
  function bindEvents(){
    $("prevDay").addEventListener("click", function(){ shiftDays(-1); });
    $("nextDay").addEventListener("click", function(){ shiftDays(1); });
    $("todayBtn").addEventListener("click", function(){ go(todayKey()); });
    el.picker.addEventListener("change", function(){ if (el.picker.value) go(el.picker.value); });
    bindCal();   // 自定义日历（带心情背景），替代原生日历弹层
    // 心情：单选，可随时修改
    el.moodList.addEventListener("click", function(e){
      var b = e.target.closest && e.target.closest("button[data-mood]");
      if (b) pickMood(b.getAttribute("data-mood"));
    });
    // 手帐：加文字 / 加照片（本地选择、粘贴、拖入）
    $("addText").addEventListener("click", function(){ addTextBlock("", true); scheduleSave(); });
    $("addPhoto").addEventListener("click", function(){ el.photoInput.click(); });
    el.photoInput.addEventListener("change", function(){
      var files = el.photoInput.files;
      if (files && files.length) addPhotos(files);
      el.photoInput.value = "";
    });
    el.paper.addEventListener("paste", function(e){
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      var imgs = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === "file" && items[i].type && items[i].type.indexOf("image/") === 0) {
          var f = items[i].getAsFile();
          if (f) imgs.push(f);
        }
      }
      if (imgs.length) { e.preventDefault(); addPhotos(imgs); }
    });
    el.paper.addEventListener("dragover", function(e){ e.preventDefault(); });
    el.paper.addEventListener("drop", function(e){
      var files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) { e.preventDefault(); addPhotos(files); }
    });
    window.addEventListener("resize", function(){ updatePaperHeight(); });
    el.histList.addEventListener("click", function(e){
      var b = e.target.closest && e.target.closest("button[data-key]");
      if (b) go(b.getAttribute("data-key"));
    });
    el.weather.addEventListener("click", openCityDlg);
    $("cityGo").addEventListener("click", function(){
      var name = (el.cityInput.value || "").trim();
      if (!name) { el.cityMsg.textContent = "请输入城市名。"; el.cityMsg.className = "dg-msg err"; return; }
      try { lookupCity(name); }
      catch (e) { el.cityMsg.textContent = "查询异常，请稍后再试。"; el.cityMsg.className = "dg-msg err"; }
    });
    $("useLoc").addEventListener("click", function(){ el.cityMsg.textContent = "定位中…请授权…"; el.cityMsg.className = "dg-msg"; useGeolocation(); });
    $("cityClose").addEventListener("click", closeCityDlg);
    el.cityDlg.addEventListener("click", function(e){ if (e.target === el.cityDlg) closeCityDlg(); });
  }

  function init(){
    // 加密提示按实际能力动态显示（不误导）
    var lockEl = $("lockHint");
    if (lockEl) {
      if (hasSubtle) {
        lockEl.textContent = "🔒 已本地加密，仅保存在你的浏览器中";
        lockEl.classList.remove("muted");
      } else {
        lockEl.textContent = "本地保存，仅保存在当前浏览器中";
        lockEl.classList.add("muted");
      }
    }
    if (!hasSubtle) alert("当前浏览器不支持 Web Crypto，日记将以普通编码本地保存（该环境无法做到安全加密）。");
    curDate = new Date();                   // 打开默认今天
    curDate = new Date(curDate.getFullYear(), curDate.getMonth(), curDate.getDate());
    tickClock();
    setInterval(tickClock, 1000);
    bindEvents();
    render();
    // 天气：render() 内已按"该日是否已有记录"决定恢复 / 查询 / 等待用户手动选择城市（不静默定位）
    idbOpen();   // 预热照片库（IndexedDB：personal_diary_db）
    // TextCursor 动效（仅桌面精确指针设备挂载；失败不影响页面其余功能）
    window.textCursorStatus = textCursorStatus;   // 控制台可执行 textCursorStatus() 查看未生效原因
    try { initTextCursor(); } catch (e) { textCursor = null; }
    window.addEventListener("pagehide", function(){
      if (textCursor) { textCursor.destroy(); textCursor = null; }   // 卸载时清理监听/定时器/DOM
    });
  }

  try { init(); }
  catch (e) { /* 渲染失败时静态结构仍完整可读 */ }
})();
</script>

</body></html>
