<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机抽签器</title>
<style>/* CAMPUS_TOOL_STYLES */
.draw-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:18px}.draw-pool{max-height:420px;overflow:auto}.draw-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line,#e3e8ef)}.draw-item:last-child{border-bottom:0}.draw-index{width:26px;flex-shrink:0;color:var(--sub,#67748b);font-size:11px}.draw-name{flex:1;overflow-wrap:anywhere;font-size:14px}.draw-item.used .draw-name{color:var(--sub,#67748b)}.result-panel{background:var(--card,#fff);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:315px}.dice-art{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:var(--selected,#edf2fc);font-size:34px;margin:8px 0 20px;transform:rotate(-8deg)}.result-name{font-size:clamp(23px,4vw,35px);font-weight:750;line-height:1.5;overflow-wrap:anywhere;width:100%;margin:12px 0 7px}.result-panel .btn{width:100%;margin-top:23px;min-height:48px}.draw-entry{display:flex;gap:9px}.draw-entry input{flex:1;min-width:0}.draw-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;flex-wrap:wrap}.file-info{overflow-wrap:anywhere}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.import-help{font-size:12px;color:var(--sub,#67748b);line-height:1.8}.draw-result-note{min-height:24px;color:var(--sub,#67748b);font-size:12px}@media(max-width:700px){.draw-layout{grid-template-columns:1fr;gap:0}.result-panel{order:-1;min-height:275px}.preview-grid{grid-template-columns:1fr}}
</style></head><body><main class="tool-page">
<section id="poolPage">
  <header class="page-intro"><div><div class="eyebrow">让选择轻松一点</div><h1>随机抽签</h1><p>课堂点名、小组抽选，或交给随机数做一次日常选择。</p></div><div class="actions"><button type="button" class="btn" id="drawExport">导出名单</button><button type="button" class="btn primary" id="importOpen">＋ 导入名单</button></div></header>
  <div class="stat-row"><div class="stat"><strong id="poolCount">0</strong><span>池中选项</span></div><div class="stat"><strong id="remainingCount">0</strong><span>本轮可抽</span></div><div class="stat"><strong id="roundCount">0</strong><span>本轮已抽</span></div></div>
  <div class="draw-layout"><section class="panel"><div class="panel-head"><h2>我的抽签池</h2><span class="badge">本机保存</span></div><form id="addForm" class="draw-entry"><input class="search" id="itemName" maxlength="120" placeholder="输入一个姓名或选项" aria-label="抽签选项"><button class="btn" type="submit">添加</button></form><p id="poolStatus" class="status" role="status"></p><div id="itemList" class="draw-pool"></div><div class="draw-bottom"><label class="check"><input id="noRepeat" type="checkbox">本轮不重复抽取</label><div class="actions"><button type="button" class="btn small" id="resetRound">重开一轮</button><button type="button" class="btn small danger" id="clearPool">清空池子</button></div></div></section>
  <section class="panel result-panel"><div class="dice-art" aria-hidden="true">🎲</div><div class="muted">这一轮，交给随机数</div><div id="drawResult" class="result-name" role="status" aria-live="polite">等待抽签</div><div id="drawHint" class="draw-result-note">先准备名单，再开始抽取</div><button class="btn primary" type="button" id="drawStart">开始抽签</button></section></div>
</section>
<section id="importPage" hidden>
  <div class="back-row"><button type="button" class="btn" id="importCancel">‹ 返回抽签池</button><span class="badge">批量导入</span></div><header class="page-intro"><div><h1>把名单一次带进来</h1><p>选文件、检查姓名列，确认后才会写入抽签池。</p></div></header>
  <section class="panel"><label class="drop-zone" id="fileDrop"><b>选择文件，也可以拖到这里</b><small>TXT / CSV / TSV / JSON / Excel（.xlsx），最多 10 MB</small><input id="drawFile" type="file" accept=".txt,.csv,.tsv,.json,.xlsx" aria-label="导入抽签名单文件"></label><p class="import-help">TXT 每行一个选项；表格可选择姓名列。旧版 .xls 请先另存为 .xlsx 或 CSV。</p><p id="importStatus" class="status" role="status" aria-live="polite"></p>
  <div id="importOptions" hidden><div class="preview-grid"><label class="field" id="sheetField"><span>工作表</span><select id="sheetPick" aria-label="工作表"></select></label><label class="field"><span>导入哪一列</span><select id="columnPick" aria-label="选择姓名列"></select></label><label class="field" id="encodingField"><span>文字编码</span><select id="encodingPick"><option value="auto">自动识别</option><option value="utf-8">UTF-8</option><option value="gb18030">GB18030 / GBK（旧版 Excel CSV）</option></select></label><label class="field"><span>导入方式</span><select id="importMode"><option value="append">追加到现有名单</option><option value="replace">替换现有名单</option></select></label></div><div class="actions"><label class="check"><input type="checkbox" id="hasHeader">第一行是标题，跳过</label><label class="check"><input type="checkbox" id="dedupe" checked>去掉重复名称</label></div><div id="importSummary" class="import-preview"></div><div class="table-wrap"><table><thead><tr><th>序号</th><th>将导入的选项（前 30 项）</th></tr></thead><tbody id="importRows"></tbody></table></div><div class="form-foot"><span class="muted" id="importFileName"></span><button class="btn primary" id="importApply" type="button">确认导入</button></div></div></section>
</section></main>
<script>/* CAMPUS_INFLATE_LIBRARY */</script>
<script>
(function(){'use strict';
const KEY='personal_random-draw_list',LIMIT=5000,$=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=()=>{try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.name==='string'):[];}catch(e){throw new Error('现有名单无法读取，请先检查备份。');}};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+crypto.getRandomValues(new Uint32Array(2)).join('-');
let used=new Set(),round=0,source=null,sheets=[],preview=[],busy=false;
function message(id,text,error=false){$(id).textContent=text;$(id).classList.toggle('error',error);}
async function save(items){const entries=[[KEY,JSON.stringify(items)]];if(window.CampusPlugin)await CampusPlugin.write(entries);else localStorage.setItem(KEY,entries[0][1]);}
function render(){const list=read(),remaining=$('noRepeat').checked?list.filter(x=>!used.has(String(x.id))):list;$('poolCount').textContent=list.length;$('remainingCount').textContent=remaining.length;$('roundCount').textContent=round;$('itemList').innerHTML=list.length?list.map((x,i)=>`<div class="draw-item${used.has(String(x.id))?' used':''}"><span class="draw-index">${i+1}</span><span class="draw-name">${escapeHtml(x.name)}</span><button type="button" class="btn small danger" data-delete="${escapeHtml(x.id)}" aria-label="删除${escapeHtml(x.name)}">移除</button></div>`).join(''):'<div class="empty"><b>抽签池还空着</b>添加一个选项，或导入整份班级名单。</div>';}
async function action(fn){if(busy)return;busy=true;try{await fn();}catch(e){message('poolStatus',e.message,true);}finally{busy=false;}}
$('addForm').onsubmit=e=>{e.preventDefault();action(async()=>{const name=$('itemName').value.trim();if(!name)throw new Error('先填写一个姓名或选项。');const list=read();if(list.length>=LIMIT)throw new Error('抽签池最多保存 5000 个选项。');list.push({id:uid(),name});await save(list);$('itemName').value='';message('poolStatus','已添加 '+name);render();});};
$('itemList').onclick=e=>{const b=e.target.closest('[data-delete]');if(b)action(async()=>{await save(read().filter(x=>String(x.id)!==b.dataset.delete));used.delete(b.dataset.delete);render();});};
$('clearPool').onclick=()=>action(async()=>{if(!read().length||!confirm('清空抽签池里的全部选项？可以先导出名单。'))return;await save([]);used.clear();round=0;$('drawResult').textContent='等待抽签';message('poolStatus','抽签池已清空');render();});
$('resetRound').onclick=()=>{used.clear();round=0;$('drawResult').textContent='等待抽签';$('drawHint').textContent='已开始新一轮';render();};$('noRepeat').onchange=render;
$('drawStart').onclick=()=>{const list=read().filter(x=>!$('noRepeat').checked||!used.has(String(x.id)));if(!list.length){$('drawHint').textContent=read().length?'本轮已经全部抽完，可以重开一轮。':'请先添加或导入名单。';return;}let n,ceiling=4294967296-(4294967296%list.length);do{n=crypto.getRandomValues(new Uint32Array(1))[0];}while(n>=ceiling);const item=list[n%list.length];used.add(String(item.id));round++;$('drawResult').textContent=item.name;$('drawHint').textContent=$('noRepeat').checked?'本轮已抽取，不会再抽到这一项':'每个选项都有相同的抽中机会';render();};
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
$('drawExport').onclick=()=>download('抽签名单.json',JSON.stringify(read(),null,2),'application/json');
function reveal(){window.CampusPlugin?.reveal();}
function openImport(){if(busy)return;$('poolPage').hidden=true;$('importPage').hidden=false;reveal();}
$('importOpen').onclick=openImport;$('importCancel').onclick=()=>{if(busy)return;$('importPage').hidden=true;$('poolPage').hidden=false;reveal();};
function parseCSV(text,sep){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else if(quoted||!cell)quoted=!quoted;else cell+=c;}else if(c===sep&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';if(rows.length>LIMIT+1)throw new Error('名单超过 5000 行，请拆成较小的文件。');}else cell+=c;}if(quoted)throw new Error('表格有未闭合的引号，请检查 CSV 文件。');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function decode(buffer){const bytes=new Uint8Array(buffer),enc=$('encodingPick').value;if(enc!=='auto')return new TextDecoder(enc,{fatal:true}).decode(bytes);if(bytes[0]===255&&bytes[1]===254)return new TextDecoder('utf-16le').decode(bytes);if(bytes[0]===254&&bytes[1]===255)return new TextDecoder('utf-16be').decode(bytes);try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch(e){return new TextDecoder('gb18030',{fatal:true}).decode(bytes);}}
function xml(text){if(/<!DOCTYPE/i.test(text))throw new Error('这个表格含不支持的 XML 内容。');const d=new DOMParser().parseFromString(text,'application/xml');if(d.getElementsByTagName('parsererror').length)throw new Error('Excel 表格内容损坏。');return d;}
const tags=(node,name)=>Array.from(node.getElementsByTagNameNS('*',name));
function unzipXML(buffer){const bytes=new Uint8Array(buffer),v=new DataView(buffer),files=new Map();let end=-1,budget=0;for(let p=bytes.length-22;p>=Math.max(0,bytes.length-65557);p--)if(v.getUint32(p,true)===0x06054b50){end=p;break;}if(end<0)throw new Error('不是有效的 .xlsx 文件，旧 .xls 请先另存为 .xlsx。');const count=v.getUint16(end+10,true);let off=v.getUint32(end+16,true);if(count>5000)throw new Error('Excel 文件过于复杂，请导出为 CSV。');for(let i=0;i<count;i++){if(off+46>bytes.length||v.getUint32(off,true)!==0x02014b50)throw new Error('Excel 文件目录损坏。');const nameLen=v.getUint16(off+28,true),extra=v.getUint16(off+30,true),comment=v.getUint16(off+32,true);files.set(new TextDecoder().decode(bytes.subarray(off+46,off+46+nameLen)),{flags:v.getUint16(off+8,true),method:v.getUint16(off+10,true),size:v.getUint32(off+20,true),plain:v.getUint32(off+24,true),start:v.getUint32(off+42,true)});off+=46+nameLen+extra+comment;}
return name=>{const f=files.get(name);if(!f)return null;if(f.flags&1)throw new Error('加密的 Excel 请解密后再导入。');if(f.plain>8000000||budget+f.plain>24000000)throw new Error('Excel 展开内容过大，请只保留名单工作表。');const p=f.start;if(p+30>bytes.length||v.getUint32(p,true)!==0x04034b50)throw new Error('Excel 文件内容损坏。');const start=p+30+v.getUint16(p+26,true)+v.getUint16(p+28,true);if(start+f.size>bytes.length)throw new Error('Excel 文件不完整。');let data=bytes.subarray(start,start+f.size);if(f.method===8){if(typeof pako==='undefined')throw new Error('Excel 读取组件未加载，请联网刷新后重试。');const chunks=[];let length=0;const stream=new pako.Inflate({raw:true,chunkSize:65536});stream.onData=chunk=>{length+=chunk.length;if(length>8000000||budget+length>24000000)throw new Error('Excel 展开内容过大。');chunks.push(chunk);};stream.push(data,true);if(stream.err)throw new Error('Excel 压缩内容损坏。');data=new Uint8Array(length);let k=0;for(const chunk of chunks){data.set(chunk,k);k+=chunk.length;}}else if(f.method!==0)throw new Error('这个 Excel 压缩格式不支持，请另存为 CSV。');if(data.length!==f.plain)throw new Error('Excel 文件内容长度不一致。');budget+=data.length;return new TextDecoder().decode(data);};}
function excel(buffer){const extract=unzipXML(buffer),workbook=xml(extract('xl/workbook.xml')||''),rels=xml(extract('xl/_rels/workbook.xml.rels')||''),paths=new Map(tags(rels,'Relationship').map(x=>[x.getAttribute('Id'),x.getAttribute('Target')])),sharedXML=extract('xl/sharedStrings.xml'),shared=sharedXML?tags(xml(sharedXML),'si').map(x=>tags(x,'t').map(t=>t.textContent).join('')):[];return tags(workbook,'sheet').map(sheet=>{const id=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let path=paths.get(id)||'';path=path.startsWith('/')?path.slice(1):'xl/'+path;const normalized=[];for(const part of path.split('/')){if(part==='..')normalized.pop();else if(part&&part!=='.')normalized.push(part);}const content=extract(normalized.join('/'));if(!content)return null;const rows=tags(xml(content),'row').map(r=>{const row=[];for(const c of tags(r,'c')){const ref=(c.getAttribute('r')||'A').match(/^[A-Z]+/);let col=0;for(const ch of ref?ref[0]:'A')col=col*26+ch.charCodeAt(0)-64;if(col>1000)continue;const kind=c.getAttribute('t'),value=tags(c,'v')[0]?.textContent||'';row[col-1]=kind==='s'?shared[Number(value)]||'':kind==='inlineStr'?tags(c,'t').map(t=>t.textContent).join(''):value;}return row;}).filter(r=>r.some(x=>String(x||'').trim()));if(rows.length>LIMIT+1)throw new Error('工作表超过 5000 行，请拆分名单。');return {name:sheet.getAttribute('name')||'工作表',rows};}).filter(Boolean);}
function textSheets(buffer,name){const text=decode(buffer).replace(/^\uFEFF/,'');let rows;if(/\.json$/i.test(name)){const obj=JSON.parse(text),a=Array.isArray(obj)?obj:obj.items||obj.list;if(!Array.isArray(a))throw new Error('JSON 需要是名称数组或含 name 的对象数组。');rows=a.map(x=>[typeof x==='object'&&x?x.name??x['姓名']??x.title??'':x]);}else{const first=text.split(/\r?\n/,1)[0],sep=/\.tsv$/i.test(name)||first.includes('\t')?'\t':/\.csv$/i.test(name)?(first.includes(';')&&!first.includes(',')?';':','):'\u0000';rows=parseCSV(text,sep);}if(rows.length>LIMIT+1)throw new Error('名单超过 5000 行。');return [{name:'名单',rows}];}
function applySheet(){const sheet=sheets[Number($('sheetPick').value)||0],rows=sheet?.rows||[];const first=rows[0]||[],columns=Math.min(100,Math.max(1,...rows.slice(0,100).map(r=>r.length)));$('columnPick').innerHTML=Array.from({length:columns},(_,i)=>`<option value="${i}">第 ${i+1} 列${first[i]?' · '+escapeHtml(String(first[i]).slice(0,35)):''}</option>`).join('');const hit=first.findIndex(x=>/^(姓名|名字|名称|选项|抽签项|name|title)$/i.test(String(x||'').trim()));$('hasHeader').checked=hit>=0;$('columnPick').value=String(hit>=0?hit:0);updatePreview();}
function updatePreview(){try{const sheet=sheets[Number($('sheetPick').value)||0],rows=(sheet?.rows||[]).slice($('hasHeader').checked?1:0),col=Number($('columnPick').value),existing=$('importMode').value==='append'?read():[],seen=new Set($('dedupe').checked?existing.map(x=>x.name.trim()):[]);let duplicates=0,invalid=0;preview=[];for(const row of rows){const name=String(row[col]??'').trim();if(!name||name.length>120){invalid++;continue;}if($('dedupe').checked&&seen.has(name)){duplicates++;continue;}seen.add(name);preview.push(name);}$('importSummary').innerHTML=`<strong>${preview.length}</strong>个选项将${$('importMode').value==='append'?'追加':'替换'}进抽签池<p>跳过 ${duplicates} 个重复名称、${invalid} 个空白或超过 120 字的选项。现有 ${read().length} 项。</p>`;$('importRows').innerHTML=preview.slice(0,30).map((name,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(name)}</td></tr>`).join('');$('importApply').disabled=!preview.length||existing.length+preview.length>LIMIT;if(existing.length+preview.length>LIMIT)message('importStatus','合并后超过 5000 项，请拆分名单或选用替换。',true);else message('importStatus','名单已读取，请检查预览后确认。');}catch(e){message('importStatus',e.message,true);$('importApply').disabled=true;}}
async function parseFile(file){if(!file)return;$('importOptions').hidden=true;preview=[];if(file.size>10000000){message('importStatus','文件超过 10 MB，请只保留名单内容。',true);return;}if(!/\.(txt|csv|tsv|json|xlsx)$/i.test(file.name)){message('importStatus','请选择 TXT、CSV、TSV、JSON 或 .xlsx；旧 .xls 请另存为 .xlsx。',true);return;}source={name:file.name,buffer:await file.arrayBuffer()};$('importOptions').hidden=true;message('importStatus','正在读取名单…');try{const isExcel=/\.xlsx$/i.test(source.name);sheets=isExcel?excel(source.buffer):textSheets(source.buffer,source.name);if(!sheets.length||!sheets.some(x=>x.rows.length))throw new Error('文件里没有可以导入的名单。');$('sheetPick').innerHTML=sheets.map((s,i)=>`<option value="${i}">${escapeHtml(s.name)}</option>`).join('');$('sheetField').hidden=sheets.length<2;$('encodingField').hidden=isExcel||/\.json$/i.test(source.name);$('importFileName').textContent=source.name;$('importOptions').hidden=false;applySheet();}catch(e){message('importStatus',e.message||'名单读取失败，请检查格式。',true);}}
$('drawFile').onchange=()=>{const file=$('drawFile').files[0];$('drawFile').value='';parseFile(file).catch(e=>message('importStatus',e.message,true));};
$('sheetPick').onchange=applySheet;for(const id of ['columnPick','hasHeader','dedupe','importMode'])$(id).onchange=updatePreview;$('encodingPick').onchange=()=>{if(source)parseFile(new File([source.buffer],source.name));};
$('fileDrop').ondragover=e=>{e.preventDefault();$('fileDrop').classList.add('dragging');};$('fileDrop').ondragleave=()=>$('fileDrop').classList.remove('dragging');$('fileDrop').ondrop=e=>{e.preventDefault();$('fileDrop').classList.remove('dragging');parseFile(e.dataTransfer.files[0]).catch(err=>message('importStatus',err.message,true));};
$('importApply').onclick=async()=>{if(busy||!preview.length)return;busy=true;$('importApply').disabled=true;try{updatePreview();const replace=$('importMode').value==='replace';if(replace&&read().length&&!confirm(`用这 ${preview.length} 个选项替换现有 ${read().length} 个？`))return;const list=(replace?[]:read()).concat(preview.map(name=>({id:uid(),name})));if(list.length>LIMIT)throw new Error('超过 5000 项，请缩小名单。');await save(list);used.clear();round=0;$('drawResult').textContent='等待抽签';$('importPage').hidden=true;$('poolPage').hidden=false;message('poolStatus',`已导入 ${preview.length} 个选项。`);render();reveal();}catch(e){message('importStatus',e.message,true);}finally{busy=false;$('importApply').disabled=!preview.length;}};
window.addEventListener('storage',e=>{if(e.key===KEY){render();if(!$('importPage').hidden)updatePreview();}});try{render();}catch(e){message('poolStatus',e.message,true);}
})();
</script></body></html>
